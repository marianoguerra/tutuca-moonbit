<div class="flex items-stretch max-w-xl bsky-post">
  <span class="w-4 shrink-0 rail" @each=".rail"></span>
  <div class="grow min-w-0 flex flex-col gap-1">
    <div class="flex items-center gap-2 text-xs text-base-content/60 attribution" @show="truthy? .hasAttribution">
      <a class="hover:underline hover:text-sky-500 reposted-by" @show="truthy? .viaRepost" :href="$'https://bsky.app/{.repostPath}'" target="_blank" rel="noopener noreferrer" @text=".repostLabel"></a>
      <span class="pinned" @show=".pinned">Pinned by the author</span>
    </div>
    <article @if.class=".focus" @then="'grow min-w-0 rounded-xl border border-sky-500 bg-base-100 p-3 bsky-card focal'" @else="'grow min-w-0 rounded-xl border border-base-300 bg-base-100 p-3 bsky-card'" :title="$summary">
      <div class="flex items-start gap-2.5">
        <div @if.class=".owned" @then="'relative size-6 shrink-0 rounded-full bg-base-300 flex items-center justify-center text-xs font-semibold text-base-content/70 overflow-hidden bsky-avatar'" @else="'relative size-10 shrink-0 rounded-full bg-base-300 flex items-center justify-center text-sm font-semibold text-base-content/70 overflow-hidden bsky-avatar'">
          <span @text=".initials"></span>
          <img class="absolute inset-0 size-full object-cover avatar-image" alt="" @show="truthy? .avatarPath" :src="$'https://cdn.bsky.app/{.avatarPath}'">
        </div>
        <div class="flex flex-col min-w-0 grow gap-1.5">
          <div class="flex items-baseline gap-1.5 flex-wrap leading-tight">
            <span class="text-sm font-bold name" @text=".name"></span>
            <a class="text-sm text-base-content/60 hover:underline handle" @show="truthy? .handle" :href="$'https://bsky.app/profile/{.handle}'" target="_blank" rel="noopener noreferrer" @text=".handleText"></a>
            <span class="text-sm text-base-content/40" aria-hidden="true">·</span>
            <time class="text-sm text-base-content/60 time" :datetime=".createdAt" :title=".createdAt" @text=".time"></time>
            <button class="ml-auto text-xs text-base-content/50 hover:text-sky-500 cursor-pointer fold" @show="truthy? .foldable" @on.click="toggleFold" :title="$foldTitle" @text=".foldLabel"></button>
          </div>
          <div class="flex flex-wrap gap-1 labels" @show="truthy? .hasLabels" :title=".labelTitle">
            <span class="rounded-full border border-warning px-2 py-0.5 text-xs font-medium text-warning label" @each=".labels"><x text="@value"></x></span>
          </div>
          <p class="text-sm leading-relaxed whitespace-pre-wrap break-words text"><span @each=".segments"><a @show="truthy? @value.path" class="text-sky-500 hover:underline seg-facet" :href="$'https://bsky.app/{@value.path}'" target="_blank" rel="noopener noreferrer" :title="@value.target" @text="@value.text"></a><span @show="truthy? @value.external" class="text-sky-500 hover:underline seg-facet" :title="@value.target" @text="@value.text"></span><x text="@value.text" @hide="truthy? @value.target"></x></span></p>
          <div class="flex flex-wrap gap-1.5 images" @hide="empty? .imageItems">
            <span @each=".imageItems"><img class="max-h-40 rounded-lg border border-base-300 object-cover image-thumb" @show="truthy? @value.path" :src="$'https://cdn.bsky.app/{@value.path}'" :alt="@value.alt" :title="@value.alt"><span class="rounded-full border border-base-300 px-2 py-0.5 text-xs text-base-content/60 image" @hide="truthy? @value.path" @text="@value.alt"></span></span>
          </div>
          <div class="video" @show="truthy? .hasVideo">
            <div class="relative inline-block rounded-lg border border-base-300 overflow-hidden" @show="truthy? .videoThumbPath">
              <img class="max-h-40 object-cover video-thumb" :src="$'https://cdn.bsky.app/{.videoThumbPath}'" :alt=".videoAlt" :title=".videoAlt">
              <span class="absolute inset-0 flex items-center justify-center text-2xl text-base-100 video-play" aria-hidden="true">▶</span>
            </div>
            <span class="rounded-full border border-base-300 px-2 py-0.5 text-xs text-base-content/60 video-alt" @hide="truthy? .videoThumbPath" @text=".videoAlt"></span>
          </div>
          <div class="flex gap-2 rounded-lg border border-base-300 overflow-hidden external" @show="truthy? .hasExternal" :title=".externalTarget">
            <img class="size-20 shrink-0 object-cover external-thumb" alt="" @show="truthy? .externalThumbPath" :src="$'https://cdn.bsky.app/{.externalThumbPath}'">
            <div class="flex flex-col gap-0.5 p-2 min-w-0">
              <span class="text-xs text-base-content/50 external-host" @text=".externalHost"></span>
              <span class="text-sm font-semibold break-words external-title" @show="truthy? .externalTitle" @text=".externalTitle"></span>
              <span class="text-xs text-base-content/60 break-words external-description" @show="truthy? .externalDescription" @text=".externalDescription"></span>
            </div>
          </div>
          <div class="rounded-lg border border-base-300 p-2 flex flex-col gap-1 quote" @show="truthy? .hasQuote">
            <div class="flex items-baseline gap-1.5 flex-wrap leading-tight">
              <div class="relative size-5 shrink-0 self-center rounded-full bg-base-300 flex items-center justify-center text-xs font-semibold text-base-content/70 overflow-hidden quote-avatar">
                <span @text=".quoteInitials"></span>
                <img class="absolute inset-0 size-full object-cover avatar-image" alt="" @show="truthy? .quoteAvatarPath" :src="$'https://cdn.bsky.app/{.quoteAvatarPath}'">
              </div>
              <span class="text-xs font-bold quote-name" @text=".quoteName"></span>
              <span class="text-xs text-base-content/60 quote-handle" @text=".quoteHandleText"></span>
              <span class="text-xs text-base-content/60 quote-time" @text=".quoteTime"></span>
            </div>
            <p class="text-sm leading-relaxed whitespace-pre-wrap break-words quote-text" @text=".quoteText"></p>
            <a class="text-xs text-base-content/40 break-all hover:underline hover:text-sky-500 quote-permalink" @show="truthy? .quotePermalinkPath" :href="$'https://bsky.app/{.quotePermalinkPath}'" target="_blank" rel="noopener noreferrer" @text=".quotePermalink"></a>
          </div>
          <div class="flex items-center gap-3 text-xs counts">
            <span class="replies"><span class="font-semibold" @text=".replies"></span> <span class="text-base-content/60">replies</span></span>
            <button @if.class=".reposted" @then="'cursor-pointer text-sky-500 repost'" @else="'cursor-pointer hover:text-sky-500 repost'" @on.click="toggleRepost"><span class="font-semibold" @text=".reposts"></span> <span class="text-base-content/60">reposts</span></button>
            <button @if.class=".liked" @then="'cursor-pointer text-sky-500 like'" @else="'cursor-pointer hover:text-sky-500 like'" @on.click="toggleLike"><span class="font-semibold" @text=".likes"></span> <span class="text-base-content/60">likes</span></button>
          </div>
          <a class="text-xs text-base-content/40 break-all hover:underline hover:text-sky-500 permalink" @show="truthy? .permalinkPath" :href="$'https://bsky.app/{.permalinkPath}'" target="_blank" rel="noopener noreferrer" @text=".permalink"></a>
        </div>
      </div>
    </article>
  </div>
</div>
