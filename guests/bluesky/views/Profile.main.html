<div class="rounded-xl border border-base-300 bg-base-100 overflow-hidden max-w-xl bsky-profile" :title="$summary">
  <div class="relative h-16 bg-base-200 overflow-hidden banner">
    <img class="absolute inset-0 size-full object-cover banner-image" alt="" @show="truthy? .bannerPath" :src="$'https://cdn.bsky.app/{.bannerPath}'">
  </div>
  <div class="px-4 pb-4">
    <div class="flex items-end gap-3 -mt-8">
      <div class="relative size-16 shrink-0 rounded-full bg-base-300 border-4 border-base-100 flex items-center justify-center text-lg font-semibold text-base-content/70 overflow-hidden bsky-avatar">
        <span @text=".initials"></span>
        <img class="absolute inset-0 size-full object-cover avatar-image" alt="" @show="truthy? .avatarPath" :src="$'https://cdn.bsky.app/{.avatarPath}'">
      </div>
      <button @if.class=".following" @then="'ml-auto rounded-full border border-sky-500 bg-sky-500 px-4 py-1 text-sm font-semibold text-base-100 cursor-pointer follow'" @else="'ml-auto rounded-full border border-base-300 px-4 py-1 text-sm font-semibold cursor-pointer hover:border-sky-500 hover:text-sky-500 follow'" @on.click="toggleFollow" @text="$followLabel"></button>
    </div>
    <div class="mt-2 leading-tight">
      <div class="text-xl font-bold name" @text=".name"></div>
      <a class="text-sm text-base-content/60 hover:underline handle" @show="truthy? .handle" :href="$'https://bsky.app/profile/{.handle}'" target="_blank" rel="noopener noreferrer" @text=".handleText"></a>
    </div>
    <p class="mt-2 text-sm leading-relaxed whitespace-pre-wrap description" @show="truthy? .description" @text=".description"></p>
    <div class="mt-3 flex gap-4 text-sm counts">
      <span class="followers"><span class="font-semibold" @text=".followersLabel"></span> <span class="text-base-content/60">followers</span></span>
      <span class="follows"><span class="font-semibold" @text=".followsLabel"></span> <span class="text-base-content/60">following</span></span>
      <span class="posts"><span class="font-semibold" @text=".postsLabel"></span> <span class="text-base-content/60">posts</span></span>
    </div>
    <div class="mt-2 flex gap-3 flex-wrap items-baseline text-xs text-base-content/60">
      <span class="joined" @show="truthy? .hasJoined" :title=".createdAt" @text=".joinedLabel"></span>
      <a class="hover:underline hover:text-sky-500 pinned-post" @show="truthy? .hasPinned" :href="$'https://bsky.app/{.pinnedPath}'" target="_blank" rel="noopener noreferrer" :title=".pinnedPost">Pinned post</a>
    </div>
  </div>
  <div class="border-t border-base-300 bg-base-200/40 p-4 flex flex-col gap-2 feed" @hide="empty? .rows">
    <div class="text-xs uppercase tracking-widest text-base-content/50 recent-label">Recent</div>
    <x render-each=".rows"></x>
    <footer class="flex flex-wrap items-center gap-2 pager" @show="$paged">
      <span class="text-xs text-base-content/50 range" @text="$rangeLabel"></span>
      <div class="ml-auto flex items-center gap-1">
        <button class="cursor-pointer rounded-md border border-base-300 px-2 text-xs font-semibold hover:border-sky-500 hover:text-sky-500 disabled:pointer-events-none disabled:opacity-30 first" @on.click="firstPage" :disabled="$atFirst" title="first page">«</button>
        <button class="cursor-pointer rounded-md border border-base-300 px-2 text-xs font-semibold hover:border-sky-500 hover:text-sky-500 disabled:pointer-events-none disabled:opacity-30 prev" @on.click="prevPage" :disabled="$atFirst" title="previous page">‹</button>
        <span class="px-1 text-xs text-base-content/50 page" @text="$pageLabel"></span>
        <button class="cursor-pointer rounded-md border border-base-300 px-2 text-xs font-semibold hover:border-sky-500 hover:text-sky-500 disabled:pointer-events-none disabled:opacity-30 next" @on.click="nextPage" :disabled="$atLast" title="next page">›</button>
        <button class="cursor-pointer rounded-md border border-base-300 px-2 text-xs font-semibold hover:border-sky-500 hover:text-sky-500 disabled:pointer-events-none disabled:opacity-30 last" @on.click="lastPage" :disabled="$atLast" title="last page">»</button>
      </div>
    </footer>
  </div>
</div>
