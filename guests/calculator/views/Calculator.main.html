<div class="card card-border bg-base-100 border-base-300 shadow-sm w-64 calculator"><div class="card-body gap-3 p-4"><div class="rounded-box bg-base-200 px-3 py-2 text-right"><div class="h-4 text-xs opacity-50 font-mono tabular-nums pending" @text="$pendingLabel"></div><div class="text-3xl font-mono tabular-nums truncate display" @text=".display"></div></div><div class="grid grid-cols-4 gap-1.5 pad"><button class="btn btn-error btn-soft k" @on.click="clear">C</button><button class="btn btn-soft k" @on.click="negate">±</button><button class="btn btn-soft k" @on.click="back">←</button><button class="btn btn-primary k" @on.click="operate '/'">/</button><button class="btn  k" @on.click="digit '7'">7</button><button class="btn  k" @on.click="digit '8'">8</button><button class="btn  k" @on.click="digit '9'">9</button><button class="btn btn-primary k" @on.click="operate '*'">*</button><button class="btn  k" @on.click="digit '4'">4</button><button class="btn  k" @on.click="digit '5'">5</button><button class="btn  k" @on.click="digit '6'">6</button><button class="btn btn-primary k" @on.click="operate '-'">-</button><button class="btn  k" @on.click="digit '1'">1</button><button class="btn  k" @on.click="digit '2'">2</button><button class="btn  k" @on.click="digit '3'">3</button><button class="btn btn-primary k" @on.click="operate '+'">+</button><button class="btn col-span-2 k" @on.click="digit '0'">0</button><button class="btn  k" @on.click="point">.</button><button class="btn btn-secondary k" @on.click="equals">=</button></div></div></div>
