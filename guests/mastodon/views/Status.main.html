<div class="flex items-stretch max-w-xl masto-status">
  <span class="w-5 shrink-0 ml-2.5 border-l border-base-300 rail" @each=".rail"></span>
  <article @if.class=".owned" @then="'grow min-w-0 bg-base-100 px-4 py-3 masto-card'" @else="'grow min-w-0 rounded-xl border border-base-300 bg-base-100 p-4 masto-card'" :title="$summary">
    <div @if.class=".focus" @then="'border-l-2 border-indigo-500 pl-3 focal'" @else="''">
      <div class="mb-2 flex items-center gap-1.5 text-xs font-medium text-base-content/60 boosted" @show="truthy? .boostedBy"><span aria-hidden="true">⇄</span><span @text=".boostLabel"></span></div>
      <div class="flex items-start gap-2.5">
        <a @if.class=".owned" @then="'relative size-9 shrink-0 rounded-lg bg-base-300 flex items-center justify-center text-xs font-semibold text-base-content/70 overflow-hidden masto-avatar'" @else="'relative size-11 shrink-0 rounded-lg bg-base-300 flex items-center justify-center text-sm font-semibold text-base-content/70 overflow-hidden masto-avatar'" :href="$'https://mastodon.social/{.profilePath}'" target="_blank" rel="noopener noreferrer">
          <span @text=".initials"></span>
          <img class="absolute inset-0 size-full object-cover avatar-image" alt="" @show="truthy? .avatarPath" :src="$'https://files.mastodon.social/{.avatarPath}'">
        </a>
        <div class="flex min-w-0 grow flex-col leading-tight">
          <span class="truncate text-sm font-bold name" @text=".name"></span>
          <a class="truncate text-sm text-base-content/60 hover:underline handle" @show="truthy? .acct" :href="$'https://mastodon.social/{.profilePath}'" target="_blank" rel="noopener noreferrer" @text=".handleText"></a>
        </div>
        <div class="flex shrink-0 items-center gap-1.5 text-xs text-base-content/50">
          <span class="rounded-full border border-base-300 px-1.5 pinned" @show=".pinned">Pinned</span>
          <span class="visibility" :title=".visibilityLabel" @text=".visibilityGlyph"></span>
          <time class="time" :datetime=".createdAt" :title=".createdAt" @text=".time"></time>
        </div>
      </div>
      <div class="mt-2 flex items-center gap-2 rounded-lg bg-base-200 px-3 py-2 text-sm cw" @show=".hasSpoiler">
        <span class="grow spoiler" @text=".spoilerText"></span>
        <button class="cursor-pointer rounded-full border border-base-300 px-2 text-xs font-semibold hover:border-indigo-500 hover:text-indigo-500 reveal" @on.click="toggleReveal" @text="$revealLabel"></button>
      </div>
      <div class="body" @show=".bodyShown">
        <p class="mt-2 whitespace-pre-wrap break-words text-sm leading-relaxed text"><span @each=".segments"><a @show="truthy? @value.path" class="text-indigo-500 hover:underline seg-facet" :href="$'https://mastodon.social/{@value.path}'" target="_blank" rel="noopener noreferrer" :title="@value.target" @text="@value.text"></a><span @show="truthy? @value.external" class="text-indigo-500 hover:underline seg-link" :title="@value.target" @text="@value.text"></span><x text="@value.text" @hide="truthy? @value.target"></x></span></p>
        <div class="mt-2 flex flex-col gap-1.5 media" @hide="empty? .mediaItems">
          <span class="relative block media-item" @each=".mediaItems"><img class="max-h-96 w-full rounded-lg border border-base-300 object-contain media-thumb" @show="truthy? @value.path" :src="$'https://files.mastodon.social/{@value.path}'" :alt="@value.description" :title="@value.description"><span class="block rounded-lg border border-dashed border-base-300 px-2 py-1 text-xs text-base-content/60 media-alt" @hide="truthy? @value.path" @text="@value.description"></span><span class="absolute bottom-1 left-1 rounded bg-base-300 px-1 text-xs font-bold alt-badge" @show="truthy? @value.described" :title="@value.description">ALT</span></span>
        </div>
        <div class="mt-2 poll" @hide="empty? .pollRows"><x render-each=".pollRows"></x></div>
      </div>
      <div class="mt-3 flex items-center gap-5 text-xs text-base-content/60 actions">
        <button class="flex cursor-pointer items-center gap-1 hover:text-indigo-500 reply" @on.click="reply" title="reply"><span aria-hidden="true">↩︎</span><span @text=".replies"></span></button>
        <button @if.class=".reblogged" @then="'flex items-center gap-1 cursor-pointer font-semibold text-indigo-500 boost'" @else="'flex items-center gap-1 cursor-pointer hover:text-indigo-500 boost'" @on.click="toggleBoost" :title="$boostTitle"><span aria-hidden="true">⇄</span><span @text=".reblogs"></span></button>
        <button @if.class=".favourited" @then="'flex items-center gap-1 cursor-pointer font-semibold text-amber-500 favourite'" @else="'flex items-center gap-1 cursor-pointer hover:text-amber-500 favourite'" @on.click="toggleFavourite" title="favourite"><span aria-hidden="true">★</span><span @text=".favourites"></span></button>
        <button @if.class=".bookmarked" @then="'cursor-pointer text-rose-500 bookmark'" @else="'cursor-pointer hover:text-rose-500 bookmark'" @on.click="toggleBookmark" title="bookmark"><span aria-hidden="true">⚑︎</span></button>
        <span class="italic edited" @show=".edited">edited</span>
        <button class="ml-auto cursor-pointer hover:text-indigo-500 fold" @show="truthy? .foldable" @on.click="toggleFold" :title="$foldTitle" @text=".foldLabel"></button>
      </div>
      <a class="mt-1 block break-all text-xs text-base-content/40 hover:text-indigo-500 hover:underline permalink" @show="truthy? .permalinkPath" :href="$'https://mastodon.social/{.permalinkPath}'" target="_blank" rel="noopener noreferrer" @text=".permalink"></a>
      <span class="mt-1 block break-all text-xs text-base-content/40 remote-permalink" @show=".remoteLink" :title=".url" @text=".permalink"></span>
    </div>
  </article>
</div>
