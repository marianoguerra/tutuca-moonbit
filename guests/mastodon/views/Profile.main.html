<div class="max-w-xl overflow-hidden rounded-xl border border-base-300 bg-base-100 masto-profile" :title="$summary">
  <div class="relative h-28 overflow-hidden bg-base-200 header">
    <img class="absolute inset-0 size-full object-cover header-image" alt="" @show="truthy? .headerPath" :src="$'{$$mediaOrigin}{.headerPath}'">
  </div>
  <div class="px-4 pb-4">
    <div class="-mt-10 flex items-end gap-3">
      <div class="relative flex size-20 shrink-0 items-center justify-center overflow-hidden rounded-xl border-4 border-base-100 bg-base-300 text-xl font-semibold text-base-content/70 masto-avatar">
        <span @text=".initials"></span>
        <img class="absolute inset-0 size-full object-cover avatar-image" alt="" @show="truthy? .avatarPath" :src="$'{$$mediaOrigin}{.avatarPath}'">
      </div>
      <button @if.class=".following" @then="'ml-auto rounded-full border border-indigo-500 bg-indigo-500 px-4 py-1.5 text-sm font-semibold text-base-100 cursor-pointer follow'" @else="'ml-auto rounded-full border border-indigo-500 px-4 py-1.5 text-sm font-semibold text-indigo-500 cursor-pointer hover:bg-indigo-500 hover:text-base-100 follow'" @on.click="toggleFollow" @text="$followLabel"></button>
    </div>
    <div class="mt-2 flex flex-wrap items-center gap-2 leading-tight">
      <span class="text-xl font-bold name" @text=".name"></span>
      <span class="rounded border border-base-300 px-1.5 text-xs bot" @show=".bot">BOT</span>
      <span class="text-xs lock" @show=".locked" title="this account approves its followers by hand" aria-hidden="true">🔒</span>
    </div>
    <a class="text-sm text-base-content/60 hover:underline handle" @show="truthy? .acct" :href="$'{$$webOrigin}{.profilePath}'" target="_blank" rel="noopener noreferrer" @text=".handleText"></a>
    <div class="mt-3 flex gap-6 counts">
      <span class="flex flex-col followers"><span class="text-xs uppercase tracking-wide text-base-content/50">Followers</span><span class="font-bold" @text=".followersLabel"></span></span>
      <span class="flex flex-col follows"><span class="text-xs uppercase tracking-wide text-base-content/50">Following</span><span class="font-bold" @text=".followingLabel"></span></span>
      <span class="flex flex-col posts"><span class="text-xs uppercase tracking-wide text-base-content/50">Posts</span><span class="font-bold" @text=".statusesLabel"></span></span>
      <span class="flex flex-col joined"><span class="text-xs uppercase tracking-wide text-base-content/50">Joined</span><span class="font-bold" @text=".joinedLabel"></span></span>
    </div>
    <p class="mt-3 whitespace-pre-wrap text-sm leading-relaxed note" @show="truthy? .note" @text=".note"></p>
    <div class="mt-3 grid grid-cols-2 gap-2 fields" @hide="empty? .fieldItems">
      <div class="rounded-lg border border-base-300 px-3 py-2 field" @each=".fieldItems">
        <div class="flex items-center gap-1">
          <span class="grow truncate text-xs uppercase tracking-wide text-base-content/50 field-name" @text="@value.name"></span>
          <span class="text-emerald-500 verified" @show="truthy? @value.verified" title="the account proved it owns this link" aria-hidden="true">✓</span>
        </div>
        <div class="break-all text-sm field-value" :title="@value.target" @text="@value.value"></div>
      </div>
    </div>
  </div>
  <div class="border-t border-base-300 bg-base-200/40 feed" @hide="empty? .rows">
    <div class="px-4 pb-1 pt-3 text-xs uppercase tracking-widest text-base-content/50 recent-label">Activity</div>
    <div class="divide-y divide-base-300"><x render-each=".rows"></x>
      <footer class="flex flex-wrap items-center gap-2 px-4 py-2 pager" @show="$paged">
        <span class="text-xs text-base-content/50 range" @text="$rangeLabel"></span>
        <div class="ml-auto flex items-center gap-1">
          <button class="cursor-pointer rounded-md border border-base-300 px-2 text-xs font-semibold hover:border-indigo-500 hover:text-indigo-500 disabled:pointer-events-none disabled:opacity-30 first" @on.click="firstPage" :disabled="$atFirst" title="first page">«</button>
          <button class="cursor-pointer rounded-md border border-base-300 px-2 text-xs font-semibold hover:border-indigo-500 hover:text-indigo-500 disabled:pointer-events-none disabled:opacity-30 prev" @on.click="prevPage" :disabled="$atFirst" title="previous page">‹</button>
          <span class="px-1 text-xs text-base-content/50 page" @text="$pageLabel"></span>
          <button class="cursor-pointer rounded-md border border-base-300 px-2 text-xs font-semibold hover:border-indigo-500 hover:text-indigo-500 disabled:pointer-events-none disabled:opacity-30 next" @on.click="nextPage" :disabled="$atLast" title="next page">›</button>
          <button class="cursor-pointer rounded-md border border-base-300 px-2 text-xs font-semibold hover:border-indigo-500 hover:text-indigo-500 disabled:pointer-events-none disabled:opacity-30 last" @on.click="lastPage" :disabled="$atLast" title="last page">»</button>
        </div>
      </footer>
    </div>
  </div>
</div>
