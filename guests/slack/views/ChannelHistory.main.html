<div class="app-shell flex flex-col channel">
  <header class="navbar bg-base-300 rounded-box mb-2 gap-2 flex-wrap min-h-0 py-1">
    <div class="font-bold text-lg px-2 name" @text="$channelLabel"></div>
    <div class="text-xs opacity-60 px-1 grow topic" @text=".topic"></div>
    <label class="flex items-center gap-1 text-sm px-1">Search<input type="search"
           placeholder="fuzzy search…" class="input input-bordered input-xs search"
           :value=".query" @on.input="setQuery value"></label>
    <span class="badge badge-ghost badge-sm members" @text="$memberLabel"></span>
  </header>
  <div class="navbar bg-base-200 rounded-box mb-3 min-h-0 py-1 gap-2 flex-wrap">
    <div class="flex-1 text-sm opacity-60 px-2 loading-line" @show=".loading">
      <span class="loading loading-spinner loading-xs"></span> loading…
    </div>
    <div class="flex gap-1 items-center px-2">
      <button class="btn btn-ghost btn-xs whitespace-nowrap order" @on.click="toggleOrder" @text="$orderLabel"></button>
      <button class="btn btn-ghost btn-xs whitespace-nowrap expand-all" @on.click="expandAll">▾ expand all replies</button>
      <button class="btn btn-ghost btn-xs whitespace-nowrap collapse-all" @on.click="collapseAll">▸ collapse all replies</button>
    </div>
  </div>
  <main class="stream flex flex-col gap-3">
    <div class="alert alert-error error-alert" @show="$hasError" @text=".error"></div>
    <div class="opacity-60 text-sm italic empty" @show="$isEmpty">No messages.</div>
    <x render-each=".threads"></x>
  </main>
  <footer class="flex gap-2 items-center text-xs opacity-60 mt-3 px-1 channel-foot">
    <span class="count" @text="$countLabel"></span>
    <span class="italic last-action" @show="truthy? .lastAction" @text=".lastAction"></span>
  </footer>
</div>
