<div class="app-shell flex flex-col file-list">
  <header class="navbar bg-base-300 rounded-box mb-2 gap-2 flex-wrap min-h-0 py-1">
    <div class="font-bold text-lg px-2 grow name" @text="$title"></div>
    <span class="badge badge-ghost badge-sm count" @text="$countLabel"></span>
  </header>
  <main class="files flex flex-col gap-1">
    <div class="opacity-60 text-sm italic empty" @show="$isEmpty">No files.</div>
    <div class="file card bg-base-100 shadow-sm p-2 flex flex-row items-baseline gap-2 flex-wrap" @each=".rows">
      <span class="file-name font-semibold" @text="@value.label"></span>
      <span class="file-kind badge badge-ghost badge-sm" @show="truthy? @value.kind" @text="@value.kind"></span>
      <span class="file-size text-xs opacity-60" @show="truthy? @value.size" @text="@value.size"></span>
      <span class="file-by text-xs opacity-60" @show="truthy? @value.by" @text="@value.by"></span>
      <span class="file-time text-xs opacity-60" @show="truthy? @value.time" @text="@value.time"></span>
      <span class="file-id font-mono text-xs opacity-40" @text="@value.id"></span>
      <button class="file-link btn btn-ghost btn-xs whitespace-nowrap opacity-60" @show="truthy? @value.linked" @on.click="openFile @key" :title="@value.permalink">link</button>
    </div>
  </main>
  <footer class="flex gap-2 items-center text-xs opacity-60 mt-3 px-1 file-foot">
    <span class="italic note" @text="$note"></span>
    <span class="range" @show="$paged" @text="$rangeLabel"></span>
    <div class="join ml-auto pager" @show="$paged">
      <button class="btn btn-xs join-item first" @on.click="firstPage" :disabled="$atFirst" title="first page">«</button>
      <button class="btn btn-xs join-item prev" @on.click="prevPage" :disabled="$atFirst" title="previous page">‹</button>
      <span class="btn btn-xs join-item no-animation pointer-events-none page" @text="$pageLabel"></span>
      <button class="btn btn-xs join-item next" @on.click="nextPage" :disabled="$atLast" title="next page">›</button>
      <button class="btn btn-xs join-item last" @on.click="lastPage" :disabled="$atLast" title="last page">»</button>
    </div>
  </footer>
  <div class="mt-2"><x render=".scope" @show="truthy? .hasScope"></x></div>
</div>
