<article @if.class=".compact"
         @then="'msg msg-compact text-sm py-1'"
         @else="'msg card bg-base-100 shadow-sm p-3'">
  <div class="msg-head flex items-center gap-2 flex-wrap">
    <span @if.class=".compact"
          @then="'msg-avatar relative size-5 shrink-0 rounded-full bg-base-300 flex items-center justify-center text-xs font-semibold text-base-content/70 overflow-hidden'"
          @else="'msg-avatar relative size-8 shrink-0 rounded-full bg-base-300 flex items-center justify-center text-sm font-semibold text-base-content/70 overflow-hidden'"><span @text="$initials"></span><img class="absolute inset-0 size-full object-cover avatar-image" alt="" @show="truthy? $slackCdnPath" :src="$'https://ca.slack-edge.com/{$slackCdnPath}'"><img class="absolute inset-0 size-full object-cover avatar-image" alt="" @show="truthy? $slackAvatarsPath" :src="$'https://avatars.slack-edge.com/{$slackAvatarsPath}'"><img class="absolute inset-0 size-full object-cover avatar-image" alt="" @show="truthy? $gravatarPath" :src="$'https://secure.gravatar.com/{$gravatarPath}'"></span>
    <span class="msg-author font-semibold text-primary" @text="$authorLabel"></span>
    <span class="msg-channel badge badge-ghost badge-sm" @show="$hasChannel" @text="$channelLabel"></span>
    <span class="msg-time text-xs opacity-60" @text="$timeLabel"></span>
    <span class="msg-ts font-mono text-xs opacity-40" @show="$hasId" :title="$idTitle" @text=".id"></span>
    <span class="msg-edited text-xs opacity-50 italic" @show=".edited">(edited)</span>
    <span class="msg-pinned badge badge-ghost badge-sm" @show=".pinned">pinned</span>
    <button class="msg-permalink btn btn-ghost btn-xs whitespace-nowrap opacity-60" @show="$hasPermalink" @on.click="openPermalink" :title=".permalink">link</button>
  </div>
  <div class="msg-body mt-1"><x render=".body"></x></div>
  <div class="msg-reactions flex gap-1 flex-wrap mt-2" @hide="empty? .reactions"><x render-each=".reactions"></x></div>
</article>
