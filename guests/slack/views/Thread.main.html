<div class="thread">
  <x render=".root"></x>
  <div class="msg-foot mt-1" @show="$hasReplies">
    <button class="btn btn-ghost btn-xs whitespace-nowrap thread-toggle" @on.click="toggle" @text="$replyLabel"></button>
  </div>
  <div class="msg-foot mt-1 flex items-center gap-2" @show="$hasUnloadedReplies">
    <button class="btn btn-ghost btn-xs whitespace-nowrap thread-load" @on.click="openThread" :title="$loadTitle" @text="$loadLabel"></button>
    <span class="text-xs opacity-50 thread-load-hint" @text="$loadTitle"></span>
  </div>
  <div class="msg-replies mt-2 pl-3 border-l-2 border-base-300 flex flex-col gap-1" @show=".expanded">
    <x render-each=".replies"></x>
    <footer class="flex gap-2 items-center text-xs opacity-60 mt-1 reply-foot" @show="$paged">
      <span class="range" @text="$rangeLabel"></span>
      <div class="join ml-auto pager">
        <button class="btn btn-xs join-item first" @on.click="firstPage" :disabled="$atFirst" title="first page">«</button>
        <button class="btn btn-xs join-item prev" @on.click="prevPage" :disabled="$atFirst" title="previous page">‹</button>
        <span class="btn btn-xs join-item no-animation pointer-events-none page" @text="$pageLabel"></span>
        <button class="btn btn-xs join-item next" @on.click="nextPage" :disabled="$atLast" title="next page">›</button>
        <button class="btn btn-xs join-item last" @on.click="lastPage" :disabled="$atLast" title="last page">»</button>
      </div>
    </footer>
  </div>
</div>
