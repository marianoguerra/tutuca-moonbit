<script type="tutuca/spec">
  state {
    /// No clause. A counter with `inc` and `dec` and no floor has the whole
    /// of `Int` for its domain, and `where count >= 0` would be a rule this
    /// component does not keep — `dec` walks straight past it.
    ///
    /// A domain is worth writing when it is TRUE. The empty spec block is
    /// the honest answer here, and the counter is the example that says so.
    count : Int

    property {
      /// Direct public storage: the compact form needs no script body.
      pub count : Int { get .count set .count }
      /// An abstract property: its implementation preserves the sign while
      /// exposing and accepting a non-negative magnitude.
      pub magnitude : Int { get set }
    }
  }
</script>

<script type="tutuca/script" for="SbCounter">
  /// One step up, one step down. Both are `@on` names the views write, and
  /// neither reads anything but the field it moves — which is the whole of
  /// what a counter is.
  receive inc {
    .count += 1
  }

  receive dec {
    .count -= 1
  }

  get magnitude {
    if (.count < 0) { -.count } else { .count }
  }

  set magnitude {
    if (.count < 0) {
      .count = -value
    } else {
      .count = value
    }
  }
</script>

<script type="tutuca/spec">
  state {
    name : String
    size : Double
    type : String
    lastModified : Double
    hasFile : Bool

    /// A file has a length and an epoch timestamp; neither runs backwards.
    where size >= 0
    where lastModified >= 0

    /// `hasFile` is the flag every row in the table hangs off, and the four
    /// fields beside it are what it promises are filled in. The one that
    /// cannot be empty is the name — a picked file always has one, and a
    /// table saying otherwise means the flag and the fields disagreed.
    invariant pickedFileIsDescribed
      format 'the file table is showing, but no file name came with it' {
        .hasFile implies ((len .name) > 0)
      }
  }

<script type="tutuca/spec">
  state SwatchPicker {
    color : String
    palette : Array[String]

    /// A picker with nothing to pick from is a preview rectangle and no way
    /// to change it — and it is what a generator draws first unless told.
    where palette is nonempty

    /// The relation the swatch row draws: the selection is one of the
    /// offered colours. It is an `invariant` and not a `where` because
    /// `palette` is a LIST of colours rather than a set of them, and
    /// `member of` reads a set — the vocabulary is closed exactly so that
    /// what it does admit can also be run backwards.
    invariant colorIsOnThePalette
      format $'{.color} is not one of the swatches' {
        has .palette .color
      }
  }

  state Quadratic {
    a : Int
    b : Int
    c : Int
  }
</script>

  state PsEntry {
    title : String

    startYear : Int?
    endYear : Int?
    role : String?
    featured : Bool
    url : String
    altUrls : Array[AltUrl]
    categories : Array[String]

    /// The site is bilingual, and `$isSpanish` branches on nothing else.
    where lang is one of ["en", "es"]

    /// An entry is a link with a name on it: the card's heading and its
    /// `:href` are both required for the card to be anything at all.
    where title is nonempty
    where url is nonempty
  }

  state Root {
    allEntries : Array[PsEntry]
    allCategories : Array[String]
    allRoles : Array[String]
    selectedCategories : Set[String]
    selectedRoles : Set[String]
    featuredFirst : Bool
    sortByEnd : Bool
    sortAsc : Bool
  }

  /// Dispatched by the host after `start()`. No view writes it.
  /// `Init` is the host's; `LoadDataOk` is the ANSWER, and declaring it is
  /// what makes `loadData` a request rather than a notification.
  handle Root {
    message {
    init
    loadDataOk(Array[Any])

    }
  }
</script>

<script type="tutuca/script" for="Root">
  /// Ask for the data. Nothing else moves — the entries arrive as an ordinary
  /// message, `loadDataOk`, which sorts them and collects the facets, and that
  /// is a MoonBit handler.
  ///
  /// `lex` is the leg: the answer comes from a handler registered in the
  /// SCOPE, which is where the module puts its fixture.
  receive init {
    intent lex 'loadData'
  }
</script>

  /// Whether this entry matches a query, for a parent's `@when` filter.

  /// It used to be a `func` in the state block — the one thing that put

<script type="tutuca/spec">
  state PushView {
    items : Array[Component[Entry]]
    query : String
    view : String

    /// `@push-view=".view"` looks a view up by this name and falls back to
    /// `main` when it finds nothing — so a third name is not an error, it is
    /// a component that silently stops switching. Two views exist; say so.
    where view is one of ["main", "edit"]
  }

  state SeqItemAccess {
    byKey : Map[String, Component[Entry]]
    byIndex : Array[Component[Entry]]
    currentKey : Any
    currentIndex : Int

    /// The two selections, each said against the collection it selects from.
    /// This is the pair no type can state: `Int` and `String` are both true
    /// and both useless, and `<x render=".byIndex[.currentIndex]">` renders
    /// nothing at all when the relation does not hold.
    ///
    /// `or none` because the ZERO of this component is an empty catalogue
    /// with the slider parked at 0 — a real state, and one the generator has
    /// to be allowed to draw.
    where currentIndex is index of .byIndex or none
    where currentKey   is key of .byKey
  }

  state Pagination {
    items : Array[String]
    page : Int
    pageSize : Int

    /// A page size of zero divides by zero in `next`, and a negative one
    /// asks `@loop-with` for a slice that runs backwards. The floor is the
    /// interesting half; the ceiling keeps a generated `setPageSize` from
    /// drawing a slice nothing could paginate.
    where pageSize between 1 and 100
    where page >= 0

    /// What `prev` and `next` already clamp to, said once for the paths that
    /// do not go through them — `setPage`, and anything added later.
    /// `pageSize` is at least 1 by the clause above, so the division is safe
    /// wherever this rule is asked.
    invariant pageExists
      format $'page {.page} is past the last one' {
        (.page is 0) or ((.page * .pageSize) < (len .items))
      }
  }
</script>

<script type="tutuca/script" for="PushView">
  /// Flip the pushed view name. The label under the button is `$getToggleLabel`
  /// and stays in MoonBit — a `compute` is answered while rendering, and this
  /// runs after.
  receive toggleView {
    .view = if .view is 'main' { 'edit' } else { 'main' }
  }
</script>

<script type="tutuca/script" for="Pagination">
  /// Step back, never past the first page.
  receive prev {
    .page = max 0 (.page - 1)
  }

  /// Step forward, never past the last one.
  /// 
  /// `((len .items) - 1) / .pageSize` is the last page's index with its
  /// fraction still on it — the field is an Int and takes the whole part, so
  /// the division needs no ceiling of its own.
  receive next {
    .page = min (.page + 1) (((len .items) - 1) / .pageSize)
  }
</script>

<script type="tutuca/spec">
  state {
    items : Array[Component[Entry]]
    query : String
    view : String
    isLoading : Bool
    error : String?

    /// `@push-view=".view"` falls back to `main` for a name it cannot find,
    /// so a third value is not an error — it is a toggle that stops toggling.
    where view is one of ["main", "edit"]

    /// The three outcomes are exclusive, and this is the pair that a reader
    /// of the handlers has to hold in their head otherwise: a request that
    /// is still in flight has not failed yet. `loadDataError` clears the
    /// flag as it sets the message, and this is what says why.
    invariant notFailedWhileLoading
      format 'the spinner is up and an error is already showing' {
        .isLoading implies (null? .error)
      }
  }

  /// The host dispatches `Init` after `start()`. No view writes it, so the
  /// schema is the only place it can be declared.
  ///
  /// The other three are the ANSWERS, and declaring them is what makes
  /// `loadData` a request rather than a notification: a sender expects an
  /// answer if and only if it declares an arm for one. Nobody writes that
  /// down twice — the generator reads this list and fills the intent's opts in.
  ///
  /// Three outcomes, three arms. v1 had one combined `[res, err]` payload and
  /// a split arm that read the wrong slot; v2 gives each outcome its own name
  /// and its own shape.
  handle {
    message {
    init
    loadDataOk(Any)
    loadDataError(String)
    loadDataUnhandled

    }
  }
</script>

<script type="tutuca/script" for="SbRequest">
  /// Flip the pushed view name.
  receive toggleView {
    .view = if .view is 'main' { 'edit' } else { 'main' }
  }

  /// Dispatch the intent and say so. `intent` is an effect here, which means
  /// it goes out only if the whole body finished — a message sent beside a
  /// transition that did not happen is the one outcome nobody can reason
  /// about afterwards.
  ///
  /// `lex` is the leg: the answer comes from a handler REGISTERED IN THE
  /// SCOPE, not from a component up the tree. That is what v1 spelled
  /// `request`, and writing it as a route is the whole change — the verb no
  /// longer decides which scope answers.
  ///
  /// No opts here. The three answer arms are in the schema, so the generator
  /// already knows where the answer goes.
  receive init {
    intent lex 'loadData'
    .isLoading = true
  }
</script>

<!-- playground/site/examples/personal_site.html (SitePersonalSite) -->
<script type="tutuca/spec">
  state AltUrl {
    label : String
    url : String

    /// A badge that links somewhere, with a word on it.
    where label is nonempty
    where url is nonempty
  }

  state PSEntry {
    title : String
    description : String
    lang : String
    startYear : Int?
    endYear : Int?
    role : String?
    featured : Bool
    url : String
    altUrls : Array[AltUrl]
    categories : Array[String]

    /// The site is bilingual, and `$isSpanish` branches on nothing else.
    where lang is one of ["en", "es"]

    /// An entry is a link with a name on it: the card's heading and its
    /// `:href` are both required for the card to be anything at all.
    where title is nonempty
    where url is nonempty
  }

  state Root {
    allEntries : Array[PSEntry]
    allCategories : Array[String]
    allRoles : Array[String]
    selectedCategories : Set[String]
    selectedRoles : Set[String]
    featuredFirst : Bool
    sortByEnd : Bool
    sortAsc : Bool
  }
</script>

<template id="SitePersonalSiteAltUrl">

      <span class="badge badge-ghost badge-sm border-0 font-bold years" @show="truthy? .startYear" @text="$yearDisplay"></span>
      <span class="badge badge-neutral badge-sm border-0 font-bold role" @show=".role" @text=".role"></span>

    <a :href=".url" target="_blank" class="link link-hover"><h2 class="font-bold title" @text=".title"></h2></a>

<!-- playground/site/examples/tree.html (SiteTree) -->
<script type="tutuca/spec">
  state TreeItem {
    type : String
    label : String
    isOpen : Bool
    items : Array[TreeItem]

    /// A filesystem node is one of exactly two things, and every view here
    /// branches on nothing else. A domain rather than a rule, because a
    /// generator can draw from a closed set and can only filter for a rule.
    where type is one of ["file", "dir"]

    /// The half a `where` cannot say: a leaf has no children. Two fields
    /// have to agree, and no relation over one of them states it.
    invariant filesAreLeaves
      format $'a file cannot hold {len .items} children' {
        (.type is 'file') implies ((len .items) is 0)
      }
  }

  state TreeRoot {
    log : Array[String]
    root : TreeItem
  }
</script>

<template id="SiteTreeTreeItem">
  <section>
    <p class="head"
      @if.class=".isOpen" @then="$'head open type-{.type}'" @else="$'head closed type-{.type}'"
      @text=".label" @on.click="onItemClick"></p>
    <div class="pl-3 pt-1 flex flex-col gap-2 kids" @show="$areChildsVisible">
      <x render-each=".items"></x>
    </div>
  </section>
  <style>
    user-select: none;
    .head { cursor: pointer; }
    .head:before { content: "⏺️"; margin-right: 0.25rem; }
    .head.type-file:before { content: "📄️"; }
    .head.open.type-dir:before { content: "📂️"; }
    .head.closed.type-dir:before { content: "📁️"; }
  </style>
</template>
<template id="SiteTreeTreeRoot">
  <div class="flex flex-col gap-3">
    <x render=".root"></x>
    <ul class="flex flex-col gap-2 max-h-[40vh] overflow-y-auto log">
      <li @each=".log"><x text="@value"></x></li>
    </ul>
  </div>
</template>
