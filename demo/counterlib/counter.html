<script type="tutuca/spec">
  state {
    label : String
    count : Int
    history : Array[Int]

    /// A named question about the state, asked in one place and used in two.
    pred recorded { (len .history) > 0 }

    /// An invariant that CALLS a pred rather than restating it — the shape
    /// that used to generate code no compiler would take: the guard woven into
    /// a handler arm constructs a `@tutuca.CtxStack(ctx)` to call the pred
    /// with, and that type was read-only outside `core`, so `gen-views`
    /// reported nothing and `moon check` failed afterwards. This file is where
    /// that stays fixed: the demo is compiled by `check`, and the arm below is
    /// the one the guard lands in.
    invariant historyFollowsCount
      format 'the counter moved and the history did not' {
        recorded or (.count is 0)
      }
  }

  /// Messages this counter raises at itself. The views never write these
  /// names, so the schema is the only place they can be declared.
  handle {
    message {
    resetTo(Int)

    }
  }
</script>

<script type="tutuca/script">
  /// Move the counter by `d`, remembering where it landed.
  ///
  /// `.count` reads the value the line above wrote: a statement rebinds the
  /// state, so the push records where the counter ENDED rather than where it
  /// started.
  receive add(d) {
    .count += d
    .history.push .count
  }

  /// The same move, addressed by name rather than by a click.
  receive resetTo(n) {
    .count = n
    .history.push .count
  }
</script>

<script type="tutuca/fixtures">
{
  "fresh": {
    "value": { "label": "Counter" },
    "doc": "A counter nobody has pressed yet.",
    "default": true
  },
  "with-history": {
    "value": { "label": "Demo", "count": 3, "history": [1, 2, 3] },
    "doc": "What it looks like after three presses, without pressing three times."
  }
}
</script>

<template>
  <style>font-family: sans-serif</style>
  <div class="counter">
    <h1><x text=".label"></x>: <span id="count"><x text=".count"></x></span></h1>
    <button id="inc" @on.click="add 1">+1</button>
    <button id="dec" @on.click="add -1">-1</button>
    <button id="reset" @on.click=".count = default">reset</button>
    <input id="label" :value=".label" @on.input=".label = e.value" @on.keydown+send=".label = 'sent!'">
    <ul id="history"><li @each=".history"><x text="@value"></x></li></ul>
  </div>
</template>
