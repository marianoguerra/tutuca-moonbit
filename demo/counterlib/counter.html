<script type="tutuca/state">
  state {
    label : String
    count : Int
    history : Array[Int]
  }

  /// Messages this counter raises at itself. The views never write these
  /// names, so the schema is the only place they can be declared.
  handle {
    message {
    resetTo(Int)

    }
  }
</script>

<script type="tutuca/script">
  /// Move the counter by `d`, remembering where it landed.
  ///
  /// `.count` reads the value the line above wrote: a statement rebinds the
  /// state, so the push records where the counter ENDED rather than where it
  /// started.
  receive add(d) {
    .count += d
    .history.push .count
  }

  /// The same move, addressed by name rather than by a click.
  receive resetTo(n) {
    .count = n
    .history.push .count
  }
</script>

<script type="tutuca/init">
{
  "fresh": {
    "value": { "label": "Counter" },
    "doc": "A counter nobody has pressed yet.",
    "default": true
  },
  "with-history": {
    "value": { "label": "Demo", "count": 3, "history": [1, 2, 3] },
    "doc": "What it looks like after three presses, without pressing three times."
  }
}
</script>

<template>
  <style>font-family: sans-serif</style>
  <div class="counter">
    <h1><x text=".label"></x>: <span id="count"><x text=".count"></x></span></h1>
    <button id="inc" @on.click="add 1">+1</button>
    <button id="dec" @on.click="add -1">-1</button>
    <button id="reset" @on.click="resetCount">reset</button>
    <input id="label" :value=".label" @on.input="setLabel e.value" @on.keydown+send="setLabel 'sent!'">
    <ul id="history"><li @each=".history"><x text="@value"></x></li></ul>
  </div>
</template>
