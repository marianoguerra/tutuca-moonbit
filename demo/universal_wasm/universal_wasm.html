<script type="tutuca/state">
  interface host-tools {
    /// The bar's development conveniences: fetch a sample bundle, or drop one
    /// on the page.
    ///
    /// It sits INSIDE the app's bar rather than around the app, because the
    /// whole viewport is the app now. `dyncomp/ui` is backend-agnostic and
    /// cannot fetch an archive or read a dropped file; this is the component
    /// it renders in the one place it left for a host to stand.
    record state {
      status: string,
      /// Whether to draw the sample-loading buttons.
      ///
      /// They are a convenience for working ON this page rather than a feature
      /// OF it, and a first-time visitor should meet an empty page and a `+`
      /// rather than four buttons naming archives they have never heard of.
      /// `?test` in the query string is what asks for them.
      samples: bool,
    }
    variant receive {
      /// Files the app forwarded — dropped anywhere on the page, or on a cell
      /// that handed back what was not its.
      files-dropped(any),
      /// The bridge's own answers, routed here because this is the path that
      /// asked for the load.
      dyncomp-loaded(string),
      dyncomp-error(string),
    }
    variant bubble {
      /// The catalog changed. The app re-runs whatever the command bar is
      /// showing rather than telling a person to retype it.
      catalog-changed(string),
    }
  }
</script>

<!-- The samples are here for convenience during development: the same archive
     a drop would carry, named by URL instead. Loading one that is already
     registered HOT-SWAPS it, and the catalog answers with the new components
     immediately.

     Behind `?test`, because they are for working on this page rather than for
     using it. Dropping a bundle is NOT behind it: that is what the page is
     for, and the whole viewport stays a drop target either way. -->
<template id="HostTools">
  <span class="host-tools flex items-center gap-2">
    <div class="join" @show=".samples">
      <button class="btn btn-xs join-item load-counter"
              @on.click="loadSample './examples/counter.tutuca.tar.gz'">counter</button>
      <button class="btn btn-xs join-item load-todo"
              @on.click="loadSample './examples/todo.tutuca.tar.gz'">todo</button>
      <button class="btn btn-xs join-item load-todomvc"
              @on.click="loadSample './examples/todomvc.tutuca.tar.gz'">todomvc</button>
      <button class="btn btn-xs join-item load-calc"
              @on.click="loadSample './examples/calculator.tutuca.tar.gz'">calculator</button>
      <button class="btn btn-xs join-item load-ttt"
              @on.click="loadSample './examples/tictactoe.tutuca.tar.gz'">tic-tac-toe</button>
      <button class="btn btn-xs join-item load-rust"
              @on.click="loadSample './examples/rust-tempconv.tutuca.tar.gz'">rust temp</button>
    </div>
    <span class="text-xs opacity-60 host-status" @text=".status"></span>
  </span>
</template>
