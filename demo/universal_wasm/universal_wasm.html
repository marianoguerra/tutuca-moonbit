<script type="tutuca/state">
  interface universal-wasm {
    /// The page around the editor: a drop target for bundles, a status line
    /// for what loading said, and the editor itself.
    ///
    /// Deliberately thin. Everything about searching, placing and arranging
    /// components lives in `dyncomp/ui`, which is backend-agnostic and driven
    /// by `moon test`; what is left here is the one thing that is not — the
    /// bridge that fetches a `.tutuca.tar.gz` and turns it into components.
    ///
    /// This shell used to hold the picker chain (ComponentList /
    /// ComponentPicker / ComponentEntry). Those are gone: a palette that
    /// searches a documented catalog and a form generated from a component's
    /// declared arguments do what they did, and doing it in one place is what
    /// lets an agent drive the same editor later.
    record state {
      status: string,
      /// The editor. `component` rather than a named slot because the
      /// generator resolves a sibling component only within one file, and
      /// SurfaceEditor lives in dyncomp/ui — `slots~` names it at the seam.
      editor: component,
    }
    variant receive { dyncomp-loaded(string), dyncomp-error(string) }
  }
</script>

<template id="UniversalWasm">
  <!-- The whole page is the drop target, and the drop is an ORDINARY tutuca
       event: `value` carries the dropped files (id + metadata), so loading a
       bundle is a handler like any other. This page used to install a
       document-level listener in JS to get at dataTransfer.files. -->
  <div class="min-h-screen bg-base-200 text-base-content p-4 flex flex-col gap-3"
       data-droptarget="tutuca-wasm-component" @on.drop="loadDropped value">
    <header class="flex items-center gap-3 flex-wrap">
      <h1 class="text-lg font-semibold">tutuca universal host</h1>
      <!-- Drop a bundle, or fetch one: the same archive, named by URL instead.
           Loading a bundle that is already registered HOT-SWAPS it, and the
           catalog answers with the new components immediately. -->
      <div class="join">
        <button class="btn btn-xs join-item load-counter"
                @on.click="loadSample './examples/counter.tutuca.tar.gz'">counter</button>
        <button class="btn btn-xs join-item load-todo"
                @on.click="loadSample './examples/todo.tutuca.tar.gz'">todo</button>
        <button class="btn btn-xs join-item load-todomvc"
                @on.click="loadSample './examples/todomvc.tutuca.tar.gz'">todomvc</button>
        <button class="btn btn-xs join-item load-rust"
                @on.click="loadSample './examples/rust-notepad.tutuca.tar.gz'">rust notepad</button>
      </div>
      <span class="text-sm opacity-70 grow status" @text=".status"></span>
    </header>
    <p class="text-xs opacity-50 italic">
      Drop a <code class="font-mono">.tutuca.tar.gz</code> anywhere on this page to register its components.
      What you place is kept in this browser and restored on the next visit — the samples by URL, a dropped bundle only if you drop it again.
    </p>
    <x render=".editor"></x>
  </div>
</template>
