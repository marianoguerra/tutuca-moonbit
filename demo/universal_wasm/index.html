<!doctype html>
<!-- Universal wasm-component demo (dyncomp/DESIGN.md). The whole viewport is
     the app: it starts as one empty cell, and clicking the + opens a command
     bar over the catalog — the standard components, plus everything any loaded
     bundle declares. Drop a single `.tutuca.tar.gz` bundle (a gzipped tar of a
     guest's jco-transpiled `tutuca:component` output) anywhere on the page and
     every component its manifest declares joins that catalog. No server round-trip: the
     archive is gunzipped (native DecompressionStream) and untarred in-browser.
     Build + assemble: moon run - -target native cmd/dev - - universal
     then serve dist/ and open /universal/. A sample bundle is copied to
     ./examples/counter.tutuca.tar.gz. Needs the JS String Builtins proposal
     (e.g. Chrome). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>tutuca universal wasm components</title>
  <!-- margaui CSS (utilities + light/dark theme vars) is compiled in MoonBit and
       injected here by mount(); pre-placed early so lazily-loaded palette <link>s
       win the cascade over the light block. -->
  <style id="margaui-css"></style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { loadWasm } from "./loader.mjs";
    const exports = await loadWasm("./universal_wasm.wasm");
    exports.mount();               // compiles + injects <style id="margaui-css">
    globalThis.__tutuca_state = () => exports.state_json();
  </script>
</body>
</html>
