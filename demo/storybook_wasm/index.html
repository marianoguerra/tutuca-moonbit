<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tutuca-mb — storybook (wasm)</title>
    <!-- margaui CSS (utilities + light/dark theme vars) is compiled in MoonBit
         and injected here by mount(); pre-placed early so lazily-loaded palette
         <link>s (dracula, …) win the cascade over the light block. -->
    <style id="margaui-css"></style>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!--
      The storybook gallery running as WebAssembly (wasm-gc). Build + assemble:
        moon run --target native cmd/dev -- dist
      then serve dist/ and open storybook/. Or serve it with the CLI:
        dist/cli/tutuca storybook --port 4321
      For a raw build:
        moon build --target wasm-gc demo/storybook_wasm
      (needs a browser with the JS String Builtins proposal, e.g. Chrome).
    -->
    <script type="module">
      import { loadWasm } from "./loader.mjs";
      // Register the <emoji-picker> custom element used by the
      // web-component-custom-event story (the JS docs load it on the demo page).
      import("https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js").catch(
        (err) => console.warn("emoji-picker-element load skipped:", err),
      );
      const exports = await loadWasm("./storybook_wasm.wasm");
      exports.mount();
      // Re-restore selection/filter/focus on Back/Forward. tutuca has no
      // lifecycle, so the host re-sends `init` (which re-reads the URL).
      // Programmatic push/replaceState don't fire popstate, so this only runs
      // on real navigation.
      window.addEventListener("popstate", () => exports.on_popstate());
      // The Fuzz tab's frame. MoonBit pulls this when a Play needs the next
      // step; it schedules ONE frame and nothing re-arms it once the run
      // stops, so there is no permanent rAF loop here. The yield is the whole
      // point: it is what lets layout and paint land between generated
      // dispatches, so the component is visibly mutating and a DevTools
      // recording shows real per-step cost rather than one blocking call.
      globalThis.__tutucaFuzzTick = () =>
        requestAnimationFrame(() => exports.on_fuzz_tick());
    </script>
  </body>
</html>
