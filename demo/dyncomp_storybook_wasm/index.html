<!doctype html>
<!-- Dyncomp storybook (dyncomp/DESIGN.md). A gallery of every component every
     loaded bundle declares, once per configuration it declares — the `inits` a
     manifest carries ARE the story set, so a bundle nobody wrote for this page
     still has stories the moment it loads. Drop a single `.tutuca.tar.gz`
     anywhere on the page, or paste a URL into the bar. No server round-trip:
     the archive is gunzipped (native DecompressionStream) and untarred
     in-browser.
     Build + assemble: the `dyncomp-storybook` task (see AGENTS.md). Spelled as a
     task name rather than a command line because the `--` a command line
     needs cannot appear inside an HTML comment.
     then serve dist/ and open /dyncomp-storybook/. The sample bundles are
     copied to ./examples/ and fetched at mount. Needs the JS String Builtins
     proposal (e.g. Chrome). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>tutuca dyncomp storybook</title>
  <!-- margaui CSS (utilities + theme vars) is compiled in MoonBit and injected
       here by mount(); pre-placed early so lazily-loaded palette <link>s win
       the cascade over the light block. It is recompiled after every bundle
       load, because a guest brings its own utility classes. -->
  <style id="margaui-css"></style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { loadWasm } from "./loader.mjs";
    const exports = await loadWasm("./dyncomp_storybook_wasm.wasm");
    exports.mount();               // compiles + injects <style id="margaui-css">
    globalThis.__tutuca_state = () => exports.state_json();
  </script>
</body>
</html>
