<script type="tutuca/state">
  /// A sample descriptor exercising every summary channel (RichSample in
  /// component-inspector.dev.js). Only introspected, never rendered — its
  /// point is that every panel of the component inspector has something to
  /// show, which is why it declares one of everything.
  state RichSample {
    title : String
    count : Int
    tags : Array[Any]
    open : Bool
  }

  receive RichSample {
    Ping
  }

  bubble RichSample {
    OnChild
  }

  response RichSample {
    OnData
  }

  state SampleCard {
    title : String
    count : Int
    tags : Array[Any]
    open : Bool
  }
</script>

<template id="RichSample">
  <div @on.click="inc">
    <span @text=".title"></span>
    <span @each=".tags" @loop-with="rows"><x text="@value"></x></span>
  </div>
</template>

<!--
  The methods are CALLED rather than declared: a state block used to carry
  `double: func() -> s32`, and now a method exists exactly where a view asks
  for one. So the inspector's Methods panel has something to show only if a
  view of this component reads it, which is the same rule every other channel
  already followed.
-->
<template id="RichSample:compact">
  <span @on.click="reset">
    <i @text=".title"></i><i @text="$label"></i><i @text="$double"></i>
  </span>
</template>

<template id="SampleCard">
  <div class="card" @text="$label" @on.click="bump"></div>
</template>
