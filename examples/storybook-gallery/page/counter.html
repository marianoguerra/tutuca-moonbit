<script type="tutuca/spec">
  state {
    /// No clause: a counter with `inc` and `dec` and no floor has the whole of
    /// `Int` for its domain, and a rule this component does not keep would be
    /// a lie the Fuzz tab would catch.
    count : Int
  }

  /// What this component accepts, declared. The `receive`s below are the
  /// IMPLEMENTATIONS of these names and the `@on.click`s are call sites, and
  /// neither is a declaration — so without this block the component's public
  /// API is empty and the Fuzz tab has nothing to draw. Declaring it is what
  /// gives the tab a script, and it is the first thing to copy when you add a
  /// component of your own.
  handle Counter {
    message { inc, dec }
  }
</script>

<script type="tutuca/script">
  receive inc {
    .count += 1
  }

  receive dec {
    .count -= 1
  }
</script>

<template id="Counter">
  <div class="join join-vertical">
    <button class="btn btn-error" @on.click="dec">-</button>
    <div class="stats">
      <div class="stat text-center">
        <div class="stat-title">Count</div>
        <div class="stat-value" @text=".count"></div>
      </div>
    </div>
    <button class="btn btn-success" @on.click="inc">+</button>
  </div>
</template>

<template id="Counter:compact">
  <button class="btn btn-sm" @text=".count" @on.click="inc"></button>
</template>
