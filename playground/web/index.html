<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tutuca-mb playground</title>
    <style>
      * { box-sizing: border-box; }
      /* let the UA theme canvas, text, form controls and scrollbars for us */
      html { color-scheme: light dark; }
      /* One place for the chrome's colours, so dark mode is a token swap
         rather than a second copy of every rule that draws a line. */
      :root {
        --border: #dcdfe4;
        --border-soft: #eceef1;
        --muted: #5c6570;
        --header-bg: #f7f8fa;
        --accent: #2563eb;
        --on-accent: #fff;
        --ok: #1a7f4b;
        --busy: #9a6b00;
        --error: #c33;
      }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: system-ui, sans-serif;
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100vh;
      }
      header {
        padding: 0.4rem 0.9rem;
        border-bottom: 1px solid var(--border);
        background: var(--header-bg);
        display: flex;
        align-items: center;
        gap: 0.55rem;
      }
      header h1 {
        font-size: 0.95rem;
        margin: 0 0.45rem 0 0;
        font-family: ui-monospace, monospace;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      /* One height and one shape for every control in the bar — the default UA
         widgets disagree on both, which is what made the row look ragged. */
      #run, header select {
        font: inherit;
        font-size: 0.8rem;
        height: 1.85rem;
        padding: 0 0.5rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: Canvas;
        color: inherit;
        cursor: pointer;
      }
      header select:hover { border-color: var(--muted); }
      #run {
        padding: 0 0.85rem;
        font-weight: 600;
        background: var(--accent);
        color: var(--on-accent);
        border-color: transparent;
      }
      #run:hover { filter: brightness(1.1); }
      #run:active { transform: translateY(1px); }
      #run:focus-visible, header select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      header label {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        font-size: 0.68rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
      }
      /* status sits at the far end, with a dot that carries the state colour */
      #status {
        margin-left: auto;
        font-size: 0.78rem;
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
      }
      #status::before {
        content: "";
        width: 7px; height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      #status:empty::before { display: none; }
      #status.busy { color: var(--busy); }
      #status.ok { color: var(--ok); }
      #status.error { color: var(--error); }
      main {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 0;
      }
      .pane { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); }
      /* Tabs over the left pane: the component the user writes, the view HTML
         it is generated from, and the read-only generated module. */
      .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); flex: 0 0 auto; }
      .tabs button {
        appearance: none; background: none; border: 0; border-bottom: 2px solid transparent;
        padding: 0.4rem 0.8rem; font: inherit; font-size: 0.8rem; cursor: pointer; opacity: 0.65;
      }
      .tabs button[aria-selected="true"] { opacity: 1; border-bottom-color: currentColor; font-weight: 600; }
      .tabs .spacer { flex: 1; }
      .tabs .note { align-self: center; font-size: 0.7rem; opacity: 0.55; padding-right: 0.75rem; }
      .editors { flex: 1; min-height: 0; position: relative; }
      .editors > div { position: absolute; inset: 0; overflow: hidden; }
      .editors > div[hidden] { display: none; }
      .editors .cm-editor { height: 100%; }
      #diagnostics {
        max-height: 30%;
        overflow: auto;
        border-top: 1px solid var(--border);
        padding: 0.5rem 0.75rem;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        color: var(--error);
      }
      .right { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
      #preview { overflow: auto; }
      #preview iframe { width: 100%; height: 100%; border: 0; }
      .inspector { border-top: 1px solid var(--border); max-height: 45%; overflow: auto; display: grid; grid-template-columns: 1fr 1fr; }
      .inspector section { padding: 0.5rem 0.75rem; border-right: 1px solid var(--border-soft); }
      .inspector h2 { font-size: 0.7rem; text-transform: uppercase; opacity: 0.6; margin: 0 0 0.35rem; }
      .inspector pre { margin: 0; font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; }
      /* dark mode: the UA handles bg/text/controls; swap the tokens above so
         the chrome stays coherent with the editor. */
      @media (prefers-color-scheme: dark) {
        :root {
          --border: #30363d;
          --border-soft: #21262d;
          --muted: #8b949e;
          --header-bg: #161b22;
          --accent: #3b82f6;
          --on-accent: #f0f6fc;
          --ok: #3fb950;
          --busy: #d29922;
          --error: #ff7b72;
        }
        #preview { background: #0d1117; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>tutuca-mb</h1>
      <button id="run" title="Run (Ctrl/⌘+Enter)">Run ▶</button>
      <label>example
        <select id="examples" title="Load an example"></select>
      </label>
      <!-- The default is picked at boot (wasm-gc where the payload has it) and
           an explicit ?target= wins over both; see driver.js. -->
      <label>target
        <select id="target" title="Compile backend">
          <option value="wasm-gc">wasm-gc</option>
          <option value="js">js</option>
        </select>
      </label>
      <span id="status"></span>
    </header>
    <main>
      <div class="pane">
        <div class="tabs" role="tablist">
          <button id="tab-component" role="tab" aria-selected="true" aria-controls="editor">Component</button>
          <button id="tab-view" role="tab" aria-selected="false" aria-controls="view-editor">View</button>
          <button id="tab-generated" role="tab" aria-selected="false" aria-controls="gen-editor">Generated</button>
          <span class="spacer"></span>
          <span class="note" id="gen-note"></span>
        </div>
        <div class="editors">
          <div id="editor" role="tabpanel"></div>
          <div id="view-editor" role="tabpanel" hidden></div>
          <div id="gen-editor" role="tabpanel" hidden></div>
        </div>
        <div id="diagnostics"></div>
      </div>
      <div class="pane right" style="border-right: 0">
        <div id="preview"></div>
        <div class="inspector">
          <section><h2>State</h2><pre id="state"></pre></section>
          <section style="border-right: 0"><h2>Activity</h2><pre id="activity"></pre></section>
        </div>
      </div>
    </main>
    <!-- starter modules — authored in MoonBit, compiled in your browser -->
    <script src="./starter.js"></script>
    <!-- the view generator (viewgen/, compiled to js): publishes
         globalThis.__tutucaViewgen for the View tab. A classic script, so it
         has run by the time the deferred module driver boots. -->
    <script src="./viewgen.js"></script>
    <script type="module" src="./driver.js"></script>
  </body>
</html>
