<script type="tutuca/spec">
  state Counter {
    count : Int
  }

  state Item {
    completed : Bool
    text : String
  }

  state Items {
    items : Array[Item]
  }

  state TreeItem {
    type : String
    label : String
    isOpen : Bool
    items : Array[TreeItem]

    /// A filesystem node is one of exactly two things, and every view here
    /// branches on nothing else. A domain rather than a rule, because a
    /// generator can draw from a closed set and can only filter for a rule.
    where type is one of ["file", "dir"]

    /// The half a `where` cannot say: a leaf has no children. Two fields
    /// have to agree, and no relation over one of them states it.
    invariant filesAreLeaves
      format $'a file cannot hold {len .items} children' {
        (.type is 'file') implies ((len .items) is 0)
      }
  }

  state TreeRoot {
    log : Array[String]
    root : TreeItem
  }

  state Composability {
    activeSection : String
    counter : Counter
    todo : Items
    tree : Component[TreeRoot]

    /// Three tabs, three panes. `setActiveSection` is generated, so this is
    /// the only place the closed set can be stated — a fourth name renders a
    /// tab strip above nothing.
    where activeSection is one of ["counter", "todo", "tree"]
  }
</script>

<script type="tutuca/script" for="Counter">
  /// Six components share this file, so a script block says which one it
  /// answers for — a `.count` here has to mean exactly one state.
  receive inc {
    .count += 1
  }

  receive dec {
    .count -= 1
  }
</script>

<!-- Every component in the module keeps its views in this one file; the
     `<template id="Name">` says which component each belongs to. -->
<template id="Counter">
  <div style="display:flex;gap:.5rem;align-items:center;font-size:1.5rem">
    <button @on.click="dec">-</button>
    <b @text=".count"></b>
    <button @on.click="inc">+</button>
  </div>
</template>

<template id="Item">
  <div class="flex gap-3 items-center">
    <input type="checkbox" class="checkbox" :checked=".completed" @on.input="setCompleted e.value">
    <input class="input" :value=".text" @on.input="setText e.value" :disabled=".completed">
  </div>
</template>

<template id="Items">
  <div class="flex flex-col gap-3">
    <button class="btn btn-soft btn-success add" @on.click="onAddItem">Add Task</button>
    <div class="flex flex-col gap-3 w-full">
      <div @each=".items" class="flex gap-3 justify-center items-center w-full row">
        <x render-it></x>
        <button class="btn btn-soft btn-sm btn-error btn-circle font-mono rm" @on.click="removeInItemsAt @key">x</button>
      </div>
    </div>
  </div>
</template>

<template id="TreeItem">
  <section>
    <p class="head"
      @if.class=".isOpen" @then="$'head open type-{.type}'" @else="$'head closed type-{.type}'"
      @text=".label" @on.click="onItemClick"></p>
    <div class="pl-3 pt-1 flex flex-col gap-2 kids" @show="$areChildsVisible">
      <x render-each=".items"></x>
    </div>
  </section>
  <style>
    user-select: none;
    .head { cursor: pointer; }
    .head:before { content: "⏺️"; margin-right: 0.25rem; }
    .head.type-file:before { content: "📄️"; }
    .head.open.type-dir:before { content: "📂️"; }
    .head.closed.type-dir:before { content: "📁️"; }
  </style>
</template>

<template id="TreeRoot">
  <div class="flex flex-col gap-3">
    <x render=".root"></x>
    <ul class="flex flex-col gap-2 max-h-[40vh] overflow-y-auto log">
      <li @each=".log"><x text="@value"></x></li>
    </ul>
  </div>
</template>

<template id="Composability">
  <section class="flex flex-col gap-4">
    <div role="tablist" class="tabs tabs-border">
      <button role="tab" id="tab-counter"
        @if.class=".activeSection is 'counter'" @then="'tab tab-active'" @else="'tab'"
        @on.click="setActiveSection 'counter'">Counter</button>
      <button role="tab" id="tab-todo"
        @if.class=".activeSection is 'todo'" @then="'tab tab-active'" @else="'tab'"
        @on.click="setActiveSection 'todo'">To-Do</button>
      <button role="tab" id="tab-tree"
        @if.class=".activeSection is 'tree'" @then="'tab tab-active'" @else="'tab'"
        @on.click="setActiveSection 'tree'">Tree</button>
    </div>
    <div class="pane-counter" @show=".activeSection is 'counter'"><x render=".counter"></x></div>
    <div class="pane-todo" @show=".activeSection is 'todo'"><x render=".todo"></x></div>
    <div class="pane-tree" @show=".activeSection is 'tree'"><x render=".tree"></x></div>
  </section>
</template>
