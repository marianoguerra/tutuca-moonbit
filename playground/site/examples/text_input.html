<script type="tutuca/spec">
  state Greeter {
    name : String
  }
</script>

<template id="Greeter">
  <div style="font-family:system-ui;display:flex;flex-direction:column;gap:.5rem">
    <input :value=".name" @on.input=".name = e.value" placeholder="your name">
    <p>Hello, <b @text=".name"></b>!</p>
  </div>
</template>
