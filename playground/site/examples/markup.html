<script type="tutuca/state">
  state MarkupPreview {
    html : String
    svg : String
  }
</script>

<template id="MarkupPreview">
  <div style="font-family:system-ui;display:flex;flex-direction:column;gap:1rem">
    <div style="display:flex;gap:1rem;align-items:stretch;min-height:22rem">
      <textarea
        :value=".html"
        @on.input="setHtml e.value"
        spellcheck="false"
        style="flex:1;min-width:0;font-family:ui-monospace,monospace;font-size:.8rem;line-height:1.5;padding:.75rem;border:1px solid #cbd5e1;border-radius:.375rem;resize:vertical"
      ></textarea>
      <div
        @setinnerhtml=".html"
        style="flex:1;min-width:0;overflow:auto;padding:.75rem;border:1px solid #cbd5e1;border-radius:.375rem;background:#fff"
      ></div>
    </div>
    <div style="display:flex;gap:1rem;align-items:stretch;min-height:14rem">
      <textarea
        :value=".svg"
        @on.input="setSvg e.value"
        spellcheck="false"
        style="flex:1;min-width:0;font-family:ui-monospace,monospace;font-size:.8rem;line-height:1.5;padding:.75rem;border:1px solid #cbd5e1;border-radius:.375rem;resize:vertical"
      ></textarea>
      <div style="flex:1;min-width:0;padding:.75rem;border:1px solid #cbd5e1;border-radius:.375rem;background:#fff">
        <svg
          viewBox="0 0 120 120"
          width="220"
          height="220"
          @setinnersvg=".svg"
        ></svg>
      </div>
    </div>
  </div>
</template>
