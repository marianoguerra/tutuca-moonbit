<!-- Step 7 — asking for something the component does not have.

     `request` hands a NAME to the host, which answers whenever it can.
     The answer arrives at a `response` arm as a pair: a result and an
     error, exactly one of which is Null. -->

<script type="tutuca/state">
  state Quote {
    text  : String
    error : String
    busy  : Bool
    tries : Int
  }

  receive Quote {
    Init
  }

  /// The pair every request answers with. `Any` on both halves, because
  /// what a host produces is the host's business, not the schema's.
  response Quote {
    LoadQuote(Any, Any)
  }
</script>

<script type="tutuca/script">
  receive init {
    request 'loadQuote'
    .busy = true
  }

  on retry {
    request 'loadQuote'
    .busy = true
    .error = ''
    .tries += 1
  }

  /// Exactly one of the two is Null, so the branch is the whole arm.
  ///
  /// This page registers NO handler for `loadQuote`, and an unanswered
  /// name is not a crash: the runtime answers it with an error, which
  /// lands here exactly as a failed fetch would. That is what you are
  /// looking at below — the error path, live, with nothing mocked.
  response loadQuote(res, err) {
    .busy = false
    if (null? err) {
      .text = str res
    } else {
      .error = str err
    }
  }

  pred failed { not (empty? .error) }
</script>

<template>
  <div class="card bg-base-200 max-w-md">
    <div class="card-body gap-3">
      <p class="opacity-60 italic" @show=".busy">asking…</p>
      <p class="text-lg" @hide="$failed"><x text=".text"></x></p>
      <div class="alert alert-error" @show="$failed">
        <span class="font-mono text-sm"><x text=".error"></x></span>
      </div>
      <div class="card-actions items-center gap-2">
        <button class="btn btn-sm btn-primary" @on.click="retry">
          try again
        </button>
        <span class="badge badge-sm badge-neutral">
          tries: <x text=".tries"></x>
        </span>
      </div>
    </div>
  </div>
</template>
