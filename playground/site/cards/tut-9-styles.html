<!-- Styling by class name — the way every card here is styled.

     No <style> block anywhere in this file: the views name margaui's
     component classes (`card`, `btn`, `badge`, `input`) and Tailwind
     utilities beside them, and the page compiles them. It hands the
     class names the mounted card published to the margaui compiler and
     injects the CSS, which is what `<mb-card margaui>` asks for.

     Write them as LITERAL lists. The collector reads what the views
     say, so a class name assembled at run time is one that never gets
     compiled — which is why `@if.class` below switches between whole
     literals rather than appending a word to one. -->

<script type="tutuca/spec">
  state Ticket {
    title : String
    kind  : String
    votes : Int

    pred isFeature { .kind is 'feature' }
  }

  handle Ticket {
    message {
    init

    }
  }
</script>

<script type="tutuca/script">
  receive init {
    .title = 'Cards should be styleable'
    .kind = 'feature'
  }

  receive vote {
    .votes += 1
  }

  receive pick(k) {
    .kind = k
  }
</script>

<template>
  <div class="card bg-base-200 max-w-md">
    <div class="card-body gap-3">
      <h2 class="card-title">
        <x text=".title"></x>
        <span @if.class="$isFeature"
              @then="'badge badge-sm badge-primary'"
              @else="'badge badge-sm badge-warning'">
          <x text=".kind"></x>
        </span>
      </h2>
      <input class="input input-sm w-full" :value=".title"
             @on.input="setTitle e.value" placeholder="what is it">
      <div class="join">
        <button class="btn btn-sm join-item" @on.click="pick 'feature'">
          feature
        </button>
        <button class="btn btn-sm join-item" @on.click="pick 'bug'">
          bug
        </button>
      </div>
      <div class="card-actions items-center gap-2">
        <button class="btn btn-sm btn-primary" @on.click="vote">
          vote
        </button>
        <span class="badge badge-neutral"><x text=".votes"></x></span>
      </div>
    </div>
  </div>
</template>
