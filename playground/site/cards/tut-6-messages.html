<!-- Step 6 — messages, and why the schema declares them.

     An `on` handler is named by a view, so the views are where its
     arguments come from. A `receive` case is named by nobody the
     checker can see, so the schema is the only place it can be
     declared — and the only place its payload can be typed. -->

<script type="tutuca/state">
  state Thermostat {
    target : Int
    mode   : String
    log    : Array[String]
  }

  receive Thermostat {
    Init
    Nudge(Int)
    SetMode(String)
  }
</script>

<script type="tutuca/script">
  receive init {
    .target = 20
    .mode = 'auto'
    .log.push 'mounted'
  }

  receive nudge(by) {
    .target = clamp (.target + by) 5 30
    .log.push $'target → {.target}'
  }

  receive setMode(m) {
    .mode = m
    .log.push $'mode → {m}'
  }

  /// Four buttons, two bodies. A handler that raises a message at
  /// itself is how two call sites share one transition, and the
  /// dispatch goes through the transactor exactly as a parent's
  /// would.
  ///
  /// `(-1)` is parenthesised because `-` is an OPERATOR here, not
  /// part of the number — unlike a view slot, where `step -1` is a
  /// literal.
  on warmer { send 'nudge' 1 }
  on cooler { send 'nudge' (-1) }
  on away   { send 'setMode' 'away' }
  on home   { send 'setMode' 'auto' }

  pred isAway {
    .mode is 'away'
  }

  compute reading {
    if isAway { $'{.target}° away' } else { $'{.target}° {.mode}' }
  }
</script>

<template>
  <div class="card bg-base-200 max-w-md">
    <div class="card-body gap-3">
      <p @if.class="$isAway" @then="'text-3xl tabular-nums opacity-50'"
         @else="'text-3xl tabular-nums'">
        <x text="$reading"></x>
      </p>
      <div class="flex gap-2 items-center">
        <div class="join">
          <button class="btn btn-sm join-item"
                  @on.click="cooler">−</button>
          <button class="btn btn-sm join-item"
                  @on.click="warmer">+</button>
        </div>
        <button class="btn btn-sm btn-ghost" @on.click="away"
                @hide="$isAway">away</button>
        <button class="btn btn-sm btn-primary" @on.click="home"
                @show="$isAway">home</button>
      </div>
      <ul class="max-h-24 overflow-auto font-mono text-xs opacity-70">
        <li @each=".log"><x text="@value"></x></li>
      </ul>
    </div>
  </div>
</template>
