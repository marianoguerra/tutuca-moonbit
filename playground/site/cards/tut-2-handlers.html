<!-- Step 2 — the script block: what no mutator could be.

     Two fields moving together, an argument clamped before it lands,
     and a branch. -->

<script type="tutuca/state">
  state Steps {
    count : Int
    step  : Int
    trail : Array[Int]
  }

  /// The views never write `init`: the host dispatches it once, at
  /// mount, so the schema is the only place it can be declared.
  receive Steps {
    Init
  }
</script>

<script type="tutuca/script">
  /// A card starts at the schema's zero, and an Int zeroes to 0 —
  /// which would make every press below move by nothing at all.
  receive init {
    .step = 1
  }

  /// Move one step in `dir`, remembering where it landed.
  /// 
  /// `.count` on the second line reads what the first one wrote: a
  /// statement rebinds the state, so the trail records where the
  /// counter ENDED rather than where it started.
  receive step(dir) {
    .count += dir * .step
    .trail.push .count
  }

  /// `n` is whatever the call site wrote — `pickStep valueAsInt`
  /// below — so its type comes from there, not from an annotation.
  receive pickStep(n) {
    .step = clamp n 1 10
  }

  /// The last entry is a place like any other: `.trail[expr]` reads
  /// it and `.trail.deleteAt` drops it.
  receive undo {
    if (len .trail) > 0 {
      .trail.deleteAt ((len .trail) - 1)
      .count = 0
      if (len .trail) > 0 {
        .count = .trail[(len .trail) - 1]
      }
    }
  }
</script>

<template>
  <div class="card bg-base-200 max-w-md">
    <div class="card-body gap-3">
      <p class="text-4xl tabular-nums" @text=".count"></p>
      <div class="join">
        <button class="btn btn-sm join-item"
                @on.click="step 1">+</button>
        <button class="btn btn-sm join-item"
                @on.click="step -1">−</button>
        <button class="btn btn-sm join-item btn-ghost"
                @on.click="undo">undo</button>
      </div>
      <label class="flex gap-2 items-center">
        <span class="opacity-70">step</span>
        <input type="range" class="range range-sm" min="1" max="10"
               :value=".step" @on.input="pickStep e.valueAsInt">
        <span class="badge badge-sm badge-neutral">
          <x text=".step"></x>
        </span>
      </label>
      <ul class="flex gap-1 flex-wrap">
        <li class="badge badge-sm badge-ghost" @each=".trail">
          <x text="@value"></x>
        </li>
      </ul>
    </div>
  </div>
</template>
