<!-- Step 4 — a list, and the mutators that come with one.

     `@each` binds `@key` and `@value` for the row. Removing one
     needs no handler at all: `removeInSongsAt` is one of the four
     mutators the `Array[String]` field generated. -->

<script type="tutuca/state">
  state Playlist {
    draft : String
    songs : Array[String]
  }

  receive Playlist {
    Init
  }
</script>

<script type="tutuca/script">
  receive init {
    .songs.push 'Ramble On'
    .songs.push 'Pyramid Song'
    .songs.push 'Teardrop'
  }

  /// The guard is the whole handler: appending and clearing the box
  /// are both mutators, and refusing an empty draft is the part that
  /// belongs to this component.
  receive add {
    if (trim .draft) is not '' {
      .songs.push (trim .draft)
      .draft = ''
    }
  }

  /// Moving a row is two writes at two positions, which is exactly
  /// the shape no single mutator has.
  receive up(i) {
    if i > 0 {
      .songs.insertAt (i - 1) .songs[i]
      .songs.deleteAt (i + 1)
    }
  }

  pred any { not (empty? .songs) }

  compute caption { $'{len .songs} song(s)' }
</script>

<template>
  <div class="card bg-base-200 max-w-md">
    <div class="card-body gap-3">
      <h2 class="card-title">Playlist</h2>
      <div class="flex gap-2 items-center">
        <input class="input input-sm w-full" placeholder="add a song"
               :value=".draft" @on.input="setDraft e.value"
               @on.keydown+send="add">
        <button class="btn btn-sm btn-primary"
                @on.click="add">add</button>
      </div>
      <ul class="flex flex-col gap-2" @show="$any">
        <li class="flex gap-2 items-center w-full" @each=".songs">
          <span class="w-full"><x text="@value"></x></span>
          <button class="btn btn-xs btn-ghost" title="move up"
                  @on.click="up @key">↑</button>
          <button class="btn btn-xs btn-soft btn-error btn-circle"
                  title="remove"
                  @on.click="removeInSongsAt @key">×</button>
        </li>
      </ul>
      <p class="opacity-60 italic" @hide="$any">
        nothing queued — press Enter to add
      </p>
      <span class="badge badge-sm badge-neutral">
        <x text="$caption"></x>
      </span>
    </div>
  </div>
</template>
