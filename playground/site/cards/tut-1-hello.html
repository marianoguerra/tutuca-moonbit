<!-- Step 1 — the schema on its own.

     No <script type="tutuca/script"> in this file, and the card still
     still answers its events: direct property actions need no named
     message declarations. -->

<script type="tutuca/spec">
  state Greeter {
    name : String
    loud : Bool
  }
</script>

<template>
  <div class="card bg-base-200 max-w-md">
    <div class="card-body gap-3">
      <label class="flex gap-2 items-center">
        <span class="opacity-70">your name</span>
        <input class="input input-sm w-full" :value=".name"
               @on.input=".name = e.value" placeholder="type here">
      </label>
      <label class="flex gap-2 items-center">
        <input type="checkbox" class="checkbox checkbox-sm"
               :checked=".loud" @on.click=".loud = not .loud">
        <span class="opacity-70">shout it</span>
      </label>
      <p @if.class=".loud"
         @then="'text-xl font-bold uppercase tracking-widest'"
         @else="'text-xl'">
        hello, <x text=".name"></x>
      </p>
      <p class="opacity-60 italic" @show="empty? .name">
        the greeting follows what you type
      </p>
    </div>
  </div>
</template>
