<!-- Step 8 — rules with names.

     One construct covers all three: a `pred` guarding a body is a
     PRECONDITION, a `pred` that must hold after every handler is an
     INVARIANT, and a `pred` about one transition is a POSTCONDITION.
     The badges below read the same two predicates the handlers do. -->

<script type="tutuca/state">
  state Ledger {
    total : Int
    here  : Int
    there : Int
    moves : Int
  }

  receive Ledger {
    Init
  }
</script>

<script type="tutuca/script">
  receive init {
    .total = 8
    .here = 8
  }

  /// PRECONDITIONS — what each handler asks before it moves anything.
  pred canPush { .here > 0 }
  pred canPull { .there > 0 }

  /// The guard IS the precondition, and it needs no rollback: a body
  /// that declines leaves the state exactly as it found it, effects
  /// included. There is no half-move to clean up.
  on push {
    if canPush {
      .here -= 1
      .there += 1
      .moves += 1
    }
  }

  on pull {
    if canPull {
      .there -= 1
      .here += 1
      .moves += 1
    }
  }

  /// INVARIANT — true before every handler and after every handler.
  /// Nothing checks it for you; the badge below is what checks it, and
  /// a test would assert the same name after every dispatch.
  pred conserved {
    (.here + .there) is .total
  }

  /// A cross-field rule, in the shape `implies` is here for: exactly
  /// two operands, so there is no precedence to get wrong.
  pred emptyMeansMoved {
    (.here is 0) implies (.moves > 0)
  }

  /// The button that breaks the invariant, on purpose. Nothing in the
  /// language stops it — which is precisely why the badge is worth
  /// having.
  on cheat {
    .there += 1
  }
</script>

<template>
  <div class="card bg-base-200 max-w-md">
    <div class="card-body gap-3">
      <div class="stats bg-base-100">
        <div class="stat">
          <div class="stat-title">here</div>
          <div class="stat-value text-2xl" @text=".here"></div>
        </div>
        <div class="stat">
          <div class="stat-title">there</div>
          <div class="stat-value text-2xl" @text=".there"></div>
        </div>
        <div class="stat">
          <div class="stat-title">moves</div>
          <div class="stat-value text-2xl" @text=".moves"></div>
        </div>
      </div>
      <div class="flex gap-2 items-center flex-wrap">
        <div class="join">
          <button class="btn btn-sm join-item" @on.click="push">
            here → there
          </button>
          <button class="btn btn-sm join-item" @on.click="pull">
            there → here
          </button>
        </div>
        <button class="btn btn-sm btn-soft btn-error" @on.click="cheat"
                title="mint one out of nothing">cheat</button>
      </div>
      <ul class="flex flex-col gap-1 font-mono text-xs">
        <li class="flex gap-2 items-center">
          <span @if.class="$conserved"
                @then="'badge badge-sm badge-success'"
                @else="'badge badge-sm badge-error'">
            <x text="$conserved"></x>
          </span>
          conserved: here + there is total
        </li>
        <li class="flex gap-2 items-center">
          <span @if.class="$emptyMeansMoved"
                @then="'badge badge-sm badge-success'"
                @else="'badge badge-sm badge-error'">
            <x text="$emptyMeansMoved"></x>
          </span>
          emptyMeansMoved: here is 0 implies moves &gt; 0
        </li>
      </ul>
    </div>
  </div>
</template>
