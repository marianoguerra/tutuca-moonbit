<!-- Step 8 — rules with names, and a runtime that keeps them.

     A `pred` names a rule. Where it ATTACHES says which of the three it is:
     `requires` before a transition is a PRECONDITION, `ensures` after one is a
     POSTCONDITION, and `invariant` — declared once, checked after every
     handler — is what the component keeps. The badges below read the same
     names the handlers do. -->

<script type="tutuca/state">
  state Ledger {
    total : Int
    here  : Int
    there : Int
    moves : Int
  }

  receive Ledger {
    Init
  }
</script>

<script type="tutuca/script">
  receive init {
    .total = 8
    .here = 8
  }

  /// PRECONDITIONS — what each handler asks before it moves anything.
  ///
  /// The `format` is what each one SAYS when it declines. Press a button with
  /// nothing left on that side and the console gets the sentence rather than
  /// silence.
  pred canPush format 'nothing left here to push' { .here > 0 }
  pred canPull format 'nothing over there to pull back' { .there > 0 }

  /// The guard has a NAME and sits in the header, so a reader knows when the
  /// handler applies without reading the body. It still needs no rollback: a
  /// precondition is asked before anything has moved.
  on push requires canPush {
    .here -= 1
    .there += 1
    .moves += 1
  }

  on pull requires canPull {
    .there -= 1
    .here += 1
    .moves += 1
  }

  /// A POSTCONDITION — asked after the body, against where it landed. It is
  /// about what THIS handler was supposed to achieve, which is the half a
  /// reader can check by looking: `pushAll` is the handler that empties
  /// `here`, and `hereEmpty` is that sentence written down.
  ///
  /// One clause of each kind is the limit, and both on one header is the shape
  /// a transition takes when it has something to ask and something to promise.
  pred hereEmpty { .here is 0 }

  on pushAll requires canPush ensures hereEmpty {
    .there += .here
    .here = 0
    .moves += 1
  }

  /// THE INVARIANT — the component keeps this, so it is checked after every
  /// handler above and every handler added later, including the ones that
  /// never mention it.
  ///
  /// The `format` is what it SAYS when it does not hold, evaluated against the
  /// state that was rejected — so the numbers in the sentence are the ones that
  /// broke the rule. This comment says what the rule is; the format says what
  /// went wrong this time.
  invariant conserved
    format $'{.here} + {.there} is not {.total} — a token came from nowhere'
  {
    (.here + .there) is .total
  }

  /// A cross-field rule, in the shape `implies` is here for: exactly two
  /// operands, so there is no precedence to get wrong. Left as a plain `pred`
  /// — it is read by the badge below and by nothing else, which is what a
  /// rule looks like before you decide it is worth enforcing.
  pred emptyMeansMoved {
    (.here is 0) implies (.moves > 0)
  }

  /// The button that tries to mint one out of nothing. It is refused — by a
  /// rule it does not mention — and the refusal is reported rather than
  /// silent. Open the console: `contract: cheat was abandoned — it broke the
  /// invariant conserved: 8 + 1 is not 8 — a token came from nowhere`. A host
  /// that wants the record rather than the line calls `on_refusal`, and gets
  /// the rule, the path and the state that was rejected with it.
  on cheat {
    .there += 1
  }
</script>

<template>
  <div class="card bg-base-200 max-w-md">
    <div class="card-body gap-3">
      <div class="stats bg-base-100">
        <div class="stat">
          <div class="stat-title">here</div>
          <div class="stat-value text-2xl" @text=".here"></div>
        </div>
        <div class="stat">
          <div class="stat-title">there</div>
          <div class="stat-value text-2xl" @text=".there"></div>
        </div>
        <div class="stat">
          <div class="stat-title">moves</div>
          <div class="stat-value text-2xl" @text=".moves"></div>
        </div>
      </div>
      <div class="flex gap-2 items-center flex-wrap">
        <div class="join">
          <button class="btn btn-sm join-item" @on.click="push">
            here → there
          </button>
          <button class="btn btn-sm join-item" @on.click="pull">
            there → here
          </button>
          <button class="btn btn-sm join-item" @on.click="pushAll"
                  title="a postcondition: it has to land with here at 0">
            all →
          </button>
        </div>
        <button class="btn btn-sm btn-soft btn-error" @on.click="cheat"
                title="refused by the invariant, and reported">cheat</button>
      </div>
      <ul class="flex flex-col gap-1 font-mono text-xs">
        <li class="flex gap-2 items-center">
          <span @if.class="$conserved"
                @then="'badge badge-sm badge-success'"
                @else="'badge badge-sm badge-error'">
            <x text="$conserved"></x>
          </span>
          conserved: here + there is total
        </li>
        <li class="flex gap-2 items-center">
          <span @if.class="$emptyMeansMoved"
                @then="'badge badge-sm badge-success'"
                @else="'badge badge-sm badge-error'">
            <x text="$emptyMeansMoved"></x>
          </span>
          emptyMeansMoved: here is 0 implies moves &gt; 0
        </li>
      </ul>
    </div>
  </div>
</template>
