<!-- Step 7 — asking for something the component does not have.

     `intent` hands a NAME to a ROUTE, and something on that route answers
     whenever it can. `lex` is the leg that searches the registered
     handlers — what a host puts in the scope.

     THREE outcomes, three arms, each with its own shape: it worked, it
     failed, or nobody answered at all. That last one is not an error, and
     giving it its own name is the difference between "the fetch broke" and
     "this page has no fetch". -->

<script type="tutuca/state">
  state Quote {
    text  : String
    error : String
    busy  : Bool
    tries : Int
  }

  /// `Init` is the host's. The other three are the ANSWERS, and declaring
  /// them is what makes `loadQuote` a request rather than a notification —
  /// a sender expects an answer if and only if it declares an arm for one.
  /// Nobody writes that down twice; the generator reads this list.
  ///
  /// `Any` on the payloads, because what a host produces is the host's
  /// business, not the schema's.
  receive Quote {
    init
    loadQuoteOk(Any)
    loadQuoteError(Any)
    loadQuoteUnhandled
  }
</script>

<script type="tutuca/script">
  receive init {
    intent lex 'loadQuote'
    .busy = true
  }

  receive retry {
    intent lex 'loadQuote'
    .busy = true
    .error = ''
    .tries += 1
  }

  /// Each outcome is its own arm, and each gets only what it is about.
  /// 
  /// v1 sent one payload carrying BOTH a result and an error, exactly one
  /// of which was Null, and every arm began by working out which. The
  /// branch is gone with the pair.
  receive loadQuoteOk(res) {
    .busy = false
    .text = str res
  }

  receive loadQuoteError(err) {
    .busy = false
    .error = str err
  }

  /// The third outcome, and the one this page is actually showing you.
  /// 
  /// It registers NO handler for `loadQuote`, so the route runs out and
  /// NOBODY answered — which is not the same as a fetch that failed. v1
  /// could only say the second, so it invented an error and this arm was a
  /// lie about what happened. Now it says the true thing.
  receive loadQuoteUnhandled {
    .busy = false
    .error = 'nothing on this page answers `loadQuote`'
  }

  pred failed { not (empty? .error) }
</script>

<template>
  <div class="card bg-base-200 max-w-md">
    <div class="card-body gap-3">
      <p class="opacity-60 italic" @show=".busy">asking…</p>
      <p class="text-lg" @hide="$failed"><x text=".text"></x></p>
      <div class="alert alert-error" @show="$failed">
        <span class="font-mono text-sm"><x text=".error"></x></span>
      </div>
      <div class="card-actions items-center gap-2">
        <button class="btn btn-sm btn-primary" @on.click="retry">
          try again
        </button>
        <span class="badge badge-sm badge-neutral">
          tries: <x text=".tries"></x>
        </span>
      </div>
    </div>
  </div>
</template>
