<!-- Step 5 — the two things a loop asks the block.

     `@when` keeps a row or drops it. `@enrich-with` answers a
     question ABOUT the row and binds the answer as `@picked`, which
     is how a template reads what no field holds. -->

<script type="tutuca/spec">
  state Crew {
    query  : String
    names  : Array[String]
    picked : Set[String]
  }

  handle Crew {
    message {
    init

    }
  }
</script>

<script type="tutuca/script">
  receive init {
    .names.push 'Ada Lovelace'
    .names.push 'Grace Hopper'
    .names.push 'Alan Turing'
    .names.push 'Barbara Liskov'
    .names.push 'Edsger Dijkstra'
  }

  /// A row survives when the query is empty or its text contains it,
  /// folded on both sides so the filter is not a spelling test.
  ///
  /// `@when` takes this bare — an iteration filter has always been
  /// a name.
  pred matches { (empty? .query) or (contains (lower @value) (lower .query)) }

  /// Per-row bindings. The renderer hands an enricher the row's key
  /// and value; what it writes is in scope for that row and nowhere
  /// else.
  enrich row {
    @picked = has .picked @value
  }

  compute caption { $'{len .picked} picked of {len .names}' }
</script>

<template>
  <div class="card bg-base-200 max-w-md">
    <div class="card-body gap-3">
      <input type="search" class="input input-sm w-full"
             placeholder="filter" :value=".query"
             @on.input="setQuery e.value">
      <ul class="flex flex-col gap-1">
        <li @each=".names" @when="matches" @enrich-with="row">
          <label @if.class="@picked"
                 @then="'flex gap-2 items-center font-semibold'"
                 @else="'flex gap-2 items-center'">
            <input type="checkbox" class="checkbox checkbox-sm"
                   :checked="@picked" @on.click="toggleInPicked @value">
            <x text="@value"></x>
          </label>
        </li>
      </ul>
      <span class="badge badge-sm badge-neutral">
        <x text="$caption"></x>
      </span>
    </div>
  </div>
</template>
