<script type="tutuca/state">
  state FpGreeting {
    name : String
  }

  state Note {
    text : String
  }

  receive Note {
    Write(String)
  }

  state Mailbox {
    note : Note
  }
</script>

<template id="FpGreeting">
  <p @text=".name"></p>
</template>

<template id="Note">
  <p class="note" @text=".text"></p>
</template>

<template id="Mailbox">
  <section><x render=".note"></x></section>
</template>
