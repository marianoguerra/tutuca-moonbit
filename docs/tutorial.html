<script type="tutuca/spec">
  state Counter {
    count : Int
  }

  state Profile {
    name : String
    waving : Bool
  }

  state Search {
    draft : String
    sent : String
  }

  state Toggle {
    on : Bool
    message : Any
  }

  state Fruits {
    items : Array[String]
  }

  state Greeting {
    name : String
  }

  state Page {
    greeting : Greeting
  }

  state Status {
    message : String
  }

  handle Status {
    message {
    flash(String)

    }
  }

  state Chat {
    draft : String
    status : Status
  }

  state Quotes {
    items : Array[String]
    isLoading : Bool
  }

  /// `Init` is the host's. The other two are the ANSWERS to an
  /// `intent lex 'loadQuotes'`, and declaring them is what makes it a request
  /// rather than a notification — a sender expects an answer if and only if it
  /// declares an arm for one.
  ///
  /// Two arms where v1 had one: each outcome gets its own name and its own
  /// shape, instead of one payload carrying a result and an error with exactly
  /// one of them Null.
  handle Quotes {
    message {
    init
    loadQuotesOk(Array[Any])
    loadQuotesError(String)

    }
  }

  state Features {
    status : String
  }
</script>

<script type="tutuca/script" for="Counter">
  /// The counter's whole behaviour, in the file that already holds its state
  /// and its view. `gen-views` compiles this into the update the generated
  /// `counter_component` passes, so the MoonBit side has nothing to answer.
  receive inc {
    .count += 1
  }

  receive dec {
    .count -= 1
  }
</script>

<template id="Counter">
  <div>
    <button class="dec" @on.click="dec">-</button>
    <span class="count" @text=".count"></span>
    <button class="inc" @on.click="inc">+</button>
  </div>
</template>

<template id="Profile">
  <section>
    <input class="who" :value=".name" @on.input=".name = e.value"
      :title="$'Editing {.name}'">
    <button class="wave" @on.click=".waving = not .waving">wave</button>
    <p class="out" @text="$'Hello, {.name}!'"></p>
  </section>
</template>

<template id="Search">
  <section>
    <input class="q" :value=".draft"
      @on.input=".draft = e.value"
      @on.keydown+send=".sent = e.value"
      @on.keydown+cancel=".draft = default">
    <p class="sent" @text=".sent"></p>
  </section>
</template>

<template id="Toggle">
  <section>
    <button class="flip" @on.click=".on = not .on"
      @if.class=".on" @then="'flip is-on'" @else="'flip is-off'">toggle</button>
    <p class="yes" @show=".on">it is ON</p>
    <p class="no" @hide=".on">it is OFF</p>
    <p class="msg" @show="truthy? .message" @text=".message"></p>
  </section>
</template>

<template id="Fruits">
  <ul>
    <li @each=".items" @when="notTooLong">
      <span class="k" @text="@key"></span>: <x text="@value"></x>
    </li>
  </ul>
</template>

<template id="Greeting">
  <p class="hello">Hello, <strong @text=".name"></strong>!</p>
</template>

<template id="Greeting:shout">
  <p class="hello">HELLO, <strong @text=".name"></strong>!!!</p>
</template>

<template id="Page">
  <section>
    <x render=".greeting"></x>
    <x render=".greeting" as="shout"></x>
  </section>
</template>

<template id="Status">
  <p class="status" @show="truthy? .message" @text=".message"></p>
</template>

<template id="Chat">
  <section>
    <x render=".status"></x>
    <input class="draft" :value=".draft" @on.input=".draft = e.value">
    <button class="send" @on.click="submit">send</button>
  </section>
</template>

<template id="Quotes">
  <section>
    <p class="loading" @show=".isLoading">Loading…</p>
    <ul><li @each=".items"><x text="@value"></x></li></ul>
  </section>
</template>

<template id="macro:badge" data-label="'New'">
  <span class="badge" @text="^label"></span>
</template>

<template id="Features">
  <div>
    <span>Feature A</span> <x:badge></x:badge>
    <span>Feature B</span> <x:badge label="Beta"></x:badge>
    <span>Feature C</span> <x:badge :label=".status"></x:badge>
  </div>
</template>
