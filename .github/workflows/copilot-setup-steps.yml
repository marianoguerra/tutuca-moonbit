# Reference: https://docs.github.com/en/copilot/how-tos/use-copilot-agents/coding-agent/customize-the-agent-environment
name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      # If you want to clone the repository as part of your setup steps, for example to install dependencies, you'll need the `contents: read` permission. If you don't clone the repository in your setup steps, Copilot will do this for you automatically after the steps complete.
      contents: read

    # You can define any steps you want, and they will run before the agent starts.
    # If you do not check out your code, Copilot will do this for you.
    steps:
      # Kept in step with ci.yml's setup, which is the environment the tasks
      # actually expect: several of them (check-examples, check-skill,
      # check-storybook-template, the playground assembly) are node scripts, so
      # an agent with only MoonBit installed can run `moon check` and nothing
      # else.
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node (happy-dom for js-target tests, and the node-driven checks)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # `check-tgc` assembles hand-written .wat into .wasm with `wasm-tools`
      # (tgc/test/build.mjs), so it must be on PATH or compose.test.mjs and
      # conformance.test.mjs die on ENOENT. Prebuilt release rather than
      # `cargo install`, which takes minutes.
      - name: Set up wasm-tools
        env:
          WASM_TOOLS_VERSION: "1.244.0"
        run: |
          curl -fsSL "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz" \
            | tar xz -C /tmp
          mkdir -p "$HOME/.local/bin"
          mv "/tmp/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux/wasm-tools" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update MoonBit dependencies
        run: |
          moon version --all
          moon update

      - name: Install npm dev dependencies
        run: npm install

