# Build the self-contained `dist/` and publish it as the root of GitHub Pages.
# `cmd/dev -- dist` assembles dist/index.html (landing page) + the js/wasm
# demos, storybook, playground, and CLI binary; this deploys that folder as-is.
#
# Enable once in the repo: Settings → Pages → Build and deployment →
# Source = "GitHub Actions".
#
# NOTE — playground live-compile coupling: the precompiled demos (counter,
# examples, storybook, wasm) work regardless of toolchain. The in-browser
# playground editor compiles against the pinned @moonbit/moonc-worker and needs
# the installed `moon` to match it; both are pinned in
# playground/build/toolchain.json.
#
# This job installs the LATEST toolchain, because cli.moonbitlang.com serves
# only `latest`/`nightly` — every dated or versioned identifier we tried 404s,
# so MOONBIT_INSTALL_VERSION has nothing to point at. The guard is instead at
# assemble time: `assemble.mjs` compares `moon version --all` against the pin
# and fails this build rather than deploying a playground that reports
# nonsense errors on every edit. When it fails, bump toolchain.json and
# re-fetch (see playground/vendor/README.md) — do not paper over it with
# TUTUCA_ALLOW_TOOLCHAIN_MISMATCH.
name: Deploy dist to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege needed to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push supersede an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update MoonBit dependencies
        run: |
          moon version --all
          moon update

      - name: Install npm dependencies
        run: npm install

      # wasm-tools is needed to componentize the guest bundles
      # (wasm-tools component embed/new). Prebuilt release binary —
      # keep the pin roughly in sync with guests/counter/README.md.
      - name: Install wasm-tools
        run: |
          WASM_TOOLS_VERSION=1.244.0
          curl -fsSL "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz" \
            | tar -xz -C /tmp
          mkdir -p "$HOME/.local/bin"
          mv "/tmp/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux/wasm-tools" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build dist
        run: moon run --target native cmd/dev -- dist

      # the universal demo also builds the Rust guest (polyglot sample), which
      # needs the wasm32 target; cargo is preinstalled on the runner.
      - name: Add Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      # universal drag-and-drop demo: the wasm-gc drop shell + every sample
      # single-file bundle (the MoonBit guests in guests/guests.mjs plus the Rust
      # rust-tempconv, into dist/universal/examples/). Builds the guests it packs.
      - name: Build universal demo
        run: moon run --target native cmd/dev -- universal

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
