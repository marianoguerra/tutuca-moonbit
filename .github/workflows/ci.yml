name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node (happy-dom for js-target tests)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # `check-tgc` assembles hand-written .wat into .wasm with `wasm-tools`
      # (tgc/test/build.mjs), so it must be on PATH or compose.test.mjs and
      # conformance.test.mjs die on ENOENT. Prebuilt release rather than
      # `cargo install`, which takes minutes.
      - name: Set up wasm-tools
        env:
          WASM_TOOLS_VERSION: "1.244.0"
        run: |
          curl -fsSL "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz" \
            | tar xz -C /tmp
          mkdir -p "$HOME/.local/bin"
          mv "/tmp/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux/wasm-tools" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update MoonBit dependencies
        run: |
          moon version --all
          moon update

      - name: Install npm dev dependencies
        run: npm install

      # `ci` runs `check` then `test` across all three targets
      # (wasm-gc, js/happy-dom, native) — the single source of truth lives in
      # dev/tasks.mbt. See AGENTS.md "Targets".
      - name: Check + test (all targets)
        run: moon run --target native cmd/dev -- ci
