<script type="tutuca/spec">
  /// A list that holds rows, and the row beside it. Two components in one
  /// file, which `viewfile` has always allowed and this backend refused until
  /// it learned to number them.
  state Board {
    /// What the header says.
    title: String
    /// How many rows have been counted.
    tally: Int
    /// A child slot: the row this board is looking at.
    ///
    /// `Row` is the sibling declared below, so this is `Component[Row]` without
    /// having to say so. A card cannot BUILD one — `new` makes a declared
    /// record, not an instance — but it can hold one a host put here, and that
    /// is what makes a child token something worth being able to carry.
    focus: Row
  }

  /// A row of the board, declared here rather than in a file of its own —
  /// which is the point: a component that only ever appears inside another one
  /// belongs beside it.
  state Row {
    /// What this row says.
    label: String
    /// Whether it is struck through.
    done: Bool
  }
</script>

<script type="tutuca/script" for="Board">
  /// Count one more.
  receive bump {
    .tally += 1
  }

  /// The header, as a sentence.
  compute caption { $'{.title}: {.tally}' }
</script>

<script type="tutuca/script" for="Row">
  /// Strike this row through, or un-strike it.
  receive toggle {
    .done = not .done
  }

  /// The same name the board declares, and a different answer — which is the
  /// whole reason a generated name has to carry its component.
  compute caption { if .done { 'done' } else { .label } }
</script>

<script type="tutuca/test">
{
  "the board counts": {
    "component": "Board",
    "args": { "title": "Sprint" },
    "steps": [
      { "expect": "text", "at": "h1.title", "is": "Sprint: 0" },
      { "click": "button.bump" },
      { "click": "button.bump" },
      { "expect": "text",  "at": "h1.title", "is": "Sprint: 2" },
      { "expect": "state", "at": ".tally", "is": 2 }
    ]
  },
  "a row strikes itself through": {
    "component": "Row",
    "args": { "label": "write it" },
    "steps": [
      { "expect": "text", "at": "li.row", "is": "write it" },
      { "click": "li.row" },
      { "expect": "text",  "at": "li.row", "is": "done" },
      { "expect": "attr",  "at": "li", "name": "class", "is": "row done" },
      { "expect": "state", "at": ".done", "is": true }
    ]
  },
  "neither answers the other's message": {
    "component": "Board",
    "steps": [
      { "send": "toggle" },
      { "expect": "state", "is": { "title": "", "tally": 0, "focus": null } },
      { "send": "bump" },
      { "expect": "state", "at": ".tally", "is": 1 }
    ]
  }
}
</script>

<template id="Board:main">
  <section>
    <h1 class="title" @text="$caption"></h1>
    <button class="bump" @on.click="bump">count</button>
  </section>
</template>

<template id="Row:main">
  <li class="row" @if.class=".done" @then="'row done'" @else="'row'"
      @text="$caption" @on.click="toggle"></li>
</template>
