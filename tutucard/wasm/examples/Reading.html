<script type="tutuca/spec">
  /// A field typed as text and used as a number.
  state Reading {
    /// What the input carried, verbatim.
    raw: String
    /// The same thing read as a number.
    value: Double
    /// And truncated to a whole unit.
    whole: Int
    /// What the six-argument compute answered.
    tally: Double
  }

  /// What the host answers an `intent lex 'rows'` with. No view writes these,
  /// so the schema is the only place they can be declared — and declaring
  /// them is what makes `rows` a request rather than a notification.
  handle Reading {
    message {
    rowsOk(Any)
    rowsError(Any)

    }
  }
</script>

<script type="tutuca/script">
  /// Six arguments — two more than the argument list used to hold.
  compute total(a, b, c, d, e, f) { a + b + c + d + e + f }

  /// Read `raw` as a number. A `raw` that is not one leaves the state alone.
  receive parse {
    .value = num .raw
  }

  /// The same reading, truncated.
  receive truncate {
    .whole = int .raw
  }

  /// A call with six arguments, and a `send` carrying six payload values.
  receive wide {
    .tally = total 1 2 3 4 5 6
    send 'wide' 1 2 3 4 5 6
  }

  /// Ask the scope to look `raw` up. The answer comes back later.
  receive lookup {
    intent lex 'rows' .raw
  }

  /// …as an ordinary message, in the same `receive` bucket everything else
  /// lands in, named for the OUTCOME rather than for the request.
  receive rowsOk(result) {
    .raw = str result
  }

  receive rowsError(error) {
    .raw = str error
  }
</script>

<template id="Reading">
  <div>
    <p @text=".raw"></p>
    <p @text=".value"></p>
    <button @on.click="parse">parse</button>
  </div>
</template>
