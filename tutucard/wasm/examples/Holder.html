<script type="tutuca/spec">
  /// A hole that names nothing: `child` is a bare `component`, so what goes in
  /// it is anybody's — a sibling declared below, or something from outside the
  /// card entirely. A card cannot BUILD one, and does not have to: what makes
  /// a holder work is that a host can PUT one here and the card can render it.
  state Hole {
    /// The hole.
    child: Component
    /// Something beside it, so a test can tell an empty read from a lost one.
    kept: String
  }

  /// The sibling a hole usually holds. Same card, same bundle, which is the
  /// case a holder meets first: ship your container and your primitives
  /// together and every hole holds one of your own.
  state Text {
    /// What it says.
    body: String

    /// …and it says so PUBLICLY, which is what lets a holder write it.
    ///
    /// The declaration is the whole permission. A holder writing
    /// `.child.body = 'x'` reaches this and nothing else: a field with no
    /// property beside it is private, and stays private however it is held.
    property {
      body: String { get .body set .body }
    }
  }
</script>

<script type="tutuca/script" for="Hole">
  /// Write a member of the child this hole holds.
  ///
  /// Not a spine rebuild and never was — the instance belongs to the HOST and
  /// a card holds a token — so it is addressed at the child's position instead,
  /// through the public door. Before this there was no way to write it at all:
  /// the `sendAt 'setBody'` workaround went away with the generated mutators.
  receive rename(to) {
    .child.body = to
    .kept = 'wrote'
  }
</script>

<template id="Hole:main"><div class="hole"><x render=".child"></x><b class="kept" @text=".kept"></b></div></template>
<template id="Text:main"><span class="text" @text=".body"></span></template>
