<script type="tutuca/spec">
  /// A number with buttons that raise and lower it.
  state Counter {
    /// The current value.
    count: Int
    /// How much a step moves it.
    step: Int

    property {
      count: Int { get .count set .count }
      magnitude: Int { get set }
    }

    /// True while the count is above zero.
    pred positive { .count > 0 }
  }

  /// What the host says to this component when it mounts. Declared here
  /// because no view writes it: the schema is the only place it can be.
  handle Counter {
    message {
    init

    }
  }
</script>

<script type="tutuca/script">
  /// Add one step.
  receive inc {
    .count += .step
  }

  /// Take one step off.
  receive dec {
    .count -= .step
  }

  /// Start with a step of one.
  receive init {
    .step = 1
  }

  /// Back to nothing.
  receive reset {
    .count = 0
  }

  /// The count as a sentence.
  compute label { $'the count is {.count}' }

  get magnitude {
    if (.count < 0) { -.count } else { .count }
  }

  set magnitude {
    if (.count < 0) {
      .count = -value
    } else {
      .count = value
    }
  }
</script>

<script type="tutuca/test">
{
  "two clicks add two": {
    "steps": [
      { "send": "init" },
      { "click": "button", "nth": 1 },
      { "click": "button", "nth": 1 },
      { "expect": "text",  "at": "output", "is": "2" },
      { "expect": "text",  "at": "p", "is": "the count is 2" },
      { "expect": "state", "at": ".count", "is": 2 },
      { "expect": "refused", "is": [] }
    ]
  },
  "reset takes its own button away": {
    "steps": [
      { "send": "init" },
      { "click": "button", "nth": 1 },
      { "expect": "count", "at": "button", "is": 3 },
      { "click": "button", "nth": 2 },
      { "expect": "text",  "at": "output", "is": "0" },
      { "expect": "count", "at": "button", "is": 2 }
    ]
  }
}
</script>

<template id="Counter">
  <div>
    <button @on.click="dec">-</button>
    <output @text=".count"></output>
    <button @on.click="inc">+</button>
    <p @text="$label"></p>
    <button @on.click="reset" @show="$positive">reset</button>
  </div>
</template>
