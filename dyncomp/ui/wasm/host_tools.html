<script type="tutuca/state">
  interface host-tools {
    /// One bundle this host offers to load by URL: what to call it, and where
    /// it is. A HOST supplies these; nothing here knows any bundle's name.
    record sample { label: string, url: string }

    /// The bar's conveniences: fetch a bundle by URL, or drop one on the page.
    ///
    /// It sits INSIDE the app's bar rather than around the app, because the
    /// whole viewport is the app. `dyncomp/ui` is backend-agnostic and cannot
    /// fetch an archive or read a dropped file; this is the component it
    /// renders in the one place it left for a host to stand.
    record state {
      status: string,
      /// The bundles to offer, as buttons. Empty is the ordinary case and
      /// draws nothing: a first-time visitor should meet an empty page and a
      /// `+`, not a row of buttons naming archives they have never heard of.
      /// A host that wants them — a demo, a gallery, a page shipped with its
      /// own components — passes them in.
      samples: list<sample>,
    }
    variant receive {
      /// Files the app forwarded — dropped anywhere on the page, or on a cell
      /// that handed back what was not its.
      files-dropped(any),
      /// The bridge's own answers, routed here because this is the path that
      /// asked for the load.
      dyncomp-loaded(string),
      dyncomp-error(string),
    }
    variant bubble {
      /// The catalog changed. The app re-runs whatever the command bar is
      /// showing rather than telling a person to retype it.
      catalog-changed(string),
    }
  }
</script>

<!-- Loading a sample is the same archive a drop would carry, named by URL
     instead. Loading one that is already registered HOT-SWAPS it, and the
     catalog answers with the new components immediately.

     Dropping a bundle is never gated: that is what the page is for, and the
     whole viewport stays a drop target whether or not any samples are
     offered. -->
<template id="HostTools">
  <span class="host-tools flex items-center gap-2">
    <div class="join" @hide="empty? .samples">
      <button class="btn btn-xs join-item load-sample" @each=".samples"
              @on.click="loadSample @value.url" @text="@value.label"></button>
    </div>
    <span class="text-xs opacity-60 host-status" @text=".status"></span>
  </span>
</template>
