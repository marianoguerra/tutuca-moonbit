<script type="tutuca/spec">
  /// The one component that must exist.
  ///
  /// It is a HOLDER, not a placeholder that gets replaced: empty it draws a
  /// `+`, filled it draws what it holds and keeps holding it. That is what
  /// gives every user-placed component one uniform, host-owned home for the
  /// editing chrome — a guest component is decorated exactly like a standard
  /// one, because neither of them is asked to participate.
  ///
  /// It is also what a container's children always are, so "insert a cell
  /// here" is "insert an empty universal at index i", with no kind to decide
  /// and no binding to invent.
  ///
  /// Edit mode is the `edit` VIEW, not a field: the app pushes it with
  /// `@push-view` and every descendant that has one picks it up. A boolean
  /// threaded through every component would be the same fact stored once per
  /// node, and a guest — which cannot grow the field — could never join in.
  state Universal {
    /// What this holds, or null, which is what draws the `+`.
    child : Component
  }

  handle Universal {
    intent {
    /// The `+` was clicked. True when ctrl/cmd was held, which means "let me
    /// configure it" rather than "place it with its defaults".
    addRequested(Bool)
    /// The badge was clicked or the config pill was dropped here. Carries
    /// what is held, because the app needs the instance and asking it to
    /// find one by path would be a second way to name the same thing.
    configRequested(Any)

    }
  }

  handle Universal {
    message {
    /// Hold this. The app builds the instance — it is the only one that can,
    /// since building a guest needs the dyncomp bridge — and hands it over.
    hold(Any)
    /// Empty it again, which gives the `+` back rather than deleting a cell.
    empty
    /// Write these fields into what is held. The app validated them against
    /// the schema first; this only knows that its child is the thing they
    /// belong to, which is exactly what the app cannot know.
    applyConfig(Any)

    }
  }

  /// A row or a column. Everything about it is direction, spacing and
  /// alignment; `children` are universals and nothing else.
  state Stack {
    children : Array[Universal]
    direction : String
    justify : String
    align : String
    gap : Int
    padding : Int
    wrap : Bool
  }

  /// A uniform m×n grid: every cell the same size, `children` in row-major
  /// order, and `cols * rows` of them at all times.
  ///
  /// Uniform on purpose. A grid whose tracks can each be something different
  /// is the layout that is easiest to get subtly wrong and hardest to explain
  /// to somebody adding a cell; a bento box wants a component of its own
  /// rather than a mode of this one.
  state Grid {
    children : Array[Universal]
    cols : Int
    rows : Int
    gap : Int
    padding : Int
  }

  /// One tab: a name on the strip, and whatever is under it.
  ///
  /// `body` is a universal, so a fresh tab opens on a `+` and a person picks
  /// what goes in it. That is the notepad: a tabbed thing whose tabs hold
  /// text areas, composed rather than written.
  state TabPage {
    label : String
    body : Component
  }

  handle TabPage {
    intent {
    /// The name is settled — Enter, or the box lost focus.
    doneRename
    /// Escape: put the old name back, which only the strip still knows.
    cancelRename

    }
  }

  /// A tab strip and one page at a time. `tabs` are TabPages.
  state Tabs {
    tabs : Array[TabPage]
    active : Int
    /// Whether the active tab's NAME is being edited, in place on the strip.
    ///
    /// Only the active one can be: ctrl/cmd-clicking a tab both selects it
    /// and starts the edit, so "which tab is being renamed" is never a
    /// second answer to "which tab is open".
    renaming : Bool
    /// The name it had when the edit started, so Escape can put it back.
    /// Typing writes straight through to the tab, because a name you cannot
    /// see change while you type it is a name you have to guess at.
    original : String
  }

  /// A leaf: a run of text.
  state Text {
    text : String
    size : String
  }

  /// A leaf: editable multi-line text. The other half of the notepad.
  state Textarea {
    text : String
    rows : Int
    placeholder : String
  }
</script>

<!-- Universal. Three things to know, none of them expressible inside a
     template.

     The `edit` view's root is a drop target for the config pill, and its
     handler forwards anything it does not recognize: `drop` is the only DOM
     event that crosses component boundaries, and dispatch stops at the first
     component with a handler for it, so claiming it here would otherwise
     swallow the shell's page-wide bundle drop.

     `pt-4` is chrome rather than layout: it reserves the band the badge and
     the × sit in. Without it they overlap whatever is held and INTERCEPT ITS
     CLICKS — a tabbed thing whose first tab cannot be selected, which is a bug
     no test on the in-memory DOM can see, because there is no layout there to
     overlap. It also keeps a nested universal's badge below its parent's
     rather than exactly on top of it.

     The two views are the two modes. `main` is what the finished thing looks
     like — no chrome, no `+`, an empty holder rendering nothing at all — and
     `edit` adds the affordances around the same child. Nothing switches
     between them here; `@push-view` at the app root does.

     And this comment is out here because a comment ANYWHERE in a view costs
     something. Before the root element it makes the view a fragment; inside
     it, it sits where the renderer's boundary meta is expected and ends the
     chain dispatch walks — which is how a click inside a held component stops
     reaching that component. -->
<template id="Universal">
  <div class="tut-universal flex items-center justify-center"><x render=".child"></x></div>
</template>

<template id="Universal:edit">
  <div class="tut-universal relative min-w-8 min-h-8 pt-5 px-1 pb-1 flex items-center justify-center rounded outline-1 outline-dashed outline-base-300"
       data-droptarget="config-pill" @on.drop="dropped e.dragInfo">
    <button class="universal-add btn btn-ghost btn-block min-h-20 text-3xl font-thin opacity-30 hover:opacity-100"
            @show="null? .child" @on.click="add e.isCtrl">+</button>
    <span class="universal-badge absolute top-0.5 left-1 z-10 badge badge-xs badge-ghost cursor-pointer"
          @hide="null? .child" @on.click="pick" @text="$label"></span>
    <button class="universal-remove absolute top-0.5 right-1 z-10 btn btn-xs btn-circle btn-ghost opacity-0 hover:opacity-100"
            @hide="null? .child" @on.click="remove">×</button>
    <x render=".child"></x>
  </div>
</template>

<!-- Stack. The insert strips are why the `edit` view wraps its children rather
     than rendering them straight: `render-each` cannot interleave anything
     between the children it produces, so each child draws its own LEADING
     strip and the container draws the single trailing one. Top, between each
     pair, and bottom — and it puts the affordance where the eye already is.

     The strips reveal on hovering THEMSELVES rather than through a `group` on
     the cell, because a group would light up a nested stack's strips whenever
     any ancestor is hovered. An 8px transparent strip is still hit-testable. -->
<template id="Stack">
  <div class="tut-stack w-full" :style="$style"><x render-each=".children"></x></div>
</template>

<template id="Stack:edit">
  <div class="tut-stack w-full" :style="$style">
    <div class="tut-cell relative" @each=".children">
      <button class="cell-before absolute z-20 rounded bg-primary opacity-0 hover:opacity-60"
              @if.style="$isRow"
              @then="'inset-block:0;inset-inline-start:-4px;inline-size:8px'"
              @else="'inset-inline:0;inset-block-start:-4px;block-size:8px'"
              @on.click="insertAt @key"></button>
      <x render-it></x>
    </div>
    <button class="cell-append rounded bg-primary opacity-0 hover:opacity-60"
            @if.style="$isRow"
            @then="'inline-size:8px;align-self:stretch'"
            @else="'block-size:8px'"
            @on.click="appendCell"></button>
  </div>
</template>

<!-- Grid. The four strips sit on the container's own edges rather than on each
     cell, because that is what "add a row or a column" means: there is one
     place to add one at each end, not one per cell. Inserting somewhere in the
     middle is what the settings panel's cols/rows are for. -->
<template id="Grid">
  <div class="tut-grid w-full" :style="$style"><x render-each=".children"></x></div>
</template>

<template id="Grid:edit">
  <div class="tut-grid w-full relative" :style="$style">
    <x render-each=".children"></x>
    <button class="col-before absolute z-20 rounded bg-primary opacity-0 hover:opacity-60"
            style="inset-block:0;inset-inline-start:-6px;inline-size:8px"
            @on.click="addColBefore"></button>
    <button class="col-after absolute z-20 rounded bg-primary opacity-0 hover:opacity-60"
            style="inset-block:0;inset-inline-end:-6px;inline-size:8px"
            @on.click="addColAfter"></button>
    <button class="row-before absolute z-20 rounded bg-primary opacity-0 hover:opacity-60"
            style="inset-inline:0;inset-block-start:-6px;block-size:8px"
            @on.click="addRowBefore"></button>
    <button class="row-after absolute z-20 rounded bg-primary opacity-0 hover:opacity-60"
            style="inset-inline:0;inset-block-end:-6px;block-size:8px"
            @on.click="addRowAfter"></button>
  </div>
</template>

<template id="TabPage">
  <div class="tut-tabpage w-full"><x render=".body"></x></div>
</template>

<template id="TabPage:tabname">
  <input class="tab-rename input input-xs w-28" autofocus :value=".label"
         @on.input="setLabel e.value"
         @on.keydown+send="doneRename" @on.keydown+cancel="cancelRename"
         @on.focusout="doneRename">
</template>

<template id="Tabs">
  <div class="tut-tabs w-full flex flex-col gap-2">
    <div role="tablist" class="tab-strip tabs tabs-box">
      <button role="tab" @each=".tabs" @enrich-with="markActive"
              @if.class="@active" @then="'tab-label tab tab-active'" @else="'tab-label tab'"
              @on.click="activate @key" @text="@value.label"></button>
    </div>
    <x render-each=".tabs" @when="isActivePage"></x>
  </div>
</template>

<template id="Tabs:edit">
  <div class="tut-tabs w-full flex flex-col gap-2">
    <div role="tablist" class="tab-strip tabs tabs-box">
      <span class="contents" @each=".tabs" @enrich-with="markActive">
        <button role="tab" @hide="@editing"
                @if.class="@active" @then="'tab-label tab tab-active'" @else="'tab-label tab'"
                @on.click="activate @key e.isCtrl" @text="@value.label"></button>
        <x render-it as="tabname" @show="@editing"></x>
      </span>
      <button class="tab-add tab" @on.click="addTab">+</button>
      <button class="tab-close tab" @hide="empty? .tabs" @on.click="closeActive">×</button>
    </div>
    <x render-each=".tabs" @when="isActivePage"></x>
  </div>
</template>

<template id="Text">
  <span class="tut-text" :style="$style" @text=".text"></span>
</template>

<template id="Textarea">
  <textarea class="tut-textarea textarea textarea-bordered w-full font-mono"
            :rows=".rows" :placeholder=".placeholder"
            :value=".text" @on.input="setText e.value"></textarea>
</template>
