<script type="tutuca/spec">
  /// One search hit. `why` is the ranking's reasons, joined — a search a
  /// person cannot explain is one they stop trusting, and that is as true of
  /// a standard component as of a loaded one.
  state PaletteRow {
    module : String
    name : String
    summary : String
    why : String
    category : String
    /// Where the keyboard is. Held per row rather than as one index on the
    /// bar so that moving the cursor touches two rows instead of redrawing
    /// the list.
    selected : Bool
  }

  handle PaletteRow {
    intent {
    /// (module, name, configure). `configure` is ctrl/cmd — "let me fill in
    /// its arguments" rather than "place it with its defaults".
    componentPicked(String, String, Bool)

    }
  }

  handle PaletteRow {
    message {
    setSelected(Bool)

    }
  }

  /// Search the catalog, over everything else on the page.
  ///
  /// It knows nothing about the catalog: it reports what was typed and gets
  /// rows back, exactly as the palette it replaces did. What is new is the
  /// cursor, because a bar you have to reach for the mouse in is a bar that
  /// is slower than the thing it replaced.
  state CommandBar {
    query : String
    hits : Array[PaletteRow]
    cursor : Int
    /// Opened by ctrl/cmd-clicking a `+`: every pick configures.
    configure : Bool
    emptyMessage : String
  }

  handle CommandBar {
    message {
    setCursor(Int)

    }
  }

  /// One control of the generated form.
  ///
  /// `kind` picks the control and comes from the field's JSON Schema type;
  /// `hint` is what the constraint says (a range, a length, a format), which
  /// is the half a type cannot state and the half a person needs to see
  /// BEFORE submitting rather than in an error afterwards.
  state SchemaField {
    name : String
    kind : String
    hint : String
    doc : String
    required : Bool
    text : String
    num : Double
    flag : Bool
    choices : Array[String]
    error : String
  }

  handle SchemaField {
    intent {
    fieldEdited(String, String)

    }
  }

  /// One of a component's named fixtures — a starting state its author
  /// thought worth offering, with the sentence that says when to prefer it.
  /// A `struct` and not a bare `Any`: the pair is a record with two known
  /// fields, and saying so is what lets the view's `@value.label` be checked.
  struct InitChoice {
    name : String
    label : String
  }

  /// A form over a component's declared arguments, generated from the JSON
  /// Schema the catalog projects. No per-component code, and no branch on
  /// where the component came from: the same projection an agent's tool
  /// reads is the one this draws, for a guest and for a standard component
  /// alike.
  state SchemaForm {
    module : String
    name : String
    title : String
    doc : String
    fields : Array[SchemaField]
    inits : Array[InitChoice]
    error : String
    /// What the button says. "Place" when this is filling an empty cell,
    /// "Apply" when it is reconfiguring something already there.
    submitLabel : String
  }

  handle SchemaForm {
    message {
    showErrors(Map[String, String])

    }
  }

  /// The sidebar: what the thing you pointed at can be configured with.
  ///
  /// Two modes, and the choice between them is made where the instance is:
  /// a component that declares a `config` view of its own gets it rendered
  /// live, and everything else gets the form generated from its declared
  /// arguments. `mode` is what the templates switch on, because a null
  /// field renders as nothing and two nulls would be two ways to say
  /// "not this one".
  state ConfigPanel {
    title : String
    /// "view" | "form"
    mode : String
    /// The live instance, when it renders its own config view. It is MOVED
    /// here rather than copied: an instance rendered in two places has one
    /// of them holding a dead handle after the first interaction.
    target : Component
    form : Component
  }

  handle ConfigPanel {
    intent {
    closeConfig

    }
  }

  /// The universal app: a bar, a root, and whatever chrome is open.
  ///
  /// The root is ONE component and starts as a universal, so the first thing
  /// a person does is choose what the page is. Everything after that is the
  /// same gesture one level in.
  ///
  /// There is no document beside the tree. What is on screen IS the state,
  /// and `mode` is pushed down with `@push-view` so a component that has an
  /// `edit` view shows its affordances and one that does not — every guest —
  /// is simply itself.
  state UniversalApp {
    /// The universal component, from `dyncomp/ui/std`. Named rather than
    /// declared, because it lives in another module and this file cannot see
    /// it — `Component[X]` resolves through the registration scope at make
    /// time, which is the only place the name means anything.
    root : Component[Universal]
    /// "edit" | "main"
    mode : String
    commandBar : Component
    configPanel : Component
    status : String
    /// Whatever the HOST wants in the bar — loading bundles, in the wasm
    /// shell's case. Null in every test and in any host that needs none.
    ///
    /// A component rather than a list of buttons, because this package is
    /// backend-agnostic and the things a host offers are exactly the things
    /// it cannot be: fetching an archive, reading a dropped file. The app
    /// gives it a place to stand and forwards what lands on the page.
    devTools : Component
  }

  handle UniversalApp {
    message {
    /// A bundle loaded: the catalog changed, so a bar showing results has to
    /// say so.
    catalogChanged(String)
    /// A whole tree, from wherever the shell keeps them.
    restoreTree(Any)

    }
  }
</script>

<!-- PaletteRow. `selected` is a field rather than a comparison against an
     index on the bar, so moving the cursor sends two messages instead of
     rebuilding every row. -->
<template id="PaletteRow">
  <li @if.class=".selected"
      @then="'palette-row row-selected flex flex-col gap-0.5 px-2 py-1 rounded cursor-pointer bg-base-300'"
      @else="'palette-row flex flex-col gap-0.5 px-2 py-1 rounded cursor-pointer hover:bg-base-200'"
      @on.click="pick e.isCtrl">
    <div class="flex items-baseline gap-2">
      <span class="font-mono text-sm row-name" @text=".name"></span>
      <span class="text-[0.65rem] opacity-50 row-module" @text=".module"></span>
      <span class="badge badge-xs badge-ghost row-category" @text=".category"></span>
    </div>
    <div class="text-xs opacity-70 row-summary" @text=".summary"></div>
    <div class="text-[0.65rem] opacity-40 row-why" @text=".why"></div>
  </li>
</template>

<!-- CommandBar. One `@on.keydown` handler rather than four modified ones,
     because a bare handler beside a modified one fires for every key and the
     bar would answer Escape by also answering nothing. The name is decoded in
     MoonBit, where a `match` over four strings is total and legible. -->
<template id="CommandBar">
  <div class="command-overlay fixed inset-0 z-50 flex items-start justify-center pt-24 bg-base-300/60"
       @on.click="close">
    <div class="command-bar w-[36rem] max-w-[90vw] rounded-lg border border-base-300 bg-base-100 shadow-xl flex flex-col gap-2 p-3">
      <input type="search" autofocus class="input input-sm input-bordered command-input"
             placeholder="search components…" :value=".query"
             @on.input="setQuery e.value" @on.keydown="nav e.key">
      <p class="text-[0.65rem] opacity-50 command-hint" @show=".configure">
        ctrl/cmd — the one you pick will ask for its arguments
      </p>
      <ul class="flex flex-col gap-1 max-h-96 overflow-y-auto command-hits">
        <x render-each=".hits"></x>
      </ul>
      <p class="text-xs opacity-50 italic command-empty"
         @show="empty? .hits" @text=".emptyMessage"></p>
    </div>
  </div>
</template>

<template id="SchemaField">
  <label class="schema-field flex flex-col gap-0.5">
    <span class="flex items-baseline gap-2">
      <span class="font-mono text-xs field-name" @text=".name"></span>
      <span class="text-error text-xs field-required" @show=".required">*</span>
      <span class="text-[0.65rem] opacity-40 field-hint" @text=".hint"></span>
    </span>
    <span class="text-[0.65rem] opacity-60 field-doc" @show="truthy? .doc" @text=".doc"></span>

    <input @show=".kind is 'bool'"
           type="checkbox" class="checkbox checkbox-xs field-bool"
           :checked=".flag" @on.input="edit e.value">
    <input @show=".kind is 'number'"
           type="number" class="input input-xs input-bordered field-number"
           :value=".num" @on.input="edit e.value">
    <input @show=".kind is 'string'"
           type="text" class="input input-xs input-bordered field-string"
           :value=".text" @on.input="edit e.value">
    <select @show=".kind is 'enum'"
            class="select select-xs select-bordered field-enum"
            :value=".text" @on.input="edit e.value">
      <option @each=".choices" :value="@value" @text="@value"></option>
    </select>
    <!-- A compound the vocabulary has no control for is edited as JSON. That
         is honest rather than lazy: a list-of-records editor is a real feature
         and drawing three text boxes would be pretending to be one. -->
    <textarea @show=".kind is 'json'"
              class="textarea textarea-xs textarea-bordered font-mono field-json"
              rows="2" :value=".text" @on.input="edit e.value"></textarea>

    <span class="text-error text-[0.65rem] field-error" @show="truthy? .error" @text=".error"></span>
  </label>
</template>

<template id="SchemaForm">
  <div class="schema-form flex flex-col gap-2">
    <div class="font-mono text-sm font-semibold form-title" @text=".title"></div>
    <p class="text-xs opacity-70 form-doc" @show="truthy? .doc" @text=".doc"></p>
    <!-- A component's named fixtures, offered beside the bare constructor: it
         said when to prefer each one, so the form says so too. -->
    <div class="flex gap-1 flex-wrap form-inits" @hide="empty? .inits">
      <button class="btn btn-xs btn-outline form-init" @each=".inits"
              @on.click="useInit @value.name" @text="@value.label"></button>
    </div>
    <x render-each=".fields"></x>
    <p class="text-error text-xs form-error" @show="truthy? .error" @text=".error"></p>
    <div class="flex gap-2">
      <button class="btn btn-sm btn-primary form-create" @on.click="create" @text=".submitLabel"></button>
      <button class="btn btn-sm btn-ghost form-cancel" @on.click="cancel">Cancel</button>
    </div>
  </div>
</template>

<!-- ConfigPanel. The root hosts a placed component in `view` mode, so no
     comment may sit inside it: a comment where the renderer expects its
     boundary meta ends the chain dispatch walks, and a click inside the config
     view would stop reaching the component drawing it. -->
<template id="ConfigPanel">
  <aside class="config-panel w-80 shrink-0 border-l border-base-300 bg-base-100 p-3 flex flex-col gap-2 overflow-y-auto">
    <div class="flex items-center gap-2">
      <span class="font-mono text-sm grow config-title" @text=".title"></span>
      <button class="btn btn-xs btn-circle btn-ghost config-close" @on.click="close">×</button>
    </div>
    <p class="text-[0.65rem] opacity-50 italic config-moved" @show=".mode is 'view'">
      It is being configured here, so the page shows a placeholder until you close this.
    </p>
    <x render=".target" as="config"></x>
    <x render=".form"></x>
  </aside>
</template>

<!-- UniversalApp. The whole viewport is the app: a slim bar for the things
     that are convenience during development, the root component, and whatever
     chrome is open beside and over it.

     `@push-view=".mode"` is what makes edit mode a mode. Every component under
     it that HAS an `edit` view draws its affordances; every component that
     does not — which is every guest, and every leaf here — is simply itself.
     No boolean is threaded anywhere, and nothing had to opt in. -->
<template id="UniversalApp">
  <div class="universal-app min-h-screen flex flex-col bg-base-200 text-base-content"
       data-droptarget="tutuca-host-drop" @on.drop="filesDropped e.value">
    <header class="app-bar flex items-center gap-2 px-3 py-1 border-b border-base-300 bg-base-100">
      <span class="config-pill badge badge-sm badge-outline cursor-grab select-none"
            draggable="true" data-dragtype="config-pill">config</span>
      <button class="btn btn-xs open-command" @on.click="openCommand">+ add…</button>
      <button class="btn btn-xs btn-ghost toggle-mode" @on.click="toggleMode" @text="$modeLabel"></button>
      <x render=".devTools"></x>
      <span class="text-sm opacity-70 grow app-status" @text=".status"></span>
    </header>
    <div class="flex grow min-h-0">
      <div class="grow app-canvas overflow-auto p-4" @push-view=".mode">
        <x render=".root"></x>
      </div>
      <x render=".configPanel"></x>
    </div>
    <x render=".commandBar"></x>
  </div>
</template>
