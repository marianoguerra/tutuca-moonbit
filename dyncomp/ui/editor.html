<script type="tutuca/state">
  interface surface-node {
    /// One node of the rendered surface. It holds no layout DECISIONS — the
    /// document does, and `style` is what the builder computed from it — so a
    /// node is a projection and never a second source of truth.
    ///
    /// `slot` is the live component instance a Slot node holds. It is the one
    /// thing the document cannot carry (a document holds a reference; the host
    /// builds the instance), which is why the builder threads it through.
    record state {
      node-id: string,
      kind: string,
      style: string,
      label: string,
      children: values,
      slot: component,
      selected: bool,
      /// A slot with nothing in it. ONE field rather than `@show=".isSlot"`
      /// plus `@hide="null? .slot"`: two wrappers on one element read as
      /// independent conditions, and the placeholder needs their conjunction.
      empty: bool,
    }
    variant bubble {
      /// A node was clicked. Travels to the editor, which owns selection.
      node-picked(string),
    }
  }

  interface node-settings {
    /// The selected node's container settings. Every field is a control over
    /// one layout property, and every edit leaves as a bubble — the settings
    /// panel edits nothing, because the document is the editor's.
    record state {
      node-id: string,
      kind: string,
      direction: string,
      justify: string,
      align: string,
      gap: s32,
      padding: s32,
      wrap: bool,
      columns: string,
      col-span: s32,
      row-span: s32,
      is-container: bool,
      is-grid: bool,
    }
    variant bubble {
      /// (property name, value as text). One case rather than fourteen: the
      /// editor decodes against the layout vocabulary, which is the only place
      /// that knows it.
      prop-changed(tuple<string, string>),
    }
  }

  interface palette-row {
    /// One search hit. `why` is the ranking's reasons, joined — a search a
    /// person cannot explain is one they stop trusting.
    record state {
      module: string,
      name: string,
      summary: string,
      why: string,
      category: string,
    }
    variant bubble {
      component-picked(tuple<string, string>),
    }
  }

  interface component-palette {
    /// Search over the catalog. `query` is what was typed and `hits` are
    /// PaletteRow instances; the editor re-runs the search on every keystroke,
    /// because a catalog is small and a debounce would be latency nobody
    /// needed.
    record state {
      query: string,
      hits: values,
      empty-message: string,
    }
  }

  interface schema-field {
    /// One control of the generated form.
    ///
    /// `kind` picks the control and comes from the field's JSON Schema type;
    /// `hint` is what the constraint says (a range, a length, a format), which
    /// is the half a type cannot state and the half a person needs to see
    /// BEFORE submitting rather than in an error afterwards.
    record state {
      name: string,
      kind: string,
      hint: string,
      doc: string,
      required: bool,
      text: string,
      num: f64,
      flag: bool,
      choices: values,
      error: string,
    }
    variant bubble {
      field-edited(tuple<string, string>),
    }
  }

  interface schema-form {
    /// A form over a component's declared arguments, generated from the JSON
    /// Schema the catalog projects. No per-component code: the same projection
    /// an agent's tool reads is the one this draws.
    record state {
      module: string,
      name: string,
      title: string,
      doc: string,
      fields: values,
      inits: values,
      error: string,
    }
    variant receive {
      /// Per-field validation failures from the last submit, as a JSON object
      /// of pointer -> message.
      show-errors(any),
    }
  }

  interface surface-editor {
    /// The universal UI.
    ///
    /// `doc` is the surface document (the same JSON an agent reads back and a
    /// person exports) and is the SOURCE OF TRUTH; `tree` is what the document
    /// renders to, rebuilt after every edit. Keeping the document primary is
    /// what makes the human layer and the agent layer the same system: both
    /// produce ops, both read this document back.
    record state {
      doc: any,
      tree: component,
      slots: any,
      selected: string,
      palette: component,
      settings: component,
      form: component,
      status: string,
      transfer: string,
      show-transfer: bool,
    }
    variant receive {
      /// A bundle loaded: the catalog changed, so a palette showing results
      /// has to say so.
      catalog-changed(string),
    }
  }
</script>

<template id="SurfaceNode">
  <div class="tut-node relative" :style=".style"
       @if.class=".selected" @then="outline outline-2 outline-primary" @else="">
    <!-- A container renders its children; the click that selects it is on the
         chrome badge rather than the box, so selecting a parent does not mean
         missing every child. -->
    <span class="node-badge absolute -top-2 -left-1 z-10 badge badge-xs cursor-pointer"
          @if.class=".selected" @then="badge-primary" @else="badge-ghost"
          @on.click="pick" @text=".label"></span>
    <x render-each=".children"></x>
    <!-- A slot either holds a component or says it is waiting for one. -->
    <div class="node-empty text-xs opacity-40 italic border border-dashed rounded p-4"
         @show=".empty">empty slot</div>
    <x render=".slot"></x>
  </div>
</template>

<template id="NodeSettings">
  <div class="node-settings flex flex-col gap-2 p-2">
    <div class="text-xs font-mono opacity-60">
      <span class="settings-id" @text=".nodeId"></span>
      <span class="settings-kind" @text=".kind"></span>
    </div>

    <label class="flex items-center gap-2 text-xs" @show=".isContainer">
      <span class="w-20 shrink-0 opacity-70">direction</span>
      <select class="select select-xs select-bordered set-direction" @on.input="setDirection value">
        <option value="column">column</option>
        <option value="row">row</option>
        <option value="column-reverse">column-reverse</option>
        <option value="row-reverse">row-reverse</option>
      </select>
    </label>

    <label class="flex items-center gap-2 text-xs" @show=".isContainer">
      <span class="w-20 shrink-0 opacity-70">justify</span>
      <select class="select select-xs select-bordered set-justify" @on.input="setJustify value">
        <option value="start">start</option>
        <option value="center">center</option>
        <option value="end">end</option>
        <option value="space-between">space-between</option>
        <option value="space-around">space-around</option>
        <option value="space-evenly">space-evenly</option>
      </select>
    </label>

    <label class="flex items-center gap-2 text-xs" @show=".isContainer">
      <span class="w-20 shrink-0 opacity-70">align</span>
      <select class="select select-xs select-bordered set-align" @on.input="setAlign value">
        <option value="stretch">stretch</option>
        <option value="start">start</option>
        <option value="center">center</option>
        <option value="end">end</option>
        <option value="baseline">baseline</option>
      </select>
    </label>

    <!-- The grid's track list, typed as the document spells it: `1fr 240px
         auto`. Three shapes and no CSS lengths, so what can be typed is what
         can be rendered. -->
    <label class="flex items-center gap-2 text-xs" @show=".isGrid">
      <span class="w-20 shrink-0 opacity-70">columns</span>
      <input type="text" class="input input-xs input-bordered w-48 set-columns"
             placeholder="1fr 2fr" :value=".columns" @on.input="setColumns value">
    </label>

    <label class="flex items-center gap-2 text-xs" @show=".isContainer">
      <span class="w-20 shrink-0 opacity-70">gap</span>
      <input type="number" class="input input-xs input-bordered w-24 set-gap"
             :value=".gap" @on.input="setGap value">
    </label>

    <label class="flex items-center gap-2 text-xs">
      <span class="w-20 shrink-0 opacity-70">padding</span>
      <input type="number" class="input input-xs input-bordered w-24 set-padding"
             :value=".padding" @on.input="setPadding value">
    </label>

    <label class="flex items-center gap-2 text-xs" @show=".isContainer">
      <span class="w-20 shrink-0 opacity-70">wrap</span>
      <input type="checkbox" class="checkbox checkbox-xs set-wrap"
             :checked=".wrap" @on.input="setWrap value">
    </label>

    <div class="flex items-center gap-2 text-xs">
      <span class="w-20 shrink-0 opacity-70">span</span>
      <input type="number" class="input input-xs input-bordered w-16 set-colspan"
             :value=".colSpan" @on.input="setColSpan value">
      <span class="opacity-40">×</span>
      <input type="number" class="input input-xs input-bordered w-16 set-rowspan"
             :value=".rowSpan" @on.input="setRowSpan value">
    </div>
  </div>
</template>

<template id="PaletteRow">
  <li class="palette-row flex flex-col gap-0.5 px-2 py-1 rounded cursor-pointer hover:bg-base-200"
      @on.click="pick">
    <div class="flex items-baseline gap-2">
      <span class="font-mono text-sm row-name" @text=".name"></span>
      <span class="text-[0.65rem] opacity-50 row-module" @text=".module"></span>
      <span class="badge badge-xs badge-ghost row-category" @text=".category"></span>
    </div>
    <div class="text-xs opacity-70 row-summary" @text=".summary"></div>
    <div class="text-[0.65rem] opacity-40 row-why" @text=".why"></div>
  </li>
</template>

<template id="ComponentPalette">
  <div class="component-palette flex flex-col gap-2">
    <input type="search" class="input input-sm input-bordered palette-search"
           placeholder="search components…" :value=".query" @on.input="setQuery value">
    <ul class="flex flex-col gap-1 max-h-96 overflow-y-auto palette-hits">
      <x render-each=".hits"></x>
    </ul>
    <p class="text-xs opacity-50 italic palette-empty" @show="empty? .hits" @text=".emptyMessage"></p>
  </div>
</template>

<template id="SchemaField">
  <label class="schema-field flex flex-col gap-0.5">
    <span class="flex items-baseline gap-2">
      <span class="font-mono text-xs field-name" @text=".name"></span>
      <span class="text-error text-xs field-required" @show=".required">*</span>
      <span class="text-[0.65rem] opacity-40 field-hint" @text=".hint"></span>
    </span>
    <span class="text-[0.65rem] opacity-60 field-doc" @show="truthy? .doc" @text=".doc"></span>

    <input @show="equals? .kind 'bool'"
           type="checkbox" class="checkbox checkbox-xs field-bool"
           :checked=".flag" @on.input="edit value">
    <input @show="equals? .kind 'number'"
           type="number" class="input input-xs input-bordered field-number"
           :value=".num" @on.input="edit value">
    <input @show="equals? .kind 'string'"
           type="text" class="input input-xs input-bordered field-string"
           :value=".text" @on.input="edit value">
    <select @show="equals? .kind 'enum'"
            class="select select-xs select-bordered field-enum" @on.input="edit value">
      <option @each=".choices" :value="@value" @text="@value"></option>
    </select>
    <!-- A compound the vocabulary has no control for is edited as JSON. That
         is honest rather than lazy: a list-of-records editor is a real feature
         and drawing three text boxes would be pretending to be one. -->
    <textarea @show="equals? .kind 'json'"
              class="textarea textarea-xs textarea-bordered font-mono field-json"
              rows="2" :value=".text" @on.input="edit value"></textarea>

    <span class="text-error text-[0.65rem] field-error" @show="truthy? .error" @text=".error"></span>
  </label>
</template>

<template id="SchemaForm">
  <div class="schema-form flex flex-col gap-2 p-2">
    <div class="font-mono text-sm font-semibold form-title" @text=".title"></div>
    <p class="text-xs opacity-70 form-doc" @show="truthy? .doc" @text=".doc"></p>
    <!-- A component's named fixtures, offered beside the bare constructor: the
         guest said when to prefer each one, so the form says so too. -->
    <div class="flex gap-1 flex-wrap form-inits" @hide="empty? .inits">
      <button class="btn btn-xs btn-outline form-init" @each=".inits"
              @on.click="useInit @value.name" @text="@value.label"></button>
    </div>
    <x render-each=".fields"></x>
    <p class="text-error text-xs form-error" @show="truthy? .error" @text=".error"></p>
    <div class="flex gap-2">
      <button class="btn btn-sm btn-primary form-create" @on.click="create">Place</button>
      <button class="btn btn-sm btn-ghost form-cancel" @on.click="cancel">Cancel</button>
    </div>
  </div>
</template>

<template id="SurfaceEditor">
  <div class="surface-editor flex gap-4 items-start">
    <div class="flex flex-col gap-2 w-72 shrink-0 editor-side">
      <div class="flex gap-1 flex-wrap editor-add">
        <button class="btn btn-xs add-stack" @on.click="addStack">+ stack</button>
        <button class="btn btn-xs add-grid" @on.click="addGrid">+ grid</button>
        <button class="btn btn-xs add-box" @on.click="addBox">+ box</button>
        <button class="btn btn-xs add-slot" @on.click="addSlot">+ slot</button>
        <button class="btn btn-xs btn-error btn-outline remove-node" @on.click="removeNode">remove</button>
      </div>
      <x render=".settings"></x>
      <x render=".palette"></x>
      <x render=".form"></x>
      <div class="flex gap-1">
        <button class="btn btn-xs btn-ghost do-export" @on.click="exportDoc">export</button>
        <button class="btn btn-xs btn-ghost do-import" @on.click="importDoc">import</button>
      </div>
      <!-- Always visible: pasting a document to import should not require
           exporting one first, and an empty box is its own invitation. -->
      <textarea class="textarea textarea-xs textarea-bordered font-mono editor-transfer"
                rows="6" placeholder="paste a surface document to import…"
                :value=".transfer" @on.input="setTransfer value"></textarea>
      <p class="text-xs opacity-70 editor-status" @text=".status"></p>
    </div>
    <div class="grow editor-canvas border border-dashed border-base-300 rounded p-4 min-h-48">
      <x render=".tree"></x>
    </div>
  </div>
</template>
