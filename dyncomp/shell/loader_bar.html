<script type="tutuca/spec">
  /// One bundle a page offers to load by URL: what to call it, and where it
  /// is. A HOST supplies these; nothing here knows any bundle's name.
  struct Sample {
    label : String
    url : String
  }

  /// Where a bundle comes from: a button, a URL box, or a file dropped on the
  /// page. Every wasm-gc page that hosts bundles needs this and none of them
  /// need a different one, which is why it stopped being two.
  ///
  /// It sits INSIDE a page's own bar rather than around it, because the whole
  /// viewport belongs to the page. What it cannot decide is what a load MEANS
  /// — the universal host counts it against a session being restored, the
  /// storybook rebuilds its story set — so it reports through `notify` and
  /// bubbles `catalog-changed`, and the page decides.
  state {
    status : String
    /// What is in the URL box. Kept as state rather than read off the DOM, so
    /// pressing Enter and pressing the button are one handler.
    url : String
    /// Whether to draw the URL box at all. A page that only offers its own
    /// bundles has no use for it.
    showUrl : Bool
    /// The bundles to offer, as buttons. Empty is the ordinary case and draws
    /// nothing: a first-time visitor should not meet a row of buttons naming
    /// archives they have never heard of.
    samples : Array[Sample]
  }

  handle {
    message {
    /// Files the page forwarded — dropped anywhere on it, or on a cell that
    /// handed back what was not its.
    filesDropped(Any)
    /// The bridge's own answers, routed here because this is the path that
    /// asked for the load. The second argument is the load id the load
    /// answered with: success already names its module, but a failure has only
    /// a reason, and the bar loads on behalf of whoever asked.
    dyncompLoaded(String, Int)
    dyncompError(String, Int)

    }
  }

  handle {
    intent {
    /// The catalog changed. Whatever is above re-reads it — a bar showing
    /// search results, or a gallery showing every configuration — rather than
    /// telling a person to ask again.
    catalogChanged(String)

    }
  }
</script>

<!-- Loading a bundle that is already registered HOT-SWAPS it, and the catalog
     answers with the new components immediately. That makes this the fastest
     loop there is for working on a bundle: rebuild the archive, press load.

     Dropping one is never gated, and the whole viewport stays a drop target
     whether or not any samples are offered. -->
<template id="LoaderBar">
  <span class="loader-bar flex items-center gap-2">
    <span class="join" @hide="empty? .samples">
      <button class="btn btn-xs join-item load-sample" @each=".samples"
              @on.click="loadSample @value.url" @text="@value.label"></button>
    </span>
    <span class="join" @show=".showUrl">
      <input class="input input-xs input-bordered join-item bar-url"
             placeholder="…/name.tutuca.tar.gz" :value=".url"
             @on.input="typeUrl e.value" @on.keydown+send="loadUrl">
      <button class="btn btn-xs join-item load-url" @on.click="loadUrl">load</button>
    </span>
    <span class="text-xs opacity-60 bar-status" @text=".status"></span>
  </span>
</template>
