<script type="tutuca/spec">
  state JsonNull {
  }

  state JsonBoolean {
    value : Bool
  }

  state JsonNumber {
    value : Double
  }

  state JsonString {
    value : String
  }

  state ValueFn {
  }

  state ValueObj {
    text : String
  }

  state JsonArray {
    items : Array[Component]
    isExpanded : Bool
    itemsPerPage : Int
    currentPage : Int

    /// A page is a window onto `items`, and both numbers that place it are
    /// counts. A size of zero divides the list into no pages at all and the
    /// pager silently shows nothing; the ceiling keeps a generated
    /// `setItemsPerPage` from asking for a page nothing could paint.
    where itemsPerPage between 1 and 500
    where currentPage >= 0

    /// Where the window actually falls. `itemsPerPage` is at least 1 by the
    /// clause above, so the multiplication is safe wherever this is asked —
    /// and page 0 is legal over an empty list, which is what the first
    /// disjunct is for.
    invariant pageExists
      format $'page {.currentPage} is past the end of {len .items} items' {
        (.currentPage is 0) or ((.currentPage * .itemsPerPage) < (len .items))
      }
  }

  state JsonObject {
    items : Array[JsonProperty]
    isExpanded : Bool
    itemsPerPage : Int
    currentPage : Int

    /// A page is a window onto `items`, and both numbers that place it are
    /// counts. A size of zero divides the list into no pages at all and the
    /// pager silently shows nothing; the ceiling keeps a generated
    /// `setItemsPerPage` from asking for a page nothing could paint.
    where itemsPerPage between 1 and 500
    where currentPage >= 0

    /// Where the window actually falls. `itemsPerPage` is at least 1 by the
    /// clause above, so the multiplication is safe wherever this is asked —
    /// and page 0 is legal over an empty list, which is what the first
    /// disjunct is for.
    invariant pageExists
      format $'page {.currentPage} is past the end of {len .items} items' {
        (.currentPage is 0) or ((.currentPage * .itemsPerPage) < (len .items))
      }
  }

  state JsonProperty {
    key : String
    child : Instance
  }

  state DataInspector {
    value : Instance
  }
</script>

<template id="JsonNull">
  <span class="font-mono text-sm leading-tight text-warning italic json-null">null</span>
</template>

<template id="JsonBoolean">
  <span :class="$cssClass" @text="$text"></span>
</template>

<template id="JsonBoolean:_margauiClasses">
  <p class="text-success text-warning"></p>
</template>

<template id="JsonNumber">
  <span class="font-mono text-sm leading-tight text-info json-number" @text="$text"></span>
</template>

<template id="JsonString">
  <span class="font-mono text-sm leading-tight inline-block max-w-xs truncate align-bottom json-string" :title=".value" @text="$text"></span>
</template>

<template id="ValueFn">
  <span class="font-mono text-sm leading-tight text-base-content/40 value-fn">function () &#123; … &#125;</span>
</template>

<template id="ValueObj">
  <span class="font-mono text-sm leading-tight inline-block max-w-xs truncate align-bottom text-info value-obj" :title=".text" @text=".text"></span>
</template>

<template id="JsonArray">
  <span class="font-mono text-sm leading-tight inline-block">
    <span class="inline-flex items-center gap-2">
      <button
        type="button"
        class="cursor-pointer text-base-content/70 hover:text-base-content inline-flex items-center gap-1"
        :disabled="$isItemsEmpty"
        @on.click=".isExpanded = not .isExpanded">
        <span @text="$arrowText"></span>
        <span class="json-array" @text="$typeText"></span>
        <span @text="$countText"></span>
      </button>
      <div @show="$showPagination" class="join">
        <button type="button" class="join-item btn btn-xs pg-prev" :disabled="$cannotPrevPage" @on.click="prevPage">«</button>
        <span class="join-item badge font-mono text-xs pg-label" @text="$pageIndicatorText"></span>
        <button type="button" class="join-item btn btn-xs pg-next" :disabled="$cannotNextPage" @on.click="nextPage">»</button>
      </div>
    </span>
    <div @show=".isExpanded" class="ml-1 flex flex-col gap-0.5 border-l border-base-content/10 pl-2 mt-0.5">
      <x render-each=".items" @loop-with="getPageRange"></x>
    </div>
  </span>
</template>

<template id="JsonObject">
  <span class="font-mono text-sm leading-tight inline-block">
    <span class="inline-flex items-center gap-2">
      <button
        type="button"
        class="cursor-pointer text-base-content/70 hover:text-base-content inline-flex items-center gap-1"
        :disabled="$isItemsEmpty"
        @on.click=".isExpanded = not .isExpanded">
        <span @text="$arrowText"></span>
        <span class="json-object" @text="$typeText"></span>
        <span @text="$countText"></span>
      </button>
      <div @show="$showPagination" class="join">
        <button type="button" class="join-item btn btn-xs pg-prev" :disabled="$cannotPrevPage" @on.click="prevPage">«</button>
        <span class="join-item badge font-mono text-xs pg-label" @text="$pageIndicatorText"></span>
        <button type="button" class="join-item btn btn-xs pg-next" :disabled="$cannotNextPage" @on.click="nextPage">»</button>
      </div>
    </span>
    <div @show=".isExpanded" class="ml-1 flex flex-col gap-0.5 border-l border-base-content/10 pl-2 mt-0.5">
      <x render-each=".items" @loop-with="getPageRange"></x>
    </div>
  </span>
</template>

<template id="JsonProperty">
  <div class="flex items-center gap-2 leading-tight json-property">
    <span class="text-base-content/60 font-mono text-sm" @text=".key"></span>
    <span class="text-base-content/30">:</span>
    <x render=".child"></x>
  </div>
</template>

<template id="DataInspector">
  <span class="contents"><x render=".value"></x></span>
</template>
