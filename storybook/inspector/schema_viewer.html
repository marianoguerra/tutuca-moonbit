<script type="tutuca/spec">
  state {
    value : Any
    raw : Any
    rawSchema : Any
    showRaw : Bool

    /// The raw pane has something behind it whenever it is showing. `raw` is
    /// the JSON the viewer switches to, and toggling onto an empty one is a
    /// blank panel with no way back but the toggle.
    invariant rawPaneHasSomethingInIt
      format 'the raw pane is showing and there is nothing behind it' {
        .showRaw implies (not (null? .raw))
      }
  }
</script>

<template>
  <div class="inline-flex flex-col items-start gap-1 schema-viewer">
    <button type="button" class="btn btn-xs btn-ghost self-end raw-toggle" @on.click=".showRaw = not .showRaw" @text="$toggleLabel"></button>
    <x render=".value" @hide=".showRaw"></x>
    <x render=".raw" @show=".showRaw"></x>
  </div>
</template>
