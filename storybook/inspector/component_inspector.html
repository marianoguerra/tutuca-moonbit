<script type="tutuca/spec">
  state CompName {
    name : String

    where name is nonempty
  }

  state CompField {
    name : String
    typeName : String
    child : Component

    /// A declared field is a name and a type. Both come off the schema, so
    /// a row missing either is a projection that lost something.
    where name is nonempty
    where typeName is nonempty
  }

  state CompView {
    name : String
    rawView : String
    isExpanded : Bool

    /// Every view a component registers is registered under a name — `main`
    /// when nothing else — and the expander's header reads it.
    where name is nonempty
  }

  state CompSection {
    items : Array[Component]
    isExpanded : Bool
    itemsPerPage : Int
    currentPage : Int
    label : String

    /// A page is a window onto `items`, and both numbers that place it are
    /// counts. A size of zero divides the list into no pages at all and the
    /// pager silently shows nothing; the ceiling keeps a generated
    /// `setItemsPerPage` from asking for a page nothing could paint.
    where itemsPerPage between 1 and 500
    where currentPage >= 0

    /// Where the window actually falls. `itemsPerPage` is at least 1 by the
    /// clause above, so the multiplication is safe wherever this is asked —
    /// and page 0 is legal over an empty list, which is what the first
    /// disjunct is for.
    invariant pageExists
      format $'page {.currentPage} is past the end of {len .items} items' {
        (.currentPage is 0) or ((.currentPage * .itemsPerPage) < (len .items))
      }
  }

  state ComponentInspector {
    compName : String
    compId : Int
    sections : Array[CompSection]

    /// A component's registration id, handed out in order from zero.
    where compId >= 0
    where compName is nonempty
  }

  /// Raised by a CompSection / CompView on a ctrl-click, so it arrives here
  /// as a Bubble. No view of this component declares it.
  handle ComponentInspector {
    intent {
    toggleAllSections(Bool)
    toggleAllViews(Bool)

    }
  }
</script>

<template id="CompName">
  <span class="font-mono text-sm leading-tight badge badge-sm badge-ghost comp-name" @text=".name"></span>
</template>

<template id="CompField">
  <div class="flex items-center gap-2 leading-tight comp-field">
    <span class="text-base-content/70 font-mono text-sm" @text=".name"></span>
    <span class="text-base-content/30">:</span>
    <span class="text-base-content/50 font-mono text-xs" @text=".typeName"></span>
    <span class="text-base-content/30">=</span>
    <x render=".child"></x>
  </div>
</template>

<template id="CompView">
  <div class="flex flex-col gap-0.5 leading-tight comp-view">
    <button
      type="button"
      class="cursor-pointer text-base-content/70 hover:text-base-content inline-flex items-center gap-1 self-start"
      @on.click="toggle e.isCtrl">
      <span @text="$arrowText"></span>
      <span class="font-mono text-sm comp-view-name" @text=".name"></span>
    </button>
    <div @show=".isExpanded">
      <pre @show="truthy? .rawView" class="text-xs bg-base-200 rounded p-2 overflow-x-auto whitespace-pre-wrap"><code @text=".rawView"></code></pre>
      <div @hide="truthy? .rawView" class="text-xs text-base-content/40 italic px-2 comp-view-aot">compiled ahead of time — the source is in the view file</div>
    </div>
  </div>
</template>

<template id="CompSection">
  <span class="font-mono text-sm leading-tight inline-block">
    <span class="inline-flex items-center gap-2">
      <button
        type="button"
        class="cursor-pointer text-base-content/70 hover:text-base-content inline-flex items-center gap-1"
        :disabled="$isItemsEmpty"
        @on.click="toggle e.isCtrl">
        <span @text="$arrowText"></span>
        <span class="font-semibold comp-section" @text="$typeText"></span>
        <span @text="$countText"></span>
      </button>
      <div @show="$showPagination" class="join">
        <button type="button" class="join-item btn btn-xs pg-prev" :disabled="$cannotPrevPage" @on.click="prevPage">«</button>
        <span class="join-item badge font-mono text-xs pg-label" @text="$pageIndicatorText"></span>
        <button type="button" class="join-item btn btn-xs pg-next" :disabled="$cannotNextPage" @on.click="nextPage">»</button>
      </div>
    </span>
    <div @show=".isExpanded" class="ml-1 flex flex-col gap-0.5 border-l border-base-content/15 pl-2 mt-0.5">
      <x render-each=".items" @loop-with="getPageRange"></x>
    </div>
  </span>
</template>

<template id="ComponentInspector">
  <div class="font-mono text-sm leading-tight flex flex-col gap-1 component-inspector">
    <div class="inline-flex items-center gap-2">
      <span class="font-semibold comp-title" @text=".compName"></span>
      <span class="text-base-content/40 text-xs" @text="$idText"></span>
    </div>
    <x render-each=".sections"></x>
  </div>
</template>
