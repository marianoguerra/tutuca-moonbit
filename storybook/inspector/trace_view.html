<script type="tutuca/spec">
  /// One line of a recording.
  ///
  /// Flat, and deliberately so: everything here was decided when the trace was
  /// written, and a row that recomputed any of it would be a second opinion
  /// about what happened. `verb` is the word, `input` is the line between what
  /// happened TO the app and what the app did about it, and `depth` is the
  /// causal nesting the `parent` links already describe.
  state TraceRow {
    seq : Int
    turn : Int
    walk : Int
    hasWalk : Bool
    verb : String
    /// The badge's WHOLE class list, colour and all.
    ///
    /// Whole because `:class` replaces the static `class` rather than adding
    /// to it, so a computed class and a written one cannot both be on the same
    /// element — and on the row rather than in the template because it is a
    /// four-way dispatch on a value the builder already has in hand.
    verbClass : String
    name : String
    place : String
    args : String
    input : Bool
    /// The row's whole class list, its border decided by whether a rerun feeds
    /// it. Whole for the same reason `verbClass` is: a computed `:class`
    /// replaces the written one.
    rowClass : String
    depth : Int
    /// Set for the row a viewer is parked on, so a step slider has something
    /// to point at.
    current : Bool
    /// The state the handler produced, prebuilt as a value inspector, or Null
    /// when the recording did not keep one.
    after : Component?
    hasAfter : Bool
    open : Bool

    /// The five words `verb_of` produces, and nothing else. A sixth would
    /// render as a badge with a word no reader of the trace format knows.
    where verb is one of ["send", "intent", "offered", "answer", "refused"]

    /// Counters into a recording. `seq` is a position, `turn` groups them and
    /// `walk` links a cascade; `depth` is how far the causal nesting goes.
    /// All four are counts, and none of them runs backwards.
    where seq >= 0
    where turn >= 0
    where walk >= 0
    where depth >= 0

    /// `hasWalk` is not a second fact — it is `walk` asked as a question, and
    /// a row where the two disagree hides a link the recording made.
    invariant hasWalkTracksWalk
      format $'hasWalk says {.hasWalk} for walk {.walk}' {
        .hasWalk is (.walk is not 0)
      }
  }

  /// The rows, and the two questions a reader asks of them: show me only what
  /// a rerun would feed, and show me one turn at a time.
  state TraceLog {
    rows : Array[TraceRow]
    hasRows : Bool
    inputsOnly : Bool
    /// 0 shows every turn.
    turn : Int
    emptyHint : String

    /// 0 is "every turn", so the filter is a turn number or that sentinel.
    where turn >= 0

    /// The flag the empty hint hangs off. It is derived from `rows` and
    /// stored anyway — a template picks a value, it does not decide one — so
    /// this is where the two are held to being the same answer.
    invariant hasRowsTracksRows
      format $'hasRows says {.hasRows} for {len .rows} rows' {
        .hasRows is ((len .rows) > 0)
      }
  }

  /// What a recording says about itself, before any of its events.
  state TraceHeader {
    component : String
    module : String
    example : String
    fingerprint : String
    events : Int
    inputs : Int
    turns : Int
    relocatedFrom : String
    isRelocated : Bool
    compacted : Bool

    where events >= 0
    where inputs >= 0
    where turns >= 0

    /// An input is an event — the ones a rerun would feed — so the count of
    /// them cannot exceed the whole. Two fields, so no type states it.
    invariant inputsAreEvents
      format $'{.inputs} inputs out of {.events} events' { .inputs <= .events }

    /// Same relation for turns: a turn is a group of events, and a recording
    /// with no events has no turns to group.
    invariant turnsAreEvents
      format $'{.turns} turns out of {.events} events' { .turns <= .events }

    /// The flag and the list it summarises.
    invariant isRelocatedTracksFrom
      format 'isRelocated and relocatedFrom disagree' {
        .isRelocated is ((len .relocatedFrom) > 0)
      }
  }

  /// One candidate for relocation: a place the recording touched, with how
  /// much of the recording is about it.
  state TracePlace {
    label : String
    display : String
    component : String
    events : Int
    depth : Int
    selected : Bool
    rowClass : String
    /// Whether cutting here yields something mountable. A list is a correct
    /// cut and an unmountable trace, and saying so before the click is
    /// cheaper than saying it after.
    mountable : Bool

    where events >= 0
    where depth >= 0
  }

  /// The places a recording is ABOUT, offered as relocation targets.
  state TracePlaces {
    places : Array[TracePlace]
    hasPlaces : Bool
    selected : String
    /// What this list IS. The same component serves two lists — the places a
    /// recording touched, and the components under something somebody just
    /// clicked — because they are the same list of the same things offered for
    /// the same reason, and only the sentence above them differs.
    heading : String
    emptyHint : String

    /// The flag and the list, held to one answer — the same pairing
    /// `TraceLog` makes, and the reason both are `invariant`s rather than
    /// computes: the host decides them and a template only reads them.
    invariant hasPlacesTracksPlaces
      format $'hasPlaces says {.hasPlaces} for {len .places} places' {
        .hasPlaces is ((len .places) > 0)
      }
  }

  /// The recorder, as a control. Off is the default and the whole point:
  /// nothing is recorded until somebody asks.
  state RecorderBar {
    recording : Bool
    /// What the next recording will cover: `all`, `section` or `example`.
    scope : String
    scopeLabel : String
    /// The three buttons' classes. Precomputed for the same reason every other
    /// class here is: a template picks a value, it does not decide one.
    allClass : String
    sectionClass : String
    exampleClass : String
    events : Int
    turns : Int
    /// Set once a recording exists and has been stopped — the moment the
    /// trace view is worth switching to.
    hasTrace : Bool
    /// Whether the picker is open. Asked BEFORE recording starts, because
    /// what a recording covers is not something it can be told afterwards.
    picking : Bool

    /// The three buttons, as the closed set they are. `setScope` is a
    /// declared message rather than a generated mutator, so nothing else
    /// checks its argument.
    where scope is one of ["all", "section", "example"]

    where events >= 0
    where turns >= 0
    invariant turnsAreEvents
      format $'{.turns} turns out of {.events} events' { .turns <= .events }
  }

  /// Recording, in one control and one place.
  ///
  /// A viewer, a picker and a recorder bar are three components and one
  /// screen; this is the screen. Nothing here holds a trace — the host does,
  /// and it hands down the three instances already built.
  state TracePanel {
    bar : RecorderBar
    header : TraceHeader
    places : TracePlaces
    log : TraceLog
    recordTabClass : String
    traceTabClass : String
    selectTabClass : String
    /// The word the selection-mode button reads as.
    selectLabel : String
    /// `record`, `trace` or `pick`. Recording and reading are two modes
    /// because they are two activities: while a session is being recorded
    /// nobody is reading it, and a reader is not about to click the app.
    tab : String
    hasTrace : Bool
    /// Selection mode: click anything on the page and the component tree it
    /// belongs to comes back as relocation candidates.
    selecting : Bool
    /// Which pane is the one showing. One field EACH rather than an expression
    /// over `tab`, because "there is a trace" and "the reader asked for this
    /// pane" are decided by the host and by a click, and neither belongs in a
    /// template. Three flags because there are three panes and at most one of
    /// them is ever right.
    showTrace : Bool
    showReplay : Bool
    showImport : Bool
    /// How far through the recording the viewer is parked.
    at : Int
    total : Int

    /// Whatever the last thing the reader asked for had to say for itself: a
    /// file that would not parse, a cut that could not carry something across,
    /// a rerun that diverged. ONE field for all three because they are one
    /// thing to a reader — the sentence explaining why what they just asked
    /// for did not do what they expected — and three fields would be three
    /// places to forget to clear.
    notice : String
    hasNotice : Bool
    /// The draft a trace is pasted into. A textarea is the import path that
    /// needs nothing of the host but the text, so it works on every backend
    /// and in `moon test`; a file picker is the same message with a nicer way
    /// to fill it in.
    draft : String
    /// Whether a rerun is loaded and has somewhere to go.
    canReplay : Bool
    /// Whether it is mid-run. A run steps on the animation frame, so this is
    /// what says a frame is already armed.
    replaying : Bool
    replayTabClass : String

    /// Four panes, four names. `setTab` carries a `String` and is answered
    /// by the host, so this clause is the only check its argument gets.
    where tab is one of ["record", "trace", "pick", "replay"]

    /// The flag and the sentence it summarises — the same pairing every other
    /// flag here makes.
    invariant hasNoticeTracksNotice
      format $'hasNotice says {.hasNotice} for a notice of {len .notice}' {
        .hasNotice is ((len .notice) > 0)
      }

    /// Nothing to rerun without a recording to rerun.
    invariant canReplayNeedsATrace
      format 'the replay controls are live without a trace behind them' {
        .canReplay implies .hasTrace
      }

    /// A run is a run OF something.
    invariant replayingNeedsAReplay
      format 'a rerun is playing that was never mounted' {
        .replaying implies .canReplay
      }

    /// 1-based for display, and 0 for "parked before the first row".
    where at >= 0
    where total >= 0

    /// The cursor is inside the recording it is a cursor into.
    invariant atWithinTotal
      format $'parked at {.at} of {.total}' { .at <= .total }

    /// `showTrace` is the conjunction the host computes, and the reader of
    /// this block should not have to find the handler that computes it.
    invariant showTraceNeedsATrace
      format 'the trace pane is showing without a trace behind it' {
        .showTrace implies .hasTrace
      }

    /// Same for the rerun's pane: there is nothing to rerun without one.
    invariant showReplayNeedsATrace
      format 'the replay pane is showing without a trace behind it' {
        .showReplay implies .hasTrace
      }
  }

  /// The bar raises these AT THE HOST: only the host owns a transactor, and
  /// only the host can install a recorder on one.
  handle RecorderBar {
    message {
    setScope(String)
    openPicker
    closePicker
    startRecording
    stopRecording
    clearRecording

    }
  }

  handle TracePanel {
    message {
    setTab(String)
    setAt(Int)
    toggleSelecting
    exportTrace
    importDraft
    cutToPlace
    replayStep
    replayRun
    replayReset

    }
  }

  handle TracePlace {
    message {
    pickPlace(String)

    }
  }

  handle TraceLog {
    message {
    setTurn(Int)
    showAllTurns

    }
  }

  handle TraceRow {
    message {
    toggle

    }
  }
</script>

<script type="tutuca/script" for="TracePanel">
  /// Selection mode on and off. At the HOST, for the same reason recording is:
  /// what makes a click on the page mean "pick this" is a document listener,
  /// and a component cannot install one.
  receive toggleSelecting {
    ask lex 'traceSelect'
  }

  /// Which pane is showing.
  ///
  /// Set here AND sent on, which looks redundant and is not. The pane
  /// visibility and the tab classes are the HOST's — it is the only thing that
  /// knows whether there is a recording to show — so a click that only changed
  /// `.tab` would move the highlight and leave the panes where they were.
  /// Setting it locally too is what keeps the button responsive on the frame
  /// the click landed on, rather than a round trip later.
  receive setTab(t) {
    .tab = t
    ask lex 'traceSetTab' t
  }

  /// `draft` has no arm of its own: `@bind` synthesises the mutator that
  /// fills it, which is the point of writing the textarea that way. A
  /// half-typed recording is this component's business and never the host's —
  /// asking the host to hold every keystroke would rebuild the panel on each
  /// one.

  /// Everything else leaves. A recording lives on the host — the component was
  /// handed a rendering of one and never the thing itself — so every verb that
  /// acts on it is a message to whoever holds it.
  receive exportTrace {
    ask lex 'traceExport'
  }

  receive importDraft {
    ask lex 'traceImport' .draft
  }

  receive cutToPlace {
    ask lex 'traceRelocate'
  }

  receive replayStep {
    ask lex 'traceReplayStep'
  }

  receive replayRun {
    ask lex 'traceReplayRun'
  }

  receive replayReset {
    ask lex 'traceReplayReset'
  }
</script>

<script type="tutuca/script" for="TracePlace">
  /// Which candidate the reader chose.
  ///
  /// On the ROW and not on the list, because the button is in the row's view
  /// and a view's `@on` is a message to the component that owns it — an arm on
  /// the list would never be reached. At the host, because choosing a place is
  /// only worth anything to the thing that holds the recording.
  receive pickPlace(p) {
    ask lex 'tracePick' p
  }
</script>

<script type="tutuca/script" for="TraceRow">
  /// Open one line to see its arguments and the state it produced. A row is
  /// closed by default because a recording is read by scanning it, and forty
  /// expanded rows is not a thing anybody scans.
  receive toggle {
    .open = not (.open)
  }
</script>

<script type="tutuca/script" for="RecorderBar">
  /// Which scope the next recording will cover.
  ///
  /// The classes are set here rather than left to the builder because this is
  /// the one field on the bar a CLICK changes: everything else the bar shows is
  /// the host's, handed down when it rebuilds. A precomputed class that a click
  /// can invalidate is a class that goes stale, so the arm that invalidates it
  /// is the arm that sets it.
  receive setScope(s) {
    .scope = s
    .scopeLabel = if s is 'section' { 'the active section' } else { if s is 'example' { 'this example' } else { 'the whole storybook' } }
    .allClass = if s is 'all' { 'btn btn-sm pick-all btn-primary' } else { 'btn btn-sm pick-all btn-outline' }
    .sectionClass = if s is 'section' { 'btn btn-sm pick-section btn-primary' } else { 'btn btn-sm pick-section btn-outline' }
    .exampleClass = if s is 'example' { 'btn btn-sm pick-example btn-primary' } else { 'btn btn-sm pick-example btn-outline' }
  }

  /// Open and close the picker. Asked BEFORE recording starts, because what a
  /// recording covers is not something it can be told afterwards.
  receive openPicker {
    .picking = true
  }

  receive closePicker {
    .picking = false
  }

  /// The three that leave the component.
  ///
  /// Raised AT THE HOST rather than handled here, and it is not a stylistic
  /// choice: recording is installing a `Recorder` on a transactor, and a
  /// transactor is the one thing a component cannot reach. What the bar owns is
  /// which scope is selected and whether the picker is open; everything that
  /// actually records is the host's.
  ///
  /// `lex` is the leg, so the answer comes from a handler registered in the
  /// scope — which is exactly where a host puts one.
  receive startRecording {
    .picking = false
    ask lex 'traceStart' .scope
  }

  receive stopRecording {
    ask lex 'traceStop'
  }

  receive clearRecording {
    ask lex 'traceDiscard'
  }
</script>

<script type="tutuca/script" for="TraceLog">
  /// Which turn a reader is looking at, and `0` for all of them. A toggle
  /// rather than a filter box because the interesting question is almost
  /// always "this turn, and what it caused".
  receive setTurn(t) {
    .turn = t
  }

  receive showAllTurns {
    .turn = 0
  }
</script>

<template id="TraceRow">
  <div :class=".rowClass">
    <div class="row-head flex items-center gap-2 flex-wrap cursor-pointer" @on.click="toggle">
      <span class="badge badge-xs tabular-nums opacity-50 row-seq" @text=".seq"></span>
      <span title="What this was: a message, an intent, an offer to the host, the host's answer, or a refusal"
            :class=".verbClass" @text=".verb"></span>
      <span class="font-mono font-semibold row-name" @text=".name"></span>
      <span title="Where it landed" class="text-xs opacity-40 font-mono row-place" @text=".place"></span>
      <span title="A rerun feeds this one; everything else it produces for itself"
            class="badge badge-xs badge-primary badge-outline row-input" @show=".input">input</span>
      <span title="Every hop of one intent shares this" class="badge badge-xs badge-ghost row-walk"
            @show=".hasWalk"><x text="'walk '"></x><x text=".walk"></x></span>
      <span class="ml-auto text-xs opacity-40 tabular-nums row-turn"><x text="'turn '"></x><x text=".turn"></x></span>
    </div>
    <div class="pl-6 flex flex-col gap-1 font-mono text-xs row-detail" @show=".open">
      <div class="opacity-60 row-args" @show="truthy? .args"><x text="'args '"></x><x text=".args"></x></div>
      <div @show=".hasAfter">
        <div class="opacity-50">after</div>
        <x render=".after"></x>
      </div>
      <div class="opacity-40 row-noafter" @hide=".hasAfter">no state was kept for this one</div>
    </div>
  </div>
</template>

<template id="TraceLog">
  <div class="trace-log flex flex-col gap-1 max-h-[50vh] overflow-y-auto p-2">
    <div class="text-xs opacity-40 empty-hint" @hide=".hasRows" @text=".emptyHint"></div>
    <x render-each=".rows"></x>
  </div>
</template>

<template id="TraceHeader">
  <div class="trace-header flex flex-col gap-1 p-2 text-sm">
    <div class="flex items-center gap-2 flex-wrap">
      <span class="badge badge-sm badge-primary header-component" @text=".component"></span>
      <span class="text-xs opacity-50 font-mono header-module" @show="truthy? .module" @text=".module"></span>
      <span class="text-xs opacity-50 header-example" @show="truthy? .example" @text=".example"></span>
      <span title="This trace was cut down to a subtree; every path in it was rewritten"
            class="badge badge-xs badge-warning header-relocated" @show=".isRelocated">
        <x text="'relocated from '"></x><x text=".relocatedFrom"></x>
      </span>
      <span title="The derived events were dropped: this trace can no longer be relocated or scripted"
            class="badge badge-xs badge-ghost header-compacted" @show=".compacted">compacted</span>
    </div>
    <div class="flex gap-3 text-xs opacity-60 tabular-nums">
      <span class="header-events"><x text=".events"></x><x text="' events'"></x></span>
      <span class="header-inputs"><x text=".inputs"></x><x text="' fed on a rerun'"></x></span>
      <span class="header-turns"><x text=".turns"></x><x text="' turns'"></x></span>
      <span class="opacity-40 font-mono header-fp" @show="truthy? .fingerprint" @text=".fingerprint"></span>
    </div>
  </div>
</template>

<template id="TracePlace">
  <button :class=".rowClass" @on.click="pickPlace .label">
    <span class="font-mono place-label" @text=".display"></span>
    <span class="badge badge-xs badge-ghost place-component" @show="truthy? .component" @text=".component"></span>
    <span title="Cutting here would not yield a component, so the trace could not be mounted"
          class="badge badge-xs badge-warning place-unmountable" @hide=".mountable">not a component</span>
    <span class="ml-auto text-xs opacity-40 tabular-nums place-count" @text=".events"></span>
  </button>
</template>

<template id="TracePlaces">
  <div class="trace-places flex flex-col gap-1 p-2">
    <div class="text-xs opacity-50 places-heading" @text=".heading"></div>
    <div class="text-xs opacity-40 empty-hint" @hide=".hasPlaces" @text=".emptyHint"></div>
    <x render-each=".places"></x>
  </div>
</template>

<template id="RecorderBar">
  <div class="flex flex-col gap-1">
    <div class="recorder-bar flex items-center gap-2 p-2 flex-wrap">
      <button class="btn btn-sm btn-error rec-stop" @show=".recording" @on.click="stopRecording">
        Stop recording
      </button>
      <button class="btn btn-sm btn-primary rec-start" @hide=".recording" @on.click="openPicker">
        Record
      </button>
      <span class="badge badge-sm badge-ghost rec-scope" @text=".scopeLabel"></span>
      <span class="text-xs opacity-60 tabular-nums rec-count" @show=".recording">
        <x text=".events"></x><x text="' events · '"></x><x text=".turns"></x><x text="' turns'"></x>
      </span>
      <button class="btn btn-sm btn-ghost rec-clear" @show=".hasTrace" @hide=".recording" @on.click="clearRecording">
        Discard
      </button>
    </div>
    <!-- Inline rather than a view of its own: what a recording covers has to be
         asked in the place the Record button is, and a second template holding
         the same three buttons is a second place for them to drift. -->
    <div class="recorder-picker flex flex-col gap-2 p-2" @show=".picking">
    <div class="text-sm">What should this recording cover?</div>
    <div class="flex gap-2 flex-wrap">
      <button :class=".allClass" @on.click="setScope 'all'">The whole storybook</button>
      <button :class=".sectionClass" @on.click="setScope 'section'">The active section</button>
      <button :class=".exampleClass" @on.click="setScope 'example'">This example only</button>
    </div>
    <div class="text-xs opacity-50">
      A narrower scope is not a filter applied afterwards — it is what gets mounted with a
      recorder on it, so nothing else is ever captured. You can still cut a recording down
      to one component when you stop.
    </div>
      <div class="flex gap-2">
        <button class="btn btn-sm btn-primary picker-go" @on.click="startRecording">Start</button>
        <button class="btn btn-sm btn-ghost picker-cancel" @on.click="closePicker">Cancel</button>
      </div>
    </div>
  </div>
</template>

<template id="TracePanel">
  <div class="trace-panel flex flex-col gap-2">
    <div class="flex items-center gap-2 border-b border-base-content/10 px-2">
      <button :class=".recordTabClass" @on.click="setTab 'record'">Record</button>
      <button :class=".traceTabClass" @show=".hasTrace" @on.click="setTab 'trace'">Trace</button>
      <button :class=".replayTabClass" @show=".hasTrace" @on.click="setTab 'replay'">Replay</button>
      <button :class=".selectTabClass" @show=".hasTrace" @on.click="toggleSelecting"
              @text=".selectLabel"></button>
      <span class="ml-auto text-xs opacity-40 tabular-nums panel-pos" @show=".hasTrace">
        <x text=".at"></x><x text="' / '"></x><x text=".total"></x>
      </span>
    </div>
    <!-- Above every pane, because it is about the thing the reader just did
         and not about the pane they happen to be looking at. A parse error on
         import belongs where they can see it without changing tabs. -->
    <div class="trace-notice alert alert-warning text-xs mx-2 py-1" @show=".hasNotice"
         @text=".notice"></div>
    <x render=".bar"></x>
    <div class="panel-trace flex flex-col gap-2" @show=".showTrace">
      <div class="flex items-center gap-2 px-2 flex-wrap">
        <button class="btn btn-sm btn-ghost trace-export" @on.click="exportTrace">
          Download
        </button>
        <!-- Enabled by a pick, and the pick is a separate press for the reason
             the host's comment gives: choosing a place is the thing a person
             does several times before they mean it. -->
        <button class="btn btn-sm btn-ghost trace-cut" @on.click="cutToPlace">
          Cut to the picked place
        </button>
      </div>
      <x render=".header"></x>
      <x render=".places"></x>
      <x render=".log"></x>
    </div>
    <!-- The rerun. It drives the STORY, not a preview of one: the gallery is a
         single transactor with every story mounted under it, so the events go
         into the instance already on screen and the reader watches it move. -->
    <div class="panel-replay flex flex-col gap-2 p-2" @show=".showReplay">
      <div class="flex gap-2 flex-wrap" @show=".canReplay">
        <button class="btn btn-sm btn-primary replay-step" @on.click="replayStep">Step</button>
        <button class="btn btn-sm replay-run" @on.click="replayRun">Run</button>
        <button class="btn btn-sm btn-ghost replay-reset" @on.click="replayReset">Reset</button>
        <span class="text-xs opacity-60 tabular-nums replay-pos self-center">
          <x text=".at"></x><x text="' of '"></x><x text=".total"></x>
        </span>
      </div>
      <div class="text-xs opacity-50" @show=".canReplay">
        The story above is the one being driven. A step feeds one whole turn —
        what the recording drained together — so the app is never left
        mid-cascade in a state it was never in.
      </div>
    </div>
    <!-- Import lives on the empty pane as well as the full one: the reader who
         has no recording is exactly the reader who wants to load somebody
         else's. -->
    <div class="panel-import flex flex-col gap-2 p-2" @show=".showImport">
      <div class="text-xs opacity-50">Paste a .trace.jsonl to load it.</div>
      <textarea class="textarea textarea-sm trace-draft" rows="3"
                @bind=".draft"></textarea>
      <div>
        <button class="btn btn-sm trace-import" @on.click="importDraft">Load</button>
      </div>
    </div>
    <div class="panel-empty flex flex-col gap-2 px-2 pb-2" @hide=".hasTrace">
      <div class="text-xs opacity-40">
        Nothing recorded yet. Press Record, use the component, then stop —
        or paste a recording somebody else made.
      </div>
      <textarea class="textarea textarea-sm trace-draft-empty" rows="3"
                @bind=".draft"></textarea>
      <div>
        <button class="btn btn-sm trace-import-empty" @on.click="importDraft">Load</button>
      </div>
    </div>
  </div>
</template>
