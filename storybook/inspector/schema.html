<script type="tutuca/spec">
  state SchemaProperty {
    key : String
    child : Any
    required : Bool

    /// A property of an object schema is named. `""` is a legal JSON key and
    /// an illegal JSON Schema `properties` entry to render — the row would
    /// draw a required marker beside nothing.
    where key is nonempty
  }

  state SchemaBranch {
    label : String
    child : Any
    labelClass : String

    /// A branch is the label above the subschema it introduces (`if`,
    /// `then`, `items`, …). A blank one is an unlabelled indent.
    where label is nonempty
  }
</script>

<template id="SchemaProperty">
  <div class="contents">
    <span class="font-mono text-sm flex items-center gap-1 leading-tight">
      <span class="text-base-content/60 schema-key" @text=".key"></span>
      <span @show=".required" class="text-error font-bold" title="required">*</span>
      <span class="text-base-content/30">:</span>
    </span>
    <x render=".child"></x>
  </div>
</template>

<template id="SchemaBranch">
  <div class="contents">
    <span class="flex items-center gap-1 leading-tight">
      <span :class="$labelCssClass" @text=".label"></span>
      <span class="text-base-content/30">:</span>
    </span>
    <x render=".child"></x>
  </div>
</template>

<template id="SchemaBranch:_margauiClasses">
  <p class="text-accent text-secondary text-info text-error"></p>
</template>
