<script type="tutuca/spec">
  state SwatchPicker {
    color : String
    palette : Array[String]

    /// A picker with nothing to pick from is a preview rectangle and no way
    /// to change it — and it is what a generator draws first unless told.
    where palette is nonempty

    /// The relation the swatch row draws: the selection is one of the
    /// offered colours. It is an `invariant` and not a `where` because
    /// `palette` is a LIST of colours rather than a set of them, and
    /// `member of` reads a set — the vocabulary is closed exactly so that
    /// what it does admit can also be run backwards.
    invariant colorIsOnThePalette
      format $'{.color} is not one of the swatches' {
        has .palette .color
      }
  }

  state Quadratic {
    a : Int
    b : Int
    c : Int
  }
</script>

<template id="SwatchPicker">
  <div class="flex flex-col gap-2">
    <svg viewBox="0 0 380 130" role="img">
      <rect class="preview" x="20" y="12" width="340" height="52" rx="8" :fill=".color"></rect>
      <circle @each=".palette" @enrich-with="swatch"
        :cx="@cx" cy="98" r="18" :fill="@value"
        stroke-width="3" :stroke="@ring"
        @on.click=".color = @value"></circle>
    </svg>
    <p class="text-sm label">Selected: <x text=".color"></x></p>
  </div>
</template>
<template id="Quadratic">
  <div class="flex flex-col gap-3">
    <div class="flex gap-3 text-sm">
      <label class="flex items-center gap-1">a <input type="number" class="input input-sm w-16 in-a" :value=".a" @on.input=".a = e.valueAsInt"></label>
      <label class="flex items-center gap-1">b <input type="number" class="input input-sm w-16 in-b" :value=".b" @on.input=".b = e.valueAsInt"></label>
      <label class="flex items-center gap-1">c <input type="number" class="input input-sm w-16 in-c" :value=".c" @on.input=".c = e.valueAsInt"></label>
    </div>
    <math display="block">
      <mn class="m-a" @text=".a"></mn>
      <mo>&#x2062;</mo>
      <msup><mi>x</mi><mn>2</mn></msup>
      <mo>+</mo>
      <mn class="m-b" @text=".b"></mn>
      <mo>&#x2062;</mo>
      <mi>x</mi>
      <mo>+</mo>
      <mn class="m-c" @text=".c"></mn>
      <mo>=</mo>
      <mn>0</mn>
    </math>
    <p class="text-sm">Discriminant: <span class="disc" @text="$discriminant"></span></p>
    <p class="text-sm">There are <span class="classify" @text="$classify"></span>.</p>
  </div>
</template>
