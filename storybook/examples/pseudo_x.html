<script type="tutuca/spec">
  state TableRow {
    name : String
    qty : Int
    price : Double

    /// A line item on an invoice: you cannot order fewer than none of
    /// something, and a negative price is a different document.
    where qty >= 0
    where price >= 0
  }

  state ItemTable {
    rows : Array[TableRow]
  }

  state SelectOption {
    value : String
    label : String
  }

  state ItemSelect {
    options : Array[SelectOption]
    current : String
  }

  state PseudoXDemo {
    table : ItemTable
    select : ItemSelect
  }
</script>

<template id="TableRow">
  <tr>
    <td class="name" @text=".name"></td>
    <td class="qty" @text=".qty"></td>
    <td class="price" @text=".price"></td>
  </tr>
</template>
<template id="ItemTable">
  <table class="table">
    <thead><tr><th>Name</th><th>Qty</th><th>Price</th></tr></thead>
    <tbody>
      <tr @x render-each=".rows"></tr>
    </tbody>
  </table>
</template>
<template id="SelectOption">
  <option :value=".value" @text=".label"></option>
</template>
<template id="ItemSelect">
  <select class="select" :value=".current" @on.input=".current = e.value">
    <option @x render-each=".options"></option>
  </select>
</template>
<template id="PseudoXDemo">
  <div>
    <x render=".table"></x>
    <x render=".select"></x>
  </div>
</template>
