<script type="tutuca/state">
  interface table-row {
    record state {
    name: string,
    qty: s32,
    price: f64,
    }
  }
  interface item-table {
    record state {
    rows: values,
    }
  }
  interface select-option {
    record state {
    value: string,
    label: string,
    }
  }
  interface item-select {
    record state {
    options: values,
    current: string,
    }
  }
  interface pseudo-x-demo {
    record state {
    table: component,
    select: component,
    }
  }
</script>

<template id="TableRow">
  <tr>
    <td class="name" @text=".name"></td>
    <td class="qty" @text=".qty"></td>
    <td class="price" @text=".price"></td>
  </tr>
</template>
<template id="ItemTable">
  <table class="table">
    <thead><tr><th>Name</th><th>Qty</th><th>Price</th></tr></thead>
    <tbody>
      <tr @x render-each=".rows"></tr>
    </tbody>
  </table>
</template>
<template id="SelectOption">
  <option :value=".value" @text=".label"></option>
</template>
<template id="ItemSelect">
  <select class="select" :value=".current" @on.input="$setCurrent value">
    <option @x render-each=".options"></option>
  </select>
</template>
<template id="PseudoXDemo">
  <div>
    <x render=".table"></x>
    <x render=".select"></x>
  </div>
</template>
