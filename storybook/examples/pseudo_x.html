<script type="tutuca/state">
  state TableRow {
    name : String
    qty : Int
    price : Double
  }

  state ItemTable {
    rows : Array[Any]
  }

  state SelectOption {
    value : String
    label : String
  }

  state ItemSelect {
    options : Array[Any]
    current : String
  }

  state PseudoXDemo {
    table : ItemTable
    select : ItemSelect
  }
</script>

<template id="TableRow">
  <tr>
    <td class="name" @text=".name"></td>
    <td class="qty" @text=".qty"></td>
    <td class="price" @text=".price"></td>
  </tr>
</template>
<template id="ItemTable">
  <table class="table">
    <thead><tr><th>Name</th><th>Qty</th><th>Price</th></tr></thead>
    <tbody>
      <tr @x render-each=".rows"></tr>
    </tbody>
  </table>
</template>
<template id="SelectOption">
  <option :value=".value" @text=".label"></option>
</template>
<template id="ItemSelect">
  <select class="select" :value=".current" @on.input="setCurrent e.value">
    <option @x render-each=".options"></option>
  </select>
</template>
<template id="PseudoXDemo">
  <div>
    <x render=".table"></x>
    <x render=".select"></x>
  </div>
</template>
