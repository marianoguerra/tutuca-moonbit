<script type="tutuca/state">
  state BarChart {
    values : Array[Any]
  }

  state IconGallery {
    size : Int
  }
</script>

<script type="tutuca/script" for="BarChart">
  /// The two limits, named. A `pred` reads the state and nothing else, which
  /// is what lets it sit in a handler's header instead of at the top of its
  /// body.
  ///
  /// Each carries the sentence it says when it does NOT hold. The comment says
  /// what the rule is; the `format` says what went wrong this time, with the
  /// count that made it go wrong — which is the half nobody can reconstruct
  /// afterwards from a chart that simply did not change.
  pred hasRoom
    format $'nine bars is the cap, and there are already {len .values}'
  { (len .values) < 9 }

  pred hasSpare
    format 'one bar has to stay, or there is no chart left to look at'
  { (len .values) > 1 }

  /// Add a bar, up to nine. The height is derived from the length rather than
  /// drawn at random, so the picture is the same on every run — a test can
  /// look at it.
  ///
  /// The cap is a PRECONDITION rather than an `if` around the whole body: both
  /// refuse the same presses, but a refusal with a name is REPORTED — the
  /// tenth press says `contract: addBar declined — its precondition hasRoom
  /// does not hold: nine bars is the cap, and there are already 9` through
  /// `warn_hook`, where an `if` that did not fire looks exactly like a chart
  /// that had nothing to add. A host that wants the record rather than the
  /// line calls `@tutuca.on_refusal` and gets the rule, the path and the state
  /// that was rejected with it.
  on addBar requires hasRoom {
    .values.push (((((len .values) * 17) + 23) mod 90) + 10)
  }

  /// Drop the last bar, never the last one standing.
  on removeBar requires hasSpare {
    .values.deleteAt ((len .values) - 1)
  }
</script>

<template id="BarChart">
  <div class="flex flex-col gap-3">
    <svg viewBox="0 0 300 120" role="img">
      <line class="axis" x1="0" y1="110" x2="300" y2="110" stroke="#cbd5e1" stroke-width="1"></line>
      <rect @each=".values" @loop-with="layout" @enrich-with="bar"
        :x="@x" :y="@y" :width="@w" :height="@h" rx="3" fill="#6366f1"></rect>
      <text @each=".values" @loop-with="layout" @enrich-with="bar"
        :x="@cx" :y="@labelY" @text="@value" text-anchor="middle" font-size="10" fill="#475569"></text>
    </svg>
    <div class="join">
      <button class="btn btn-primary join-item randomize" @on.click="randomize">Randomize</button>
      <button class="btn join-item add" @on.click="addBar">Add bar</button>
      <button class="btn join-item remove" @on.click="removeBar">Remove bar</button>
    </div>
  </div>
</template>
