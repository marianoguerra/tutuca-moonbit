<script type="tutuca/spec">
  state BarChart {
    values : Array[Int]

    /// The two limits, named. A `pred` reads the state and nothing else, which
    /// is what lets it sit in a handler's header instead of at the top of its
    /// body — and what puts it HERE, beside the field it is about, rather than
    /// among the handlers that ask it.
    ///
    /// Each carries the sentence it says when it does NOT hold. The comment
    /// says what the rule is; the `format` says what went wrong this time,
    /// with the count that made it go wrong — which is the half nobody can
    /// reconstruct afterwards from a chart that simply did not change.
    pred hasRoom
      format $'nine bars is the cap, and there are already {len .values}' { (len .values) < 9 }

    pred hasSpare
      format 'one bar has to stay, or there is no chart left to look at' { (len .values) > 1 }

    /// What the chart KEEPS, as opposed to what a handler asks before it acts.
    /// It is checked after every dispatch — the two handlers below, the
    /// generated `setValues` and `pushInValues` nobody wrote, and anything
    /// added later that never mentions it.
    ///
    /// `hasSpare` is the same sentence attached at a different moment, and the
    /// difference is the point: a precondition can decline, an invariant
    /// cannot be declined into. There is no way to reach an empty chart.
    invariant neverEmpty
      format 'the chart lost its last bar' { (len .values) > 0 }

    // DELIBERATELY no `where values len between 1 and 9`, even though that is
    // exactly what the three rules above add up to. A plain comment and not a
    // `///` one, because a doc comment attaches to the declaration under it
    // and there is none: what this says is about the clause that is NOT here.
    //
    // A domain is read BACKWARDS by the generator: declare it and `@arb` stops
    // drawing `setValues []` at all, and the property next door — the one
    // asking whether `neverEmpty` really does stand between a generated
    // mutator and a chart with no bars — would pass by never asking. The
    // clause would not make the component safer; it would make the test that
    // proves it safe stop testing.
    //
    // That is the trade the two halves make. Narrowing the draw is what a
    // `where` is FOR, and it is the wrong tool for the one field whose
    // out-of-domain values are the point.
  }

  state IconGallery {
    size : Int

    /// The slider's own range, in the schema rather than only in the markup.
    /// `<input type="range" min="16" max="80">` bounds what a PERSON can send;
    /// `setSize` bounds nothing, and a 0-pixel icon renders as an empty box.
    where size between 16 and 80
  }
</script>

<script type="tutuca/script" for="BarChart">
  /// Add a bar, up to nine. The height is derived from the length rather than
  /// drawn at random, so the picture is the same on every run — a test can
  /// look at it.
  /// 
  /// The cap is a PRECONDITION rather than an `if` around the whole body: both
  /// refuse the same presses, but a refusal with a name is REPORTED — the
  /// tenth press says `contract: addBar declined — its precondition hasRoom
  /// does not hold: nine bars is the cap, and there are already 9` through
  /// `warn_hook`, where an `if` that did not fire looks exactly like a chart
  /// that had nothing to add. A host that wants the record rather than the
  /// line calls `@tutuca.on_runtime_notice` and gets the rule, path and state
  /// that was rejected with it.
  receive addBar requires hasRoom {
    .values.push (((((len .values) * 17) + 23) mod 90) + 10)
  }

  /// Drop the last bar, never the last one standing.
  receive removeBar requires hasSpare {
    .values.deleteAt ((len .values) - 1)
  }
</script>

<template id="BarChart">
  <div class="flex flex-col gap-3">
    <svg viewBox="0 0 300 120" role="img">
      <line class="axis" x1="0" y1="110" x2="300" y2="110" stroke="#cbd5e1" stroke-width="1"></line>
      <rect @each=".values" @loop-with="layout" @enrich-with="bar"
        :x="@x" :y="@y" :width="@w" :height="@h" rx="3" fill="#6366f1"></rect>
      <text @each=".values" @loop-with="layout" @enrich-with="bar"
        :x="@cx" :y="@labelY" @text="@value" text-anchor="middle" font-size="10" fill="#475569"></text>
    </svg>
    <div class="join">
      <button class="btn btn-primary join-item randomize" @on.click="randomize">Randomize</button>
      <button class="btn join-item add" @on.click="addBar">Add bar</button>
      <button class="btn join-item remove" @on.click="removeBar">Remove bar</button>
    </div>
  </div>
</template>
