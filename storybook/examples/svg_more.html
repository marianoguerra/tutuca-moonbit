<script type="tutuca/state">
  state BarChart {
    values : Array[Any]
  }

  state IconGallery {
    size : Int
  }
</script>

<script type="tutuca/script" for="BarChart">
  /// Add a bar, up to nine. The height is derived from the length rather than
  /// drawn at random, so the picture is the same on every run — a test can
  /// look at it.
  ///
  /// An `if` with no `else` that does not fire is still an answer: the arm
  /// claimed `addBar` and nothing moved, which is not the same as not knowing
  /// the name.
  on addBar {
    if (len .values) < 9 {
      .values.push (((((len .values) * 17) + 23) mod 90) + 10)
    }
  }

  /// Drop the last bar, never the last one standing.
  on removeBar {
    if (len .values) > 1 {
      .values.deleteAt ((len .values) - 1)
    }
  }
</script>

<template id="BarChart">
  <div class="flex flex-col gap-3">
    <svg viewBox="0 0 300 120" role="img">
      <line class="axis" x1="0" y1="110" x2="300" y2="110" stroke="#cbd5e1" stroke-width="1"></line>
      <rect @each=".values" @loop-with="layout" @enrich-with="bar"
        :x="@x" :y="@y" :width="@w" :height="@h" rx="3" fill="#6366f1"></rect>
      <text @each=".values" @loop-with="layout" @enrich-with="bar"
        :x="@cx" :y="@labelY" @text="@value" text-anchor="middle" font-size="10" fill="#475569"></text>
    </svg>
    <div class="join">
      <button class="btn btn-primary join-item randomize" @on.click="randomize">Randomize</button>
      <button class="btn join-item add" @on.click="addBar">Add bar</button>
      <button class="btn join-item remove" @on.click="removeBar">Remove bar</button>
    </div>
  </div>
</template>
