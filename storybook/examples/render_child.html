<script type="tutuca/spec">
  state Greeting {
    name : String
  }

  state Page {
    greeting : Greeting
  }

  state Entry {
    title : String
    description : String
  }

  state MultipleViews {
    value : Entry
  }
</script>

<script type="tutuca/script" for="Entry">
  /// Whether this entry matches a query, for a parent's `@when` filter.
  /// 
  /// It used to be a `func` in the state block — the one thing that put
  /// behaviour in a block whose own header says it holds none. It is a
  /// callable, so it lives with the callables.
  /// 
  /// No view of Entry calls it: a parent's `@when` does, holding Entry
  /// instances and knowing nothing of their fields. That is why the block says
  /// `for="Entry"` — this file declares four components, and a `.title` here
  /// has to mean exactly one of them.
  pred containsText(q) { (contains (lower .title) (lower q)) or (contains (lower .description) (lower q)) }
</script>

<template id="Greeting">
  <p class="p-2 border rounded">
    Hello, <strong @text=".name"></strong>!
  </p>
</template>
<template id="Page">
  <section class="flex flex-col gap-2">
    <h2 class="text-lg">Page header</h2>
    <x render=".greeting"></x>
    <p class="opacity-60">&mdash; end of page &mdash;</p>
  </section>
</template>
<template id="Entry">
  <div class="card bg-base-100 shadow-sm">
    <div class="card-body">
      <h2 class="card-title" @text=".title"></h2>
      <p @text=".description"></p>
    </div>
  </div>
</template>
<template id="Entry:edit">
  <div class="card bg-base-100 shadow-sm gap-3">
    <div class="card-body">
      <input class="input title" :value=".title" @on.input=".title = e.value">
      <input class="input desc" :value=".description" @on.input=".description = e.value">
    </div>
  </div>
</template>
<template id="MultipleViews">
  <section class="flex flex-col gap-3">
    <x render=".value"></x>
    <x render=".value" as="edit"></x>
  </section>
</template>
