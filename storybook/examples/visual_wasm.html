<script type="tutuca/state">
  state VwEmpty {
  }

  state VwImm {
    value : Int
    rawValue : String
  }

  state VwTypes {
    items : Array[Any]
  }

  state VwContainer {
    items : Array[Any]
    expanded : Bool
    editing : Bool
  }

  state VwIf {
    thn : Array[Any]
    else : Array[Any]
    expanded : Bool
    editingIf : Bool
    editingThn : Bool
    editingElse : Bool
  }

  state VwSection {
    id : Int
    name : String
    items : Array[Any]
    expanded : Bool
    defaultItem : Any
  }

  state VwMemory {
    n : Int
    m : Int
  }

  state VwPicker {
    currentSection : String
    instructions : Array[Any]
    filter : String
  }
</script>
