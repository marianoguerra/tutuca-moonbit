<script type="tutuca/spec">
  state {
    activeSection : String
    todo : Component[Items]
    json : Component[JsonArray]
    tree : Component[TreeRoot]
    personalSite : Component[Root]
    visualWasm : Component[Module]
    dnd : Component

    /// Six tabs, six panes, and a seventh name would render a page with
    /// nothing on it — `setActiveSection` is generated, so this is the only
    /// place the closed set exists.
    where activeSection is one of ["todo", "json", "tree", "personalSite", "dnd", "visualWasm"]
  }
</script>

<template>
  <section class="flex flex-col gap-4">
    <div role="tablist" class="tabs tabs-border">
      <button role="tab" id="tab-todo"
        @if.class=".activeSection is 'todo'" @then="'tab tab-active'" @else="'tab'"
        @on.click="setActiveSection 'todo'">To-Do</button>
      <button role="tab" id="tab-json"
        @if.class=".activeSection is 'json'" @then="'tab tab-active'" @else="'tab'"
        @on.click="setActiveSection 'json'">JSON Editor</button>
      <button role="tab" id="tab-tree"
        @if.class=".activeSection is 'tree'" @then="'tab tab-active'" @else="'tab'"
        @on.click="setActiveSection 'tree'">Tree</button>
      <button role="tab" id="tab-personal-site"
        @if.class=".activeSection is 'personalSite'" @then="'tab tab-active'" @else="'tab'"
        @on.click="setActiveSection 'personalSite'">Personal Site</button>
      <button role="tab" id="tab-dnd"
        @if.class=".activeSection is 'dnd'" @then="'tab tab-active'" @else="'tab'"
        @on.click="setActiveSection 'dnd'">Drag and Drop</button>
      <button role="tab" id="tab-visual-wasm"
        @if.class=".activeSection is 'visualWasm'" @then="'tab tab-active'" @else="'tab'"
        @on.click="setActiveSection 'visualWasm'">Visual Wasm</button>
    </div>
    <div class="pane-todo" @show=".activeSection is 'todo'"><x render=".todo"></x></div>
    <div class="pane-json" @show=".activeSection is 'json'"><x render=".json"></x></div>
    <div class="pane-tree" @show=".activeSection is 'tree'"><x render=".tree"></x></div>
    <div class="pane-personal-site" @show=".activeSection is 'personalSite'"><x render=".personalSite"></x></div>
    <div class="pane-dnd" @show=".activeSection is 'dnd'"><x render=".dnd"></x></div>
    <div class="pane-visual-wasm" @show=".activeSection is 'visualWasm'"><x render=".visualWasm"></x></div>
  </section>
</template>
