<script type="tutuca/spec">
  state {
    items : Array[Component[Entry]]
    query : String
    view : String
    isLoading : Bool
    error : String?

    /// `@push-view=".view"` falls back to `main` for a name it cannot find,
    /// so a third value is not an error — it is a toggle that stops toggling.
    where view is one of ["main", "edit"]

    /// The three outcomes are exclusive, and this is the pair that a reader
    /// of the handlers has to hold in their head otherwise: a request that
    /// is still in flight has not failed yet. `loadDataFailed` clears the
    /// flag as it sets the message, and this is what says why.
    invariant notFailedWhileLoading
      format 'the spinner is up and an error is already showing' {
        .isLoading implies (null? .error)
      }
  }

  /// The host dispatches `Init` after `start()`. No view writes it, so the
  /// schema is the only place it can be declared.
  ///
  /// The other three are the ANSWERS, and declaring them is what makes
  /// `loadData` a request rather than a notification: a sender expects an
  /// answer if and only if it declares an arm for one. Nobody writes that
  /// down twice — the generator reads this list and fills the intent's opts in.
  ///
  /// Three outcomes, three arms. v1 had one combined `[res, err]` payload and
  /// a split arm that read the wrong slot; v2 gives each outcome its own name
  /// and its own shape.
  handle {
    message {
    init
    loadDataOk(Any)
    loadDataFailed(String)
    loadDataUnhandled

    }
  }
</script>

<script type="tutuca/script">
  /// Flip the pushed view name.
  receive toggleView {
    .view = if .view is 'main' { 'edit' } else { 'main' }
  }

  /// Dispatch the intent and say so. `intent` is an effect here, which means
  /// it goes out only if the whole body finished — a message sent beside a
  /// transition that did not happen is the one outcome nobody can reason
  /// about afterwards.
  ///
  /// `lex` is the leg: the answer comes from a handler REGISTERED IN THE
  /// SCOPE, not from a component up the tree. That is what v1 spelled
  /// `request`, and writing it as a route is the whole change — the verb no
  /// longer decides which scope answers.
  ///
  /// No opts here. The three answer arms are in the schema, so the generator
  /// already knows where the answer goes.
  receive init {
    intent lex 'loadData'
    .isLoading = true
  }
</script>

<template>
  <section class="flex flex-col gap-3">
    <div class="alert alert-info alert-outline loading" @show=".isLoading">Loading</div>
    <div class="flex justify-between" @hide=".isLoading">
      <input type="search" class="input" :value=".query"
        @on.input=".query = e.value" @on.keydown+cancel=".query = default"
        placeholder="Filter entries">
      <button class="btn bnt-sm btn-primary btn-outline another" @on.click="loadAnotherWay">Load Another Way</button>
      <button class="btn bnt-sm btn-primary toggle-btn" @text=".view" @on.click="toggleView"></button>
    </div>
    <div class="flex flex-col gap-3 max-h-[40vh] overflow-y-auto pr-3 rows" @hide=".isLoading" @push-view=".view">
      <x render-each=".items" @when="filterItem"></x>
    </div>
    <div class="error" @show="truthy? .error"><x text=".error"></x></div>
  </section>
</template>
