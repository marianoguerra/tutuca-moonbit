<script type="tutuca/spec">
  state TrafficLight {
    lightIndex : Int
  }

  state TabbedUI {
    tab : String
  }

  state ListAndFilter {
    items : Array[Any]
    query : String
  }
</script>

<script type="tutuca/script" for="TrafficLight">
  /// Step to the next colour, wrapping at the end of the cycle.
  /// 
  /// The three names are the `$light` method's business, not this one's: the
  /// handler only ever moves an index, so `mod 3` is all it needs to know.
  receive nextLight {
    .lightIndex = (.lightIndex + 1) mod 3
  }
</script>

<template id="TrafficLight">
  <section class="flex flex-col gap-2">
    <button class="btn btn-primary" @on.click="nextLight">Next light</button>
    <p>Light is: <code @text="$light"></code></p>
    <p class="advice">
      You must
      <span @show="$light is 'red'">STOP</span>
      <span @show="$light is 'orange'">SLOW DOWN</span>
      <span @show="$light is 'green'">GO</span>
    </p>
  </section>
</template>
<template id="TabbedUI">
  <section class="flex flex-col gap-3">
    <div role="tablist" class="tabs tabs-border">
      <button role="tab" id="t-overview"
        @if.class=".tab is 'overview'" @then="'tab tab-active'" @else="'tab'"
        @on.click="setTab 'overview'">Overview</button>
      <button role="tab" id="t-features"
        @if.class=".tab is 'features'" @then="'tab tab-active'" @else="'tab'"
        @on.click="setTab 'features'">Features</button>
      <button role="tab" id="t-pricing"
        @if.class=".tab is 'pricing'" @then="'tab tab-active'" @else="'tab'"
        @on.click="setTab 'pricing'">Pricing</button>
    </div>
    <div class="card p-3 border panel" @show=".tab is 'overview'">
      <h4>Overview</h4><p>A short summary of what this product does.</p>
    </div>
    <div class="card p-3 border panel" @show=".tab is 'features'">
      <h4>Features</h4><p>The list of features lives on this tab.</p>
    </div>
    <div class="card p-3 border panel" @show=".tab is 'pricing'">
      <h4>Pricing</h4><p>What it costs.</p>
    </div>
  </section>
</template>
<template id="ListAndFilter">
  <section class="flex flex-col gap-3">
    <input type="search" class="input" :value=".query"
      @on.input="setQuery e.value" @on.keydown+cancel="resetQuery"
      placeholder="Filter entries">
    <ul>
      <li @each=".items" @when="filterItem">
        <span @text="@key"></span>: <x text="@value"></x>
      </li>
    </ul>
  </section>
</template>
