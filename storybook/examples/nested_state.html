<script type="tutuca/state">
  interface nested-state {
    record label { text: string, done: bool }
    enum priority { low, high }
    variant due { unscheduled, on-day(s32) }
    record state {
      title: string,
      labels: list<label>,
      priority: priority,
      due: due,
      note: option<string>,
      size: tuple<s32, s32>,
    }
  }
</script>

<template>
  <div class="card bg-base-200 p-4">
    <h3 class="card-title" @text=".title"></h3>
    <ul class="menu">
      <li @each=".labels">
        <button class="btn btn-xs" @on.click="toggleLabel @key">
          <span @text="@value.text"></span>
        </button>
      </li>
    </ul>
    <button class="btn btn-sm btn-primary" @on.click="bumpPriority">
      bump priority
    </button>
  </div>
</template>
