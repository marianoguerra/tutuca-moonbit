<script type="tutuca/state">
  struct Label {
    text : String
    done : Bool
  }

  enum Priority {
    Low
    High
  }

  enum Due {
    Unscheduled
    OnDay(Int)
  }

  state {
    title : String
    labels : Array[Label]
    priority : Priority
    due : Due
    note : String?
    size : (Int, Int)
  }
</script>

<template>
  <div class="card bg-base-200 p-4">
    <h3 class="card-title" @text=".title"></h3>
    <ul class="menu">
      <li @each=".labels">
        <button class="btn btn-xs" @on.click="toggleLabel @key">
          <span @text="@value.text"></span>
        </button>
      </li>
    </ul>
    <button class="btn btn-sm btn-primary" @on.click="bumpPriority">
      bump priority
    </button>
  </div>
</template>
