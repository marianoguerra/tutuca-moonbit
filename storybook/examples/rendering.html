<script type="tutuca/spec">
  state PushView {
    items : Array[Component[Entry]]
    query : String
    view : String

    /// `@push-view=".view"` looks a view up by this name and falls back to
    /// `main` when it finds nothing — so a third name is not an error, it is
    /// a component that silently stops switching. Two views exist; say so.
    where view is one of ["main", "edit"]
  }

  state SeqItemAccess {
    byKey : Map[String, Component[Entry]]
    byIndex : Array[Component[Entry]]
    currentKey : Any
    currentIndex : Int

    /// The two selections, each said against the collection it selects from.
    /// This is the pair no type can state: `Int` and `String` are both true
    /// and both useless, and `<x render=".byIndex[.currentIndex]">` renders
    /// nothing at all when the relation does not hold.
    ///
    /// `or none` because the ZERO of this component is an empty catalogue
    /// with the slider parked at 0 — a real state, and one the generator has
    /// to be allowed to draw.
    where currentIndex is index of .byIndex or none
    where currentKey   is key of .byKey
  }

  state Pagination {
    items : Array[String]
    page : Int
    pageSize : Int

    /// A page size of zero divides by zero in `next`, and a negative one
    /// asks `@loop-with` for a slice that runs backwards. The floor is the
    /// interesting half; the ceiling keeps a generated `setPageSize` from
    /// drawing a slice nothing could paginate.
    where pageSize between 1 and 100
    where page >= 0

    /// What `prev` and `next` already clamp to, said once for the paths that
    /// do not go through them — `setPage`, and anything added later.
    /// `pageSize` is at least 1 by the clause above, so the division is safe
    /// wherever this rule is asked.
    invariant pageExists
      format $'page {.page} is past the last one' {
        (.page is 0) or ((.page * .pageSize) < (len .items))
      }
  }
</script>

<script type="tutuca/script" for="PushView">
  /// Flip the pushed view name. The label under the button is `$getToggleLabel`
  /// and stays in MoonBit — a `compute` is answered while rendering, and this
  /// runs after.
  receive toggleView {
    .view = if .view is 'main' { 'edit' } else { 'main' }
  }
</script>

<script type="tutuca/script" for="Pagination">
  /// Step back, never past the first page.
  receive prev {
    .page = max 0 (.page - 1)
  }

  /// Step forward, never past the last one.
  /// 
  /// `((len .items) - 1) / .pageSize` is the last page's index with its
  /// fraction still on it — the field is an Int and takes the whole part, so
  /// the division needs no ceiling of its own.
  receive next {
    .page = min (.page + 1) (((len .items) - 1) / .pageSize)
  }
</script>

<template id="PushView">
  <section class="flex flex-col gap-3">
    <div class="flex justify-between">
      <input type="search" class="input" :value=".query"
        @on.input="setQuery e.value" @on.keydown+cancel="resetQuery"
        placeholder="Filter entries">
      <button class="btn bnt-sm btn-primary toggle-btn" @text="$getToggleLabel" @on.click="toggleView"></button>
    </div>
    <div class="flex flex-col gap-3 max-h-[40vh] overflow-y-auto pr-3 rows" @push-view=".view">
      <x render-each=".items" @when="filterItem"></x>
    </div>
  </section>
</template>
<template id="SeqItemAccess">
  <section class="flex flex-col gap-3">
    <input type="range" min="0" :max="$getMaxIndex" :value=".currentIndex"
      @on.input="setCurrentIndex e.valueAsInt">
    <x render=".byIndex[.currentIndex]"></x>
    <select class="select" :value=".currentKey" @on.input="setCurrentKey e.value">
      <option @each=".byKey" :value="@key" @text="@value.title"></option>
    </select>
    <x render=".byKey[.currentKey]"></x>
  </section>
</template>
<template id="Pagination">
  <section class="flex flex-col gap-3">
    <div class="join">
      <button class="btn join-item prev" @on.click="prev" :disabled="$isFirstPage">&lsaquo; Prev</button>
      <button class="btn join-item btn-disabled label" @text="$pageLabel"></button>
      <button class="btn join-item next" @on.click="next" :disabled="$isLastPage">Next &rsaquo;</button>
    </div>
    <ul class="flex flex-col gap-1">
      <li @each=".items" @loop-with="paginate" class="flex gap-2 items-center">
        <span class="badge badge-neutral" @text="@key"></span>
        <x text="@value"></x>
      </li>
    </ul>
  </section>
</template>
