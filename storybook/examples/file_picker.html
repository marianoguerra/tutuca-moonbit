<script type="tutuca/spec">
  state {
    name : String
    size : Double
    type : String
    lastModified : Double
    hasFile : Bool

    /// A file has a length and an epoch timestamp; neither runs backwards.
    where size >= 0
    where lastModified >= 0

    /// `hasFile` is the flag every row in the table hangs off, and the four
    /// fields beside it are what it promises are filled in. The one that
    /// cannot be empty is the name — a picked file always has one, and a
    /// table saying otherwise means the flag and the fields disagreed.
    invariant pickedFileIsDescribed
      format 'the file table is showing, but no file name came with it' {
        .hasFile implies ((len .name) > 0)
      }
  }
</script>

<template>
  <section class="flex flex-col gap-3">
    <label class="flex flex-col gap-1">
      <span>Pick a file</span>
      <input type="file" class="file-input" @on.change="onPickFile e.value">
    </label>

    <table class="table" @show=".hasFile">
      <tbody>
        <tr><th>Name</th><td class="fname" @text=".name"></td></tr>
        <tr><th>Size</th><td class="fsize" @text="$sizeLabel"></td></tr>
        <tr><th>Type</th><td class="ftype" @text="$typeLabel"></td></tr>
        <tr><th>Last modified</th><td class="fmodified" @text="$lastModifiedLabel"></td></tr>
      </tbody>
    </table>

    <p class="empty" @hide=".hasFile">No file selected yet — pick one above.</p>
  </section>
</template>
